---
- name: Проверить сертификат PVE
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.pve.ca_source }}"
  register: pve_ca

- name: Подтвердить сертификат PVE
  ansible.builtin.assert:
    that:
      - pve_ca.stat.exists
      - pve_ca.stat.size | int > 0
    fail_msg: "PVE CA отсутствует в постоянном каталоге доступа"

- name: Подготовить временный каталог хостовых сценариев
  ansible.builtin.file:
    path: /run/infra-manager/host-support
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Подготовить актуальный PVE-only сценарий OpenBao
  ansible.builtin.copy:
    src: "{{ project_root }}/scripts/infra-manager/host/openbao-unseal.py"
    dest: /run/infra-manager/host-support/openbao-unseal.py
    owner: root
    group: root
    mode: "0755"

- name: Подготовить идентичность infra-manager для PVE OpenBao
  ansible.builtin.copy:
    dest: /run/infra-manager/host-support/openbao-host.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        {
          'vmid': guest_manifest.vmid | int,
          'name': guest_manifest.name,
          'address': ansible_host | default(inventory_hostname)
        } | to_nice_json
      }}

- name: Передать актуальный сценарий OpenBao на PVE
  ansible.builtin.command:
    argv:
      - scp
      - -i
      - "{{ provision.access_materialization.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access_materialization.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - /run/infra-manager/host-support/openbao-unseal.py
      - "root@{{ infra_pve_node }}:/tmp/infra-manager-openbao-unseal.new"
  changed_when: true

- name: Передать идентичность infra-manager на PVE
  ansible.builtin.command:
    argv:
      - scp
      - -i
      - "{{ provision.access_materialization.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access_materialization.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - /run/infra-manager/host-support/openbao-host.json
      - "root@{{ infra_pve_node }}:/tmp/infra-manager-openbao-host.json.new"
  changed_when: true

- name: Установить актуальный PVE-only сценарий OpenBao
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ provision.access_materialization.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access_materialization.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - "root@{{ infra_pve_node }}"
      - >-
        install -o root -g root -m 0755
        /tmp/infra-manager-openbao-unseal.new
        /usr/local/sbin/infra-manager-openbao-unseal
        && install -d -o root -g root -m 0755 /etc/infra-manager
        && install -o root -g root -m 0644
        /tmp/infra-manager-openbao-host.json.new
        /etc/infra-manager/openbao-host.json
        && rm -f
        /tmp/infra-manager-openbao-unseal.new
        /tmp/infra-manager-openbao-host.json.new
  changed_when: true

- name: Подготовить TLS OpenBao на PVE
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ provision.access_materialization.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access_materialization.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - "root@{{ infra_pve_node }}"
      - /usr/local/sbin/infra-manager-openbao-unseal
      - --prepare-tls
      - --log-level
      - quiet
  changed_when: false

- name: Подготовить каталог TLS OpenBao внутри infra-manager
  ansible.builtin.file:
    path: "{{ provision.access_materialization.openbao_tls.target }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Установить TLS material OpenBao
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access_materialization.openbao_tls.source }}/{{ item.name }}"
    dest: "{{ provision.access_materialization.openbao_tls.target }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: ca.crt, mode: "0644" }
    - { name: server.crt, mode: "0644" }
    - { name: server.key, mode: "0600" }

- name: Проверить TLS certificate OpenBao
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - "{{ provision.access_materialization.openbao_tls.target }}/ca.crt"
      - "{{ provision.access_materialization.openbao_tls.target }}/server.crt"
  changed_when: false

- name: Установить сертификат PVE в систему
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access_materialization.pve.ca_source }}"
    dest: /usr/local/share/ca-certificates/pve-root-ca.crt
    owner: root
    group: root
    mode: "0644"

- name: Обновить системные сертификаты
  ansible.builtin.command:
    argv:
      - update-ca-certificates
  changed_when: false

- name: Подготовить общий набор сертификатов
  ansible.builtin.shell: |
    set -eu
    cat /etc/ssl/certs/ca-certificates.crt         "{{ provision.access_materialization.pve.ca_source }}"         > "{{ provision.paths.ca }}/ca-bundle.crt.tmp"
    chmod 0644 "{{ provision.paths.ca }}/ca-bundle.crt.tmp"
    mv "{{ provision.paths.ca }}/ca-bundle.crt.tmp" "{{ provision.paths.ca }}/ca-bundle.crt"
  args:
    executable: /bin/bash

- name: Подготовить временную область рабочих секретов
  ansible.builtin.file:
    path: /run/infra-manager/secrets
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Восстановить рабочие секреты из OpenBao при повторной настройке
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ provision.access_materialization.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access_materialization.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - "root@{{ infra_pve_node }}"
      - /usr/local/sbin/infra-manager-openbao-unseal
  register: openbao_secret_restore
  changed_when: false
  failed_when: false

- name: Проверить рабочий PVE API credential после OpenBao
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.pve.runtime_credential }}"
  register: runtime_pve_credential

- name: Проверить временный bootstrap PVE API credential
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.pve.staging_credential }}"
  register: staged_pve_credential
  when: not runtime_pve_credential.stat.exists

- name: Подготовить PVE API credential первого запуска
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access_materialization.pve.staging_credential }}"
    dest: "{{ provision.access_materialization.pve.runtime_credential }}"
    owner: "1001"
    group: "0"
    mode: "0600"
  no_log: true
  when:
    - not runtime_pve_credential.stat.exists
    - staged_pve_credential.stat.exists | default(false)

- name: Проверить рабочий доступ к PVE
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.pve.runtime_credential }}"
  register: final_pve_credential

- name: Подтвердить рабочий доступ к PVE
  ansible.builtin.assert:
    that:
      - final_pve_credential.stat.exists
      - final_pve_credential.stat.size | int > 0
    fail_msg: >-
      PVE API credential не восстановлен из OpenBao и не передан
      временным bootstrap-контуром

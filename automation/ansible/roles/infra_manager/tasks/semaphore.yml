---
- name: Проверить настройки Semaphore
  ansible.builtin.stat:
    path: "{{ provision.paths.secrets }}/semaphore-server.env"
  register: semaphore_env

- name: Создать пароль Semaphore
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "24"]
  register: semaphore_admin_password
  no_log: true
  changed_when: true
  when: not semaphore_env.stat.exists

- name: Создать ключ защиты Semaphore
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "32"]
  register: semaphore_encryption_key
  no_log: true
  changed_when: true
  when: not semaphore_env.stat.exists

- name: Сохранить настройки Semaphore
  ansible.builtin.copy:
    dest: "{{ provision.paths.secrets }}/semaphore-server.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      SEMAPHORE_DB_DIALECT=sqlite
      SEMAPHORE_DB_HOST=/var/lib/semaphore/semaphore.sqlite
      SEMAPHORE_ADMIN=admin
      SEMAPHORE_ADMIN_PASSWORD={{ semaphore_admin_password.stdout | default('') }}
      SEMAPHORE_ADMIN_NAME=Admin
      SEMAPHORE_ADMIN_EMAIL=admin@localhost
      SEMAPHORE_ACCESS_KEY_ENCRYPTION={{ semaphore_encryption_key.stdout | default('') }}
      TZ={{ ansible_facts.date_time.tz | default('UTC') }}
  no_log: true
  when: not semaphore_env.stat.exists

- name: Сохранить пароль Semaphore
  ansible.builtin.copy:
    dest: "{{ provision.paths.secrets }}/initial-admin-password"
    owner: root
    group: root
    mode: "0600"
    content: "{{ semaphore_admin_password.stdout | default('') }}\n"
  no_log: true
  when: not semaphore_env.stat.exists

- name: Проверить пароль Semaphore
  ansible.builtin.stat:
    path: "{{ provision.paths.secrets }}/initial-admin-password"
  register: semaphore_admin_password_file

- name: Проверить сохранённые настройки Semaphore
  ansible.builtin.assert:
    that:
      - semaphore_admin_password_file.stat.exists
      - semaphore_admin_password_file.stat.size | int > 0
    fail_msg: "Есть semaphore-server.env, но отсутствует initial-admin-password"
  when: semaphore_env.stat.exists

- name: Удалить старую настройку исполнителя Semaphore
  ansible.builtin.lineinfile:
    path: "{{ provision.paths.secrets }}/semaphore-server.env"
    regexp: "{{ item }}"
    state: absent
  loop:
    - "^SEMAPHORE_USE_REMOTE_RUNNER="
    - "^SEMAPHORE_RUNNER_REGISTRATION_TOKEN="
  no_log: true

- name: Удалить старый файл исполнителя Semaphore
  ansible.builtin.file:
    path: "{{ provision.paths.secrets }}/semaphore-runner.env"
    state: absent

- name: Подготовить временную область рабочих секретов
  ansible.builtin.file:
    path: /run/infra-manager/secrets
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Восстановить рабочие секреты из OpenBao при повторной настройке
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ provision.access.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - "root@{{ infra_pve_node }}"
      - /usr/local/sbin/infra-manager-openbao-unseal
  register: openbao_secret_restore
  changed_when: false
  failed_when: false

- name: Подготовить PVE API credential до первой миграции в OpenBao
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access.pve.staging_credential }}"
    dest: /run/infra-manager/secrets/pve-api.env
    owner: "1001"
    group: "0"
    mode: "0600"
    force: false
  no_log: true

- name: Подготовить Git credential до первой миграции в OpenBao
  ansible.builtin.copy:
    remote_src: true
    src: /mnt/pve-access/github/github_proxmox_repo_ed25519
    dest: /run/infra-manager/secrets/github_proxmox_repo_ed25519
    owner: "1001"
    group: "0"
    mode: "0600"
    force: false
  no_log: true

- name: Подготовить настройки Semaphore до первой миграции в OpenBao
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.secrets }}/semaphore-server.env"
    dest: /run/infra-manager/secrets/semaphore-server.env
    owner: "1001"
    group: "0"
    mode: "0600"
    force: false
  no_log: true

- name: Подготовить пароль Semaphore до первой миграции в OpenBao
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.secrets }}/initial-admin-password"
    dest: /run/infra-manager/secrets/initial-admin-password
    owner: "1001"
    group: "0"
    mode: "0600"
    force: false
  no_log: true

- name: Проверить старый API token Semaphore
  ansible.builtin.stat:
    path: "{{ provision.paths.secrets }}/semaphore-api-token"
  register: legacy_semaphore_api_token

- name: Переиспользовать старый API token Semaphore до миграции
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.secrets }}/semaphore-api-token"
    dest: /run/infra-manager/secrets/semaphore-api-token
    owner: "1001"
    group: "0"
    mode: "0600"
    force: false
  no_log: true
  when: legacy_semaphore_api_token.stat.exists

- name: Подготовить список гостей для OpenTofu
  ansible.builtin.command:
    argv:
      - python3
      - "{{ provision.paths.bootstrap_repository }}/scripts/guests/render-opentofu-input.py"
      - --output
      - "{{ provision.paths.opentofu_data }}/guests.json"
      - --exclude-vmid
      - "910"
  changed_when: true

- name: Защитить список гостей OpenTofu
  ansible.builtin.file:
    path: "{{ provision.paths.opentofu_data }}/guests.json"
    owner: "1001"
    group: "0"
    mode: "0640"

---
- name: Проверить рабочие настройки Semaphore
  ansible.builtin.stat:
    path: /run/infra-manager/secrets/semaphore-server.env
  register: semaphore_env

- name: Создать пароль Semaphore первого запуска
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "24"]
  register: semaphore_admin_password
  no_log: true
  changed_when: true
  when: not semaphore_env.stat.exists

- name: Создать ключ защиты Semaphore первого запуска
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "32"]
  register: semaphore_encryption_key
  no_log: true
  changed_when: true
  when: not semaphore_env.stat.exists

- name: Подготовить рабочие настройки Semaphore первого запуска
  ansible.builtin.copy:
    dest: /run/infra-manager/secrets/semaphore-server.env
    owner: "1001"
    group: "0"
    mode: "0600"
    content: |
      SEMAPHORE_DB_DIALECT=sqlite
      SEMAPHORE_DB_HOST=/var/lib/semaphore/semaphore.sqlite
      SEMAPHORE_ADMIN=admin
      SEMAPHORE_ADMIN_PASSWORD={{ semaphore_admin_password.stdout | default('') }}
      SEMAPHORE_ADMIN_NAME=Admin
      SEMAPHORE_ADMIN_EMAIL=admin@localhost
      SEMAPHORE_ACCESS_KEY_ENCRYPTION={{ semaphore_encryption_key.stdout | default('') }}
      TZ={{ ansible_facts.date_time.tz | default('UTC') }}
  no_log: true
  when: not semaphore_env.stat.exists

- name: Подготовить первичный пароль Semaphore
  ansible.builtin.copy:
    dest: /run/infra-manager/secrets/initial-admin-password
    owner: "1001"
    group: "0"
    mode: "0600"
    content: "{{ semaphore_admin_password.stdout | default('') }}\n"
  no_log: true
  when: not semaphore_env.stat.exists

- name: Проверить первичный пароль Semaphore
  ansible.builtin.stat:
    path: /run/infra-manager/secrets/initial-admin-password
  register: semaphore_admin_password_file

- name: Подтвердить рабочие настройки Semaphore
  ansible.builtin.assert:
    that:
      - semaphore_admin_password_file.stat.exists
      - semaphore_admin_password_file.stat.size | int > 0
    fail_msg: >-
      Рабочие настройки Semaphore есть, но первичный пароль не восстановлен
      из OpenBao и не создан при первом запуске.

- name: Удалить старую настройку исполнителя Semaphore
  ansible.builtin.lineinfile:
    path: /run/infra-manager/secrets/semaphore-server.env
    regexp: "{{ item }}"
    state: absent
  loop:
    - "^SEMAPHORE_USE_REMOTE_RUNNER="
    - "^SEMAPHORE_RUNNER_REGISTRATION_TOKEN="
  no_log: true

- name: Удалить старый рабочий файл исполнителя Semaphore
  ansible.builtin.file:
    path: /run/infra-manager/secrets/semaphore-runner.env
    state: absent

- name: Проверить Git credential после восстановления OpenBao
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.github.private_key }}"
  register: runtime_git_credential

- name: Проверить временный bootstrap Git credential
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.github.staging_credential }}"
  register: staged_git_credential
  when: not runtime_git_credential.stat.exists

- name: Подготовить Git credential первого запуска
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access_materialization.github.staging_credential }}"
    dest: "{{ provision.access_materialization.github.private_key }}"
    owner: "1001"
    group: "0"
    mode: "0600"
  no_log: true
  when:
    - not runtime_git_credential.stat.exists
    - staged_git_credential.stat.exists | default(false)

- name: Проверить рабочий Git credential
  ansible.builtin.stat:
    path: "{{ provision.access_materialization.github.private_key }}"
  register: final_git_credential

- name: Подтвердить рабочий Git credential
  ansible.builtin.assert:
    that:
      - final_git_credential.stat.exists
      - final_git_credential.stat.size | int > 0
    fail_msg: >-
      Git credential не восстановлен из OpenBao и не передан
      временным bootstrap-контуром.

- name: Подготовить список гостей для OpenTofu
  ansible.builtin.command:
    argv:
      - python3
      - "{{ provision.paths.bootstrap_repository }}/scripts/guests/render-opentofu-input.py"
      - --output
      - "{{ provision.paths.opentofu_data }}/guests.json"
      - --exclude-vmid
      - "910"
  changed_when: true

- name: Защитить список гостей OpenTofu
  ansible.builtin.file:
    path: "{{ provision.paths.opentofu_data }}/guests.json"
    owner: "1001"
    group: "0"
    mode: "0640"

---
- name: Записать версии управляющих средств
  ansible.builtin.copy:
    dest: "{{ provision.paths.compose }}/.versions.env"
    owner: root
    group: root
    mode: "0644"
    content: |
      SEMAPHORE_VERSION={{ provision.docker.services.runtime.base_image.split(':')[-1] }}
      RUNTIME_VERSION={{ provision.docker.services.runtime.image.split(':')[-1] }}
      OPENTOFU_VERSION={{ provision.docker.services.runtime.tools.opentofu }}
      PACKER_VERSION={{ provision.docker.services.runtime.tools.packer }}
      OPENBAO_VERSION={{ provision.docker.services.openbao.image.split(':')[-1] }}
  register: infra_compose_versions

- name: Установить описание состояния infra-manager
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/infrastructure/guests/{{ guest }}/infra-manager-status.yaml"
    dest: "{{ provision.paths.configuration }}/status.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Установить служебный код infra-manager
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/infra_manager/"
    dest: "{{ provision.paths.python_package }}/infra_manager/"
    owner: root
    group: root
    mode: preserve

- name: Установить команды управления
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/commands/{{ item.source }}"
    dest: "/usr/local/sbin/{{ item.target }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { source: operator.sh, target: infra-manager }
    - { source: python-command.sh, target: infra-manager-status }
    - { source: activate-runtime.sh, target: infra-manager-activate-runtime }
    - { source: openbao-startup-unseal.sh, target: infra-manager-openbao-startup-unseal }

- name: Установить службу действий локального портала
  ansible.builtin.copy:
    src: "{{ guest_root }}/rootfs/etc/systemd/system/infra-manager-portal-gateway.service"
    dest: /etc/systemd/system/infra-manager-portal-gateway.service
    owner: root
    group: root
    mode: "0644"
  register: portal_gateway_unit

- name: Включить службу действий локального портала
  ansible.builtin.systemd_service:
    name: infra-manager-portal-gateway.service
    enabled: true
    state: "{{ 'restarted' if portal_gateway_unit.changed else 'started' }}"
    daemon_reload: "{{ portal_gateway_unit.changed }}"

- name: Сделать команду состояния доступной через pct exec
  ansible.builtin.file:
    src: /usr/local/sbin/infra-manager-status
    dest: /usr/bin/infra-manager-status
    state: link
    force: true

- name: Установить запуск разблокировки OpenBao вместе с infra-manager
  ansible.builtin.template:
    src: "{{ guest_root }}/rootfs/etc/systemd/system/infra-manager-openbao-startup-unseal.service.j2"
    dest: /etc/systemd/system/infra-manager-openbao-startup-unseal.service
    owner: root
    group: root
    mode: "0644"
  register: openbao_startup_unit

- name: Включить разблокировку OpenBao при запуске infra-manager
  ansible.builtin.systemd_service:
    name: infra-manager-openbao-startup-unseal.service
    enabled: true
    daemon_reload: "{{ openbao_startup_unit.changed }}"

- name: Настроить владельца данных Semaphore
  ansible.builtin.file:
    path: "{{ provision.paths.semaphore_persistent_data }}"
    owner: "1001"
    group: "0"
    recurse: true

- name: Настроить права каталогов Semaphore
  ansible.builtin.command:
    argv:
      - find
      - "{{ provision.paths.semaphore_persistent_data }}"
      - -type
      - d
      - -exec
      - chmod
      - "0770"
      - "{}"
      - "+"
  changed_when: true

- name: Настроить права файлов Semaphore
  ansible.builtin.command:
    argv:
      - find
      - "{{ provision.paths.semaphore_persistent_data }}"
      - -type
      - f
      - -exec
      - chmod
      - "0660"
      - "{}"
      - "+"
  changed_when: true

- name: Проверить доступ к источникам сборки управляющей среды
  ansible.builtin.command:
    argv:
      - python3
      - "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/jobs/check-runtime-downloads.py"
      - --packer-version
      - "{{ provision.docker.services.runtime.tools.packer }}"
      - --opentofu-version
      - "{{ provision.docker.services.runtime.tools.opentofu }}"
  register: infra_runtime_download_check
  changed_when: false
  failed_when: false

- name: Сообщить причину недоступности источников сборки
  ansible.builtin.fail:
    msg: "{{ infra_runtime_download_check.stdout | trim if (infra_runtime_download_check.stdout | default('') | trim) else 'Проверка внешних источников не запустилась. Проверьте python3 и curl в госте.' }}"
  when: infra_runtime_download_check.rc != 0

- name: Собрать управляющую среду
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - build
      - --pull
      - runtime
  changed_when: true



- name: Перезапустить OpenBao после изменения конфигурации
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - up
      - -d
      - --force-recreate
      - openbao
  changed_when: true
  when: >-
    infra_compose_files.changed
    or infra_compose_versions.changed
    or (openbao_tls_files.results | selectattr('changed') | list | length > 0)

- name: Подтвердить запуск OpenBao без повторного создания
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - up
      - -d
      - openbao
  changed_when: true
  when: >-
    not (
      infra_compose_files.changed
      or infra_compose_versions.changed
      or (openbao_tls_files.results | selectattr('changed') | list | length > 0)
    )

- name: Запустить управляющую среду
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - up
      - -d
      - --remove-orphans
  changed_when: true
  when: not (infra_self_update | default(false) | bool)

---
- name: Записать версии управляющих средств
  ansible.builtin.copy:
    dest: "{{ provision.paths.compose }}/.versions.env"
    owner: root
    group: root
    mode: "0644"
    content: |
      SEMAPHORE_VERSION={{ provision.docker.services.runtime.base_image.split(':')[-1] }}
      RUNTIME_VERSION={{ provision.docker.services.runtime.image.split(':')[-1] }}
      OPENTOFU_VERSION={{ provision.docker.services.runtime.tools.opentofu }}
      PACKER_VERSION={{ provision.docker.services.runtime.tools.packer }}
      OPENBAO_VERSION={{ provision.docker.services.openbao.image.split(':')[-1] }}

- name: Установить описание состояния 910
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/infrastructure/guests/{{ guest }}/status.yaml"
    dest: "{{ provision.paths.configuration }}/status.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Установить служебный код 910
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/infra_manager/"
    dest: "{{ provision.paths.python_package }}/infra_manager/"
    owner: root
    group: root
    mode: preserve

- name: Установить команды управления
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/commands/{{ item.source }}"
    dest: "/usr/local/sbin/{{ item.target }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { source: status.sh, target: infra-manager-status }
    - { source: pve-access-check.sh, target: infra-manager-pve-access-check }
    - { source: pve-lifecycle-test.sh, target: infra-manager-pve-lifecycle-test }
    - { source: activate-runtime.sh, target: infra-manager-activate-runtime }
    - { source: openbao-startup-unseal.sh, target: infra-manager-openbao-startup-unseal }
    - { source: machine-ssh-refresh.sh, target: infra-manager-machine-ssh-refresh }

- name: Создать короткие команды управления
  ansible.builtin.file:
    src: "/usr/local/sbin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - infra-manager-status
    - infra-manager-pve-access-check
    - infra-manager-pve-lifecycle-test

- name: Сделать команду состояния доступной через pct exec
  ansible.builtin.file:
    src: /usr/local/sbin/infra-manager-status
    dest: /usr/bin/infra-manager-status
    state: link
    force: true

- name: Установить запуск разблокировки OpenBao вместе с 910
  ansible.builtin.template:
    src: "{{ guest_root }}/systemd/infra-manager-openbao-startup-unseal.service.j2"
    dest: /etc/systemd/system/infra-manager-openbao-startup-unseal.service
    owner: root
    group: root
    mode: "0644"

- name: Включить разблокировку OpenBao при запуске 910
  ansible.builtin.systemd_service:
    name: infra-manager-openbao-startup-unseal.service
    enabled: true
    daemon_reload: true

- name: Установить службу обновления межмашинного SSH
  ansible.builtin.template:
    src: "{{ guest_root }}/systemd/infra-manager-machine-ssh-refresh.service.j2"
    dest: /etc/systemd/system/infra-manager-machine-ssh-refresh.service
    owner: root
    group: root
    mode: "0644"

- name: Установить таймер обновления межмашинного SSH
  ansible.builtin.template:
    src: "{{ guest_root }}/systemd/infra-manager-machine-ssh-refresh.timer.j2"
    dest: /etc/systemd/system/infra-manager-machine-ssh-refresh.timer
    owner: root
    group: root
    mode: "0644"

- name: Включить обновление межмашинных SSH-сертификатов
  ansible.builtin.systemd_service:
    name: infra-manager-machine-ssh-refresh.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Убрать старую периодическую разблокировку OpenBao с PVE
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ provision.access_materialization.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access_materialization.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - "root@{{ infra_pve_node }}"
      - >-
        systemctl disable --now
        infra-manager-openbao-unseal.timer
        infra-manager-openbao-unseal.service
        >/dev/null 2>&1 || true;
        rm -f
        /etc/systemd/system/infra-manager-openbao-unseal.timer
        /etc/systemd/system/infra-manager-openbao-unseal.service
        /etc/systemd/system/timers.target.wants/infra-manager-openbao-unseal.timer
        /etc/systemd/system/multi-user.target.wants/infra-manager-openbao-unseal.service;
        systemctl daemon-reload
  changed_when: true

- name: Настроить владельца данных Semaphore
  ansible.builtin.file:
    path: "{{ provision.paths.semaphore_persistent_data }}"
    owner: "1001"
    group: "0"
    recurse: true

- name: Настроить права каталогов Semaphore
  ansible.builtin.command:
    argv:
      - find
      - "{{ provision.paths.semaphore_persistent_data }}"
      - -type
      - d
      - -exec
      - chmod
      - "0770"
      - "{}"
      - "+"
  changed_when: true

- name: Настроить права файлов Semaphore
  ansible.builtin.command:
    argv:
      - find
      - "{{ provision.paths.semaphore_persistent_data }}"
      - -type
      - f
      - -exec
      - chmod
      - "0660"
      - "{}"
      - "+"
  changed_when: true

- name: Собрать управляющую среду
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - build
      - --pull
      - runtime
  changed_when: true

- name: Запустить OpenBao
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - up
      - -d
      - openbao
  changed_when: true

- name: Запустить управляющую среду
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - up
      - -d
      - --remove-orphans
  changed_when: true
  when: not (infra_self_update | default(false) | bool)

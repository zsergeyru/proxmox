---
- name: Дождаться запуска OpenBao
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8200
    timeout: 120

- name: Прочитать состояние OpenBao
  ansible.builtin.uri:
    url: "{{ provision.docker.services.openbao.api_address }}/v1/sys/seal-status"
    method: GET
    return_content: true
    status_code: 200
  register: openbao_seal_status
  changed_when: false

- name: Подтвердить состояние OpenBao
  ansible.builtin.assert:
    that:
      - openbao_seal_status.json.initialized is defined
      - openbao_seal_status.json.sealed is defined
    fail_msg: "OpenBao запущен, но не возвращает корректное состояние"

- name: Разблокировать инициализированный OpenBao через PVE
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ provision.access.pve.root_ssh_private_key }}"
      - -o
      - "UserKnownHostsFile={{ provision.access.pve.root_ssh_known_hosts }}"
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - "root@{{ infra_pve_node }}"
      - /usr/local/sbin/infra-manager-openbao-unseal
  changed_when: false
  when: openbao_seal_status.json.initialized | bool

- name: Подтвердить разблокировку OpenBao
  ansible.builtin.uri:
    url: "{{ provision.docker.services.openbao.api_address }}/v1/sys/seal-status"
    method: GET
    return_content: true
    status_code: 200
  register: openbao_unsealed_status
  changed_when: false
  failed_when:
    - openbao_unsealed_status.json.initialized | bool
    - openbao_unsealed_status.json.sealed | bool

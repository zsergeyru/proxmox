---
- name: Проверить подключение данных доступа PVE
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.persistence.target_layout.access.guest_path }}"
  changed_when: false

- name: Проверить подключение постоянного состояния
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.persistence.target_layout.state.guest_path }}"
  changed_when: false

- name: Убрать переходное подключение старых secret-файлов
  ansible.builtin.shell: |
    set -eu
    target=/etc/infra-manager/secrets
    legacy=/mnt/persistent-state/secrets
    if [ -L "$target" ]; then
      [ "$(readlink -f "$target")" = "$legacy" ] || {
        echo "ОШИБКА: $target указывает не на старый каталог проекта" >&2
        exit 42
      }
      rm -f "$target"
      echo "removed:$target"
      exit 0
    fi
    if [ -d "$target" ]; then
      [ -z "$(find "$target" -mindepth 1 -print -quit)" ] || {
        echo "ОШИБКА: $target содержит неизвестные данные" >&2
        exit 43
      }
      rmdir "$target"
      echo "removed:$target"
    elif [ -e "$target" ]; then
      echo "ОШИБКА: $target имеет неожиданный тип" >&2
      exit 44
    fi
  args:
    executable: /bin/bash
  register: legacy_secret_link
  changed_when: "'removed:' in legacy_secret_link.stdout"

- name: Проверить старые пути перед подключением состояния
  ansible.builtin.shell: |
    set -eu
    target="{{ item.target }}"
    source="{{ item.source }}"
    if [ -L "$target" ]; then
      [ "$(readlink -f "$target")" = "$source" ] || {
        echo "ОШИБКА: $target указывает не на $source" >&2
        exit 42
      }
      exit 0
    fi
    if [ -e "$target" ]; then
      if [ -d "$target" ] && [ -z "$(find "$target" -mindepth 1 -print -quit)" ]; then
        exit 0
      fi
      echo "ОШИБКА: $target содержит данные старой схемы; требуется ручная миграция" >&2
      exit 43
    fi
  args:
    executable: /bin/bash
  loop: "{{ provision.persistence.target_layout.state.bindings }}"
  changed_when: false

- name: Создать основные каталоги 910
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ provision.paths.configuration }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.ca }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.data }}", owner: root, group: root, mode: "0755" }
    - { path: /var/lib/persistent, owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.compose }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.python_package }}", owner: root, group: root, mode: "0755" }

- name: Создать каталоги постоянного состояния
  ansible.builtin.file:
    path: "{{ item.source }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ provision.persistence.target_layout.state.bindings }}"

- name: Создать каталог OpenTofu state
  ansible.builtin.file:
    path: "{{ provision.paths.opentofu_persistent_state_dir }}"
    state: directory
    owner: "1001"
    group: "0"
    mode: "0750"

- name: Подключить постоянное состояние к привычным путям 910
  ansible.builtin.shell: |
    set -eu
    target="{{ item.target }}"
    source="{{ item.source }}"
    if [ -L "$target" ]; then
      [ "$(readlink -f "$target")" = "$source" ]
      exit 0
    fi
    if [ -d "$target" ]; then
      rmdir "$target"
    fi
    ln -s "$source" "$target"
    echo "created:$target"
  args:
    executable: /bin/bash
  loop: "{{ provision.persistence.target_layout.state.bindings }}"
  register: persistent_state_links
  changed_when: "'created:' in persistent_state_links.stdout"

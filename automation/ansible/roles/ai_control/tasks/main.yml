---
- name: Проверить контракт AI Control
  ansible.builtin.assert:
    that:
      - (guest_manifest.role | default('')) == "ai-control"
      - provision.ai_control is defined
      - provision.ai_control.agent.primary == "hermes"
      - provision.ai_control.agent.image is defined
      - provision.ai_control.agent.uid | int > 0
      - provision.ai_control.agent.gid | int > 0
      - provision.ai_control.agent.api.enabled | bool
      - provision.ai_control.agent.api.host == "127.0.0.1"
      - provision.ai_control.agent.api.port | int > 0
      - provision.ai_control.agent.api.port | int < 65536
      - provision.ai_control.web.provider == "open-webui"
      - provision.ai_control.web.image is defined
      - provision.ai_control.web.port | int > 0
      - provision.ai_control.web.port | int < 65536
      - provision.ai_control.paths.compose_file is defined
      - provision.ai_control.paths.hermes_data is defined
      - provision.ai_control.paths.open_webui_data is defined
      - provision.docker is defined
      - provision.docker.required_packages is defined
    fail_msg: "Для роли ai_control требуется контракт Hermes + Open WebUI + Docker"

- name: Создать системные каталоги AI Control
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ provision.ai_control.paths.root }}"
      mode: "0755"
    - path: "{{ provision.ai_control.paths.compose }}"
      mode: "0755"
    - path: "{{ provision.ai_control.paths.state }}"
      mode: "0711"
    - path: "{{ provision.ai_control.paths.open_webui_data }}"
      mode: "0700"
    - path: "{{ provision.ai_control.paths.configuration }}"
      mode: "0700"

- name: Подготовить постоянный каталог Hermes
  ansible.builtin.file:
    path: "{{ provision.ai_control.paths.hermes_data }}"
    state: directory
    owner: "{{ provision.ai_control.agent.uid }}"
    group: "{{ provision.ai_control.agent.gid }}"
    mode: "0700"

- name: Подготовить каталог ограниченного инструмента PVE
  ansible.builtin.file:
    path: "{{ provision.ai_control.paths.hermes_data }}/skills/infra-manager"
    state: directory
    owner: "{{ provision.ai_control.agent.uid }}"
    group: "{{ provision.ai_control.agent.gid }}"
    mode: "0700"
  when:
    - (provision_phase | default('full')) == 'full'
    - infra_pve_agent_enabled | default(false) | bool

- name: Установить программу и описание навыка infra-manager
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ provision.ai_control.paths.hermes_data }}/skills/infra-manager/{{ item.target }}"
    owner: "{{ provision.ai_control.agent.uid }}"
    group: "{{ provision.ai_control.agent.gid }}"
    mode: "0644"
  loop:
    - source: pve-infra-manager.py
      target: pve-infra-manager.py
    - source: pve-infra-manager-SKILL.md
      target: SKILL.md
  when:
    - (provision_phase | default('full')) == 'full'
    - infra_pve_agent_enabled | default(false) | bool

- name: Установить ограниченную OpenBao-идентичность Hermes без вывода секрета
  ansible.builtin.copy:
    src: "{{ infra_pve_agent_identity_file }}"
    dest: "{{ provision.ai_control.paths.hermes_data }}/skills/infra-manager/identity.json"
    owner: "{{ provision.ai_control.agent.uid }}"
    group: "{{ provision.ai_control.agent.gid }}"
    mode: "0600"
  no_log: true
  when:
    - (provision_phase | default('full')) == 'full'
    - infra_pve_agent_enabled | default(false) | bool

- name: Установить доверенные сертификаты для канала 410 к PVE
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ provision.ai_control.paths.hermes_data }}/skills/infra-manager/{{ item.target }}"
    owner: "{{ provision.ai_control.agent.uid }}"
    group: "{{ provision.ai_control.agent.gid }}"
    mode: "0644"
  loop:
    - source: "{{ infra_pve_agent_ca_file | default('') }}"
      target: ca.crt
    - source: "{{ infra_pve_agent_known_hosts_file | default('') }}"
      target: known_hosts
  when:
    - (provision_phase | default('full')) == 'full'
    - infra_pve_agent_enabled | default(false) | bool

- name: Отозвать локальный ограниченный инструмент при отсутствии права
  ansible.builtin.file:
    path: "{{ provision.ai_control.paths.hermes_data }}/skills/infra-manager"
    state: absent
  when:
    - (provision_phase | default('full')) == 'full'
    - not (infra_pve_agent_enabled | default(false) | bool)

- name: Проверить секреты Hermes
  ansible.builtin.stat:
    path: "{{ provision.ai_control.paths.hermes_env }}"
  register: ai_control_hermes_env_file

- name: Создать ключ API Hermes
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import secrets; print(secrets.token_urlsafe(36))"
  changed_when: false
  no_log: true
  register: ai_control_generated_hermes_api_key
  when: not ai_control_hermes_env_file.stat.exists

- name: Сохранить конфигурацию API Hermes
  ansible.builtin.copy:
    dest: "{{ provision.ai_control.paths.hermes_env }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      API_SERVER_ENABLED=true
      API_SERVER_HOST={{ provision.ai_control.agent.api.host }}
      API_SERVER_PORT={{ provision.ai_control.agent.api.port }}
      API_SERVER_MODEL_NAME={{ provision.ai_control.agent.api.model_name }}
      API_SERVER_KEY={{ ai_control_generated_hermes_api_key.stdout }}
  no_log: true
  when: not ai_control_hermes_env_file.stat.exists

- name: Исключить поиск EC2 credentials при запуске Hermes в Proxmox
  ansible.builtin.lineinfile:
    path: "{{ provision.ai_control.paths.hermes_env }}"
    regexp: '^AWS_EC2_METADATA_DISABLED='
    line: 'AWS_EC2_METADATA_DISABLED=true'
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Прочитать конфигурацию API Hermes
  ansible.builtin.slurp:
    src: "{{ provision.ai_control.paths.hermes_env }}"
  no_log: true
  register: ai_control_hermes_env_content

- name: Получить ключ API Hermes
  ansible.builtin.set_fact:
    ai_control_hermes_api_key: >-
      {{
        (
          ai_control_hermes_env_content.content
          | b64decode
          | regex_findall('(?m)^API_SERVER_KEY=(.+)$')
        )[0]
      }}
  no_log: true

- name: Создать начальные секреты Dashboard
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import json,secrets; print(json.dumps({'password':secrets.token_urlsafe(24),'secret':secrets.token_hex(32)}))"
  changed_when: false
  no_log: true
  register: ai_control_dashboard_secrets
  when: provision.ai_control.agent.dashboard.enabled | bool

- name: Настроить вход в Hermes Dashboard без замены существующих секретов
  ansible.builtin.lineinfile:
    path: "{{ provision.ai_control.paths.hermes_env }}"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      value: "{{ provision.ai_control.agent.dashboard.username }}"
    - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      value: "{{ (ai_control_dashboard_secrets.stdout | from_json).password }}"
    - key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      value: "{{ (ai_control_dashboard_secrets.stdout | from_json).secret }}"
  when:
    - provision.ai_control.agent.dashboard.enabled | bool
    - not (ai_control_hermes_env_content.content | b64decode | regex_search('(?m)^' + item.key + '=.+$'))
  no_log: true

- name: Получить закреплённый образ для первоначальной настройки Hermes
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ provision.ai_control.agent.image }}"
  changed_when: false

- name: Получить штатную конфигурацию из закреплённого образа без запуска Gateway
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --workdir
      - /opt/hermes
      - --entrypoint
      - /opt/hermes/.venv/bin/python
      - "{{ provision.ai_control.agent.image }}"
      - -c
      - "import json; from hermes_cli.config import DEFAULT_CONFIG; print(json.dumps(DEFAULT_CONFIG))"
  changed_when: false
  register: ai_control_hermes_defaults
  no_log: true

- name: Подготовить первоначальную конфигурацию и отсутствующие маршруты моделей
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import copy,json,os,pathlib,shutil,tempfile,yaml
        path=pathlib.Path(os.environ['HERMES_CONFIG'])
        config=yaml.safe_load(path.read_text()) if path.exists() else {}
        config=config or {}
        before=json.dumps(config,sort_keys=True)
        initial=json.loads(os.environ['HERMES_INITIAL_CONFIG'])
        if not config:
            config=copy.deepcopy(json.loads(os.environ['HERMES_DEFAULT_CONFIG']))
            config['model']=initial['model']
        if config.get('providers') is None:
            config['providers']={}
        for name,provider in initial.get('providers',{}).items():
            config['providers'].setdefault(name,provider)
        if config.get('gateway') is None:
            config['gateway']={}
        gateway=config['gateway']
        if gateway.get('platforms') is None:
            gateway['platforms']={}
        platforms=gateway['platforms']
        if platforms.get('api_server') is None:
            platforms['api_server']={}
        api=platforms['api_server']
        if api.get('model_routes') is None:
            api['model_routes']={}
        for alias,route in json.loads(os.environ['HERMES_MODEL_ROUTES']).items():
            api['model_routes'].setdefault(alias,route)
        local=config['providers'].get('local') or {}
        if local.get('enabled') and local.get('base_url') and local.get('default_model'):
            api['model_routes'].setdefault('local-model',{
                'model':local['default_model'],'provider':'local'})
        if before != json.dumps(config,sort_keys=True):
            if path.exists() and not path.with_suffix('.yaml.before-model-routes').exists():
                shutil.copy2(path,path.with_suffix('.yaml.before-model-routes'))
            fd,name=tempfile.mkstemp(dir=path.parent,prefix='.config-')
            try:
                with os.fdopen(fd,'w') as stream:
                    yaml.safe_dump(config,stream,allow_unicode=True,sort_keys=False)
                os.chmod(name,0o600)
                os.chown(name,int(os.environ['HERMES_UID']),int(os.environ['HERMES_GID']))
                os.replace(name,path)
            finally:
                if os.path.exists(name):
                    os.unlink(name)
            print('changed')
  environment:
    HERMES_CONFIG: "{{ provision.ai_control.paths.hermes_data }}/config.yaml"
    HERMES_DEFAULT_CONFIG: "{{ ai_control_hermes_defaults.stdout }}"
    HERMES_INITIAL_CONFIG: "{{ provision.ai_control.agent.initial_config | to_json }}"
    HERMES_MODEL_ROUTES: "{{ provision.ai_control.agent.api.model_routes | default({}) | to_json }}"
    HERMES_UID: "{{ provision.ai_control.agent.uid }}"
    HERMES_GID: "{{ provision.ai_control.agent.gid }}"
  register: ai_control_model_routes
  changed_when: "'changed' in ai_control_model_routes.stdout"
  no_log: true

- name: Проверить секреты Open WebUI
  ansible.builtin.stat:
    path: "{{ provision.ai_control.paths.open_webui_env }}"
  register: ai_control_open_webui_env_file

- name: Создать секреты Open WebUI
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import json,secrets;
        print(json.dumps({
        "secret":secrets.token_hex(32),
        "password":secrets.token_urlsafe(24)}))
  changed_when: false
  no_log: true
  register: ai_control_generated_open_webui_secrets
  when: not ai_control_open_webui_env_file.stat.exists

- name: Сохранить секреты Open WebUI
  ansible.builtin.copy:
    dest: "{{ provision.ai_control.paths.open_webui_env }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      OPENAI_API_KEY={{ ai_control_hermes_api_key }}
      WEBUI_SECRET_KEY={{ (ai_control_generated_open_webui_secrets.stdout | from_json).secret }}
      WEBUI_ADMIN_EMAIL={{ provision.ai_control.web.admin_email }}
      WEBUI_ADMIN_PASSWORD={{ (ai_control_generated_open_webui_secrets.stdout | from_json).password }}
      WEBUI_ADMIN_NAME=Administrator
  no_log: true
  when: not ai_control_open_webui_env_file.stat.exists

- name: Синхронизировать ключ Hermes в Open WebUI
  ansible.builtin.lineinfile:
    path: "{{ provision.ai_control.paths.open_webui_env }}"
    regexp: '^OPENAI_API_KEY='
    line: "OPENAI_API_KEY={{ ai_control_hermes_api_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Сформировать Compose AI Control
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ provision.ai_control.paths.compose_file }}"
    owner: root
    group: root
    mode: "0644"
  register: ai_control_compose

- name: Проверить Compose AI Control
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.paths.compose_file }}"
      - config
      - --quiet
  changed_when: false

- name: Получить образы AI Control
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.paths.compose_file }}"
      - pull
  changed_when: false

- name: Запустить AI Control
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.paths.compose_file }}"
      - up
      - -d
      - --remove-orphans
  register: ai_control_compose_up
  changed_when: >-
    'Started' in (ai_control_compose_up.stdout + ai_control_compose_up.stderr)
    or 'Created' in (ai_control_compose_up.stdout + ai_control_compose_up.stderr)
    or 'Recreated' in (ai_control_compose_up.stdout + ai_control_compose_up.stderr)

- name: Перезапустить Hermes после добавления моделей
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.paths.compose_file }}"
      - restart
      - hermes
  when: ai_control_model_routes.changed

- name: Дождаться API Hermes
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ provision.ai_control.agent.api.port }}/health"
    method: GET
    status_code: 200
  register: ai_control_hermes_health
  retries: 30
  delay: 2
  until: ai_control_hermes_health.status == 200

- name: Дождаться Open WebUI
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ provision.ai_control.web.port }}/health"
    method: GET
    status_code: 200
  register: ai_control_open_webui_health
  retries: 60
  delay: 2
  until: ai_control_open_webui_health.status == 200

- name: Дождаться Hermes Dashboard
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ provision.ai_control.agent.dashboard.port }}/login"
    method: GET
    status_code: 200
  register: ai_control_dashboard_health
  retries: 60
  delay: 2
  until: ai_control_dashboard_health.status == 200
  when: provision.ai_control.agent.dashboard.enabled | bool

---
- name: Проверить контракт AI Control
  ansible.builtin.assert:
    that:
      - (guest_manifest.role | default('')) == "ai-control"
      - provision.ai_control is defined
      - provision.ai_control.user is defined
      - provision.ai_control.group is defined
      - provision.ai_control.paths is defined
      - provision.ai_control.service is defined
      - provision.ai_control.agent is defined
      - provision.ai_control.api is defined
      - provision.ai_control.api.listen == "127.0.0.1"
      - provision.ai_control.api.port | int > 0
      - provision.ai_control.api.port | int < 65536
      - provision.ai_control.web is defined
      - provision.ai_control.web.provider == "open-webui"
      - provision.ai_control.web.port | int > 0
      - provision.ai_control.web.port | int < 65536
      - provision.docker is defined
      - provision.docker.required_packages is defined
    fail_msg: "Для роли ai_control требуется полный контракт AI Control и Docker"

- name: Создать системную группу AI Control
  ansible.builtin.group:
    name: "{{ provision.ai_control.group }}"
    system: true
    state: present

- name: Создать системного пользователя AI Control
  ansible.builtin.user:
    name: "{{ provision.ai_control.user }}"
    group: "{{ provision.ai_control.group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ provision.ai_control.paths.state }}"
    create_home: false
    state: present

- name: Создать воспроизводимые каталоги AI Control
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ provision.ai_control.group }}"
    mode: "0755"
  loop:
    - "{{ provision.ai_control.paths.root }}"
    - "{{ provision.ai_control.paths.core }}"
    - "{{ provision.ai_control.paths.core_bin }}"
    - "{{ provision.ai_control.paths.compose }}"
    - "{{ provision.ai_control.paths.agents }}"
    - "{{ provision.ai_control.paths.primary_agent }}"
    - "{{ provision.ai_control.paths.repositories }}"
    - "{{ provision.ai_control.paths.instructions }}"
    - "{{ provision.ai_control.paths.tools }}"

- name: Создать рабочий каталог репозитория
  ansible.builtin.file:
    path: "{{ provision.ai_control.paths.project_repository }}"
    state: directory
    owner: "{{ provision.ai_control.user }}"
    group: "{{ provision.ai_control.group }}"
    mode: "0750"

- name: Создать каталоги состояния AI Control
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ provision.ai_control.paths.state }}"
      owner: "{{ provision.ai_control.user }}"
      group: "{{ provision.ai_control.group }}"
      mode: "0750"
    - path: "{{ provision.ai_control.paths.configuration }}"
      owner: root
      group: "{{ provision.ai_control.group }}"
      mode: "0750"
    - path: "{{ provision.ai_control.paths.runtime }}"
      owner: "{{ provision.ai_control.user }}"
      group: "{{ provision.ai_control.group }}"
      mode: "0750"
    - path: "{{ provision.ai_control.paths.cache }}"
      owner: "{{ provision.ai_control.user }}"
      group: "{{ provision.ai_control.group }}"
      mode: "0750"

- name: Создать внутренние каталоги постоянного состояния
  ansible.builtin.file:
    path: "{{ provision.ai_control.paths.state }}/{{ item }}"
    state: directory
    owner: "{{ provision.ai_control.user }}"
    group: "{{ provision.ai_control.group }}"
    mode: "0750"
  loop: "{{ provision.ai_control.state_directories }}"

- name: Установить минимальное ядро AI Control
  ansible.builtin.copy:
    src: "{{ guest_root }}/rootfs/{{ item.source }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ provision.ai_control.group }}"
    mode: "{{ item.mode }}"
  loop:
    - source: opt/ai-control/core/bin/ai-control
      dest: /opt/ai-control/core/bin/ai-control
      mode: "0755"
    - source: etc/ai-control/models.json
      dest: "{{ provision.ai_control.paths.models_config }}"
      mode: "0640"
    - source: etc/ai-control/tools.json
      dest: "{{ provision.ai_control.paths.tools_config }}"
      mode: "0640"
  register: ai_control_core_files

- name: Удалить устаревший самописный веб-интерфейс
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/ai-control/core/web
    - /etc/ai-control/web.env

- name: Проверить внутренний ключ API AI Control
  ansible.builtin.stat:
    path: "{{ provision.ai_control.paths.api_credentials }}"
  register: ai_control_api_credentials_file

- name: Сформировать внутренний ключ API AI Control
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import secrets; print(secrets.token_urlsafe(36))"
  changed_when: false
  no_log: true
  register: ai_control_generated_api_key
  when: not ai_control_api_credentials_file.stat.exists

- name: Сохранить внутренний ключ API AI Control
  ansible.builtin.copy:
    dest: "{{ provision.ai_control.paths.api_credentials }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      AI_CONTROL_API_KEY={{ ai_control_generated_api_key.stdout }}
      OPENAI_API_KEY={{ ai_control_generated_api_key.stdout }}
  no_log: true
  register: ai_control_api_credentials
  when: not ai_control_api_credentials_file.stat.exists

- name: Проверить данные входа Open WebUI
  ansible.builtin.stat:
    path: "{{ provision.ai_control.paths.open_webui_credentials }}"
  register: ai_control_open_webui_credentials_file

- name: Сформировать секреты Open WebUI
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import json,secrets;
        print(json.dumps({
        "secret":secrets.token_hex(32),
        "password":secrets.token_urlsafe(24)}))
  changed_when: false
  no_log: true
  register: ai_control_generated_open_webui_secrets
  when: not ai_control_open_webui_credentials_file.stat.exists

- name: Сохранить секреты Open WebUI
  ansible.builtin.copy:
    dest: "{{ provision.ai_control.paths.open_webui_credentials }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      WEBUI_SECRET_KEY={{ (ai_control_generated_open_webui_secrets.stdout | from_json).secret }}
      WEBUI_ADMIN_EMAIL={{ provision.ai_control.web.admin_email }}
      WEBUI_ADMIN_PASSWORD={{ (ai_control_generated_open_webui_secrets.stdout | from_json).password }}
      WEBUI_ADMIN_NAME=Administrator
  no_log: true
  register: ai_control_open_webui_credentials
  when: not ai_control_open_webui_credentials_file.stat.exists

- name: Записать несекретную конфигурацию AI Control
  ansible.builtin.copy:
    dest: "{{ provision.ai_control.paths.configuration }}/ai-control.env"
    owner: root
    group: "{{ provision.ai_control.group }}"
    mode: "0640"
    content: |
      AI_CONTROL_ROOT={{ provision.ai_control.paths.root }}
      AI_CONTROL_STATE={{ provision.ai_control.paths.state }}
      AI_CONTROL_RUNTIME={{ provision.ai_control.paths.runtime }}
      AI_CONTROL_CACHE={{ provision.ai_control.paths.cache }}
      AI_CONTROL_PROJECT_REPOSITORY={{ provision.ai_control.paths.project_repository }}
      AI_CONTROL_PRIMARY_AGENT={{ provision.ai_control.agent.primary }}
      AI_CONTROL_API_LISTEN={{ provision.ai_control.api.listen }}
      AI_CONTROL_API_PORT={{ provision.ai_control.api.port }}
      AI_CONTROL_OPENAI_MODEL_ID={{ provision.ai_control.api.openai_model_id }}
      AI_CONTROL_MODELS_FILE={{ provision.ai_control.paths.models_config }}
      AI_CONTROL_TOOLS_FILE={{ provision.ai_control.paths.tools_config }}
  register: ai_control_environment

- name: Сформировать Compose Open WebUI
  ansible.builtin.copy:
    dest: "{{ provision.ai_control.web.compose_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      services:
        open-webui:
          image: {{ provision.ai_control.web.image }}
          container_name: open-webui
          network_mode: host
          restart: unless-stopped
          env_file:
            - {{ provision.ai_control.paths.api_credentials }}
            - {{ provision.ai_control.paths.open_webui_credentials }}
          environment:
            HOST: 0.0.0.0
            PORT: "{{ provision.ai_control.web.port }}"
            WEBUI_NAME: AI Control
            ENABLE_OLLAMA_API: "false"
            ENABLE_SIGNUP: "false"
            OPENAI_API_BASE_URL: "http://127.0.0.1:{{ provision.ai_control.api.port }}/v1"
          volumes:
            - {{ provision.ai_control.paths.open_webui_data }}:/app/backend/data
  register: ai_control_open_webui_compose

- name: Проверить Compose Open WebUI
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.web.compose_file }}"
      - config
      - --quiet
  changed_when: false

- name: Установить systemd-службу AI Control
  ansible.builtin.copy:
    src: "{{ guest_root }}/rootfs/etc/systemd/system/ai-control.service"
    dest: /etc/systemd/system/ai-control.service
    owner: root
    group: root
    mode: "0644"
  register: ai_control_service_unit

- name: Проверить наличие ядра AI Control
  ansible.builtin.stat:
    path: "{{ provision.ai_control.service.executable }}"
  register: ai_control_executable

- name: Включить AI Control в автозапуск
  ansible.builtin.systemd_service:
    name: "{{ provision.ai_control.service.unit }}"
    enabled: true
    daemon_reload: true

- name: Запустить AI Control
  ansible.builtin.systemd_service:
    name: "{{ provision.ai_control.service.unit }}"
    state: >-
      {{
        'restarted'
        if (
          ai_control_service_unit.changed
          or ai_control_environment.changed
          or ai_control_core_files.changed
          or (ai_control_api_credentials.changed | default(false))
        )
        else 'started'
      }}
    daemon_reload: >-
      {{ ai_control_service_unit.changed or ai_control_environment.changed }}
  when:
    - ai_control_executable.stat.exists
    - ai_control_executable.stat.executable | default(false)

- name: Получить образ Open WebUI
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.web.compose_file }}"
      - pull
  changed_when: false

- name: Запустить Open WebUI
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.ai_control.web.compose_file }}"
      - up
      - -d
      - --remove-orphans
  register: ai_control_open_webui_up
  changed_when: >-
    'Started' in (ai_control_open_webui_up.stdout + ai_control_open_webui_up.stderr)
    or 'Created' in (ai_control_open_webui_up.stdout + ai_control_open_webui_up.stderr)
    or 'Recreated' in (ai_control_open_webui_up.stdout + ai_control_open_webui_up.stderr)

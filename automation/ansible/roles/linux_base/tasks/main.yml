---
- name: Установить основные пакеты
  ansible.builtin.apt:
    name: "{{ provision.system.required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - provision.system.required_packages is defined
    - provision.system.required_packages | length > 0

- name: Настроить доверие к SSH-центру доступа
  ansible.builtin.include_tasks: ssh_trust.yml

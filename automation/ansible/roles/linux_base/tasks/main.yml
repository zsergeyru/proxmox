---
- name: Установить основные пакеты
  ansible.builtin.apt:
    name: "{{ provision.system.required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - provision.system.required_packages is defined
    - provision.system.required_packages | length > 0

- name: Настроить доверие к SSH-центру доступа
  ansible.builtin.include_tasks: ssh_trust.yml

- name: Настроить машинную identity OpenBao
  ansible.builtin.include_tasks: openbao_machine_identity.yml
  when: (provision_phase | default('full')) == 'full'

- name: Установить клиент SSH OTP
  ansible.builtin.include_tasks: openbao_otp_client.yml
  when: (provision_phase | default('full')) == 'full'

- name: Настроить доступ чтения к проектному Git
  ansible.builtin.include_tasks: project_git.yml
  when: (provision_phase | default('full')) == 'full'

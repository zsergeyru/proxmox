---
- name: Проверить открытый ключ центра доступа на управляющей системе
  ansible.builtin.stat:
    path: /etc/infra-manager/ca/ssh-client-ca.pub
  delegate_to: localhost
  become: false
  register: ssh_client_ca_source

- name: Требовать центр доступа при полной настройке
  ansible.builtin.assert:
    that:
      - ssh_client_ca_source.stat.exists
      - ssh_client_ca_source.stat.isreg
    fail_msg: >-
      Не найден открытый ключ центра доступа OpenBao:
      /etc/infra-manager/ca/ssh-client-ca.pub.
      Проверьте infra-manager с PVE командой 'infra-manager status';
      для безопасного исправления используйте 'infra-manager repair'.
  when: (provision_phase | default('full')) != 'base'

- name: Подготовить каталог дополнительных настроек SSH
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_client_ca_source.stat.exists

- name: Установить открытый ключ центра доступа
  ansible.builtin.copy:
    src: /etc/infra-manager/ca/ssh-client-ca.pub
    dest: /etc/ssh/trusted-user-ca-keys.pem
    owner: root
    group: root
    mode: "0644"
  register: ssh_client_ca_file
  when: ssh_client_ca_source.stat.exists

- name: Настроить доверие к сертификатам пользователей SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/40-infra-manager-user-ca.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem
  register: ssh_client_ca_config
  when: ssh_client_ca_source.stat.exists

- name: Установить сертификат ключа SSH-сервера
  ansible.builtin.copy:
    src: "{{ infra_ssh_host_certificate_file }}"
    dest: /etc/ssh/ssh_host_ed25519_key-cert.pub
    owner: root
    group: root
    mode: "0644"
  register: ssh_host_certificate_file
  when:
    - infra_ssh_host_certificate_file is defined
    - infra_ssh_host_certificate_file | length > 0

- name: Подключить сертификат SSH-сервера
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/41-infra-manager-host-cert.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
  register: ssh_host_certificate_config
  when:
    - infra_ssh_host_certificate_file is defined
    - infra_ssh_host_certificate_file | length > 0

- name: Проверить синтаксис конфигурации SSH
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  when: ssh_client_ca_source.stat.exists

- name: Проверить итоговую конфигурацию SSH
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
  changed_when: false
  register: sshd_effective_config
  when: ssh_client_ca_source.stat.exists

- name: Подтвердить использование центра доступа
  ansible.builtin.assert:
    that:
      - >-
        'trustedusercakeys /etc/ssh/trusted-user-ca-keys.pem'
        in sshd_effective_config.stdout
    fail_msg: SSH не использует настроенный центр доступа OpenBao
  when: ssh_client_ca_source.stat.exists

- name: Подтвердить использование сертификата SSH-сервера
  ansible.builtin.assert:
    that:
      - >-
        'hostcertificate /etc/ssh/ssh_host_ed25519_key-cert.pub'
        in sshd_effective_config.stdout
    fail_msg: SSH не использует сертификат сервера OpenBao
  when:
    - infra_ssh_host_certificate_file is defined
    - infra_ssh_host_certificate_file | length > 0

- name: Отключить socket-активацию SSH
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  register: ssh_socket_service
  when: ssh_client_ca_source.stat.exists

- name: Запустить обычную службу SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: >-
      {{
        'restarted'
        if (
          ssh_client_ca_file.changed
          or ssh_client_ca_config.changed
          or (ssh_host_certificate_file.changed | default(false))
          or (ssh_host_certificate_config.changed | default(false))
          or ssh_socket_service.changed
        )
        else 'started'
      }}
  when: ssh_client_ca_source.stat.exists

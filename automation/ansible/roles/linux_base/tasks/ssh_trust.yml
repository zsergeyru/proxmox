---
- name: Проверить открытый ключ центра доступа на управляющей системе
  ansible.builtin.stat:
    path: /etc/infra-manager/ca/ssh-client-ca.pub
  delegate_to: localhost
  become: false
  register: ssh_client_ca_source

- name: Требовать центр доступа при полной настройке
  ansible.builtin.assert:
    that:
      - ssh_client_ca_source.stat.exists
      - ssh_client_ca_source.stat.isreg
    fail_msg: >-
      Не найден открытый ключ центра доступа OpenBao:
      /etc/infra-manager/ca/ssh-client-ca.pub.
      Сначала выполните Initialize OpenBao 910.
  when: (provision_phase | default('full')) != 'base'

- name: Подготовить каталог дополнительных настроек SSH
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_client_ca_source.stat.exists

- name: Установить открытый ключ центра доступа
  ansible.builtin.copy:
    src: /etc/infra-manager/ca/ssh-client-ca.pub
    dest: /etc/ssh/trusted-user-ca-keys.pem
    owner: root
    group: root
    mode: "0644"
  register: ssh_client_ca_file
  when: ssh_client_ca_source.stat.exists

- name: Настроить доверие к сертификатам пользователей SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/40-infra-manager-user-ca.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem
  register: ssh_client_ca_config
  when: ssh_client_ca_source.stat.exists

- name: Проверить итоговую конфигурацию SSH
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
  changed_when: false
  register: sshd_effective_config
  when: ssh_client_ca_source.stat.exists

- name: Подтвердить использование центра доступа
  ansible.builtin.assert:
    that:
      - >-
        'trustedusercakeys /etc/ssh/trusted-user-ca-keys.pem'
        in sshd_effective_config.stdout
    fail_msg: SSH не использует настроенный центр доступа OpenBao
  when: ssh_client_ca_source.stat.exists

- name: Перезагрузить SSH после изменения доверия
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when:
    - ssh_client_ca_source.stat.exists
    - ssh_client_ca_file.changed or ssh_client_ca_config.changed

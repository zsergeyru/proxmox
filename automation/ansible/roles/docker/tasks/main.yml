---
- name: Проверить старые пакеты Docker
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - "{{ item }}"
  loop:
    - docker.io
    - docker-compose
    - docker-doc
    - podman-docker
    - containerd
    - runc
  register: docker_conflicts
  changed_when: false
  failed_when: false

- name: Проверить совместимость пакетов
  ansible.builtin.assert:
    that:
      - item.rc != 0 or "install ok installed" not in item.stdout
    fail_msg: "Обнаружен конфликтующий пакет {{ item.item }}; его удаление должно быть осознанным"
  loop: "{{ docker_conflicts.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Подготовить доверенные ключи пакетов
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Получить ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Подключить источник Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Установить Docker
  ansible.builtin.apt:
    name: "{{ provision.docker.required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 0

- name: Запустить Docker
  ansible.builtin.systemd_service:
    name: "{{ provision.docker.service.name }}"
    enabled: "{{ provision.docker.service.enabled | bool }}"
    state: "{{ 'started' if provision.docker.service.state == 'running' else provision.docker.service.state }}"

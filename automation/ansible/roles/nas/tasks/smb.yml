---
- name: Проверить назначения томов и соответствие OMV
  ansible.builtin.assert:
    that:
      - nas_shared_mount is match('^/srv/[A-Za-z0-9_./-]+$')
      - nas_data_mountpoint is match('^/[A-Za-z0-9_./-]+$')
      - nas_shared_ref is match('^[0-9a-f-]{36}$')
      - nas_data_ref is match('^[0-9a-f-]{36}$')
      - nas_shared_uuid | length > 4
    fail_msg: Нет подтверждённых ссылок на файловые системы OMV

- name: Подтвердить политику Samba с обязательной авторизацией
  ansible.builtin.assert:
    that:
      - nas_access_policy.schema_version == 3
      - nas_access_policy.mode == 'named_users'
      - nas_access_policy.credential.source == 'controller_file'
      - nas_access_policy.credential.path == '/var/lib/infra-manager/physical-hosts/nas-smb-password'
      - nas_access_policy.users | length > 0
      - nas_access_policy.shares.keys() | list | sort == nas_provision.shares | map(attribute='name') | list | sort
      - nas_access_policy.shares.values() | map(attribute='access') | unique | list == ['read_write']
    fail_msg: SMB требует пользователей и защищённый пароль контроллера, без гостевого входа

- name: Создать общую группу доступа Samba
  ansible.builtin.group:
    name: nas-smb
    system: true

- name: Обнаружить существующие учётные записи без изменений
  ansible.builtin.getent:
    database: passwd

- name: Создать только отсутствующих пользователей для Samba
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: users
    groups: nas-smb
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true
    state: present
  loop: "{{ nas_access_policy.users }}"
  when: item.name not in ansible_facts.getent_passwd

- name: Добавить ранее существующих пользователей в группу NAS без сброса их настроек
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: nas-smb
    append: true
  loop: "{{ nas_access_policy.users }}"
  when: item.name in ansible_facts.getent_passwd

# The password never appears in Git, Ansible extra-vars, command arguments or
# callback logs. Samba accepts passwords via stdin; no shell interpolation.
- name: Установить общий пароль Samba для объявленных пользователей
  ansible.builtin.command:
    argv: [smbpasswd, -s, -a, "{{ item.name }}"]
    stdin: |
      {{ lookup('ansible.builtin.file', nas_access_policy.credential.path) | trim }}
      {{ lookup('ansible.builtin.file', nas_access_policy.credential.path) | trim }}
    stdin_add_newline: false
  loop: "{{ nas_access_policy.users }}"
  no_log: true
  changed_when: true

- name: Повторно проверить подключение общего HDD по UUID
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ nas_shared_mount }}", --source, "UUID={{ nas_shared_uuid }}"]
  changed_when: false

- name: Повторно проверить подключение основного ZFS
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ nas_data_mountpoint }}", --types, zfs]
  changed_when: false

# Linux OpenZFS defaults to acltype=off.  setfacl below would fail on
# a normally created nas-data pool without explicit POSIX ACL support.
# This is a property change only; never creates or replaces a filesystem.
- name: Повторно подтвердить GUID data ZFS перед настройкой прав Samba
  ansible.builtin.command:
    argv: [zpool, get, -H, -o, value, guid, "{{ nas_data_pool }}"]
  register: nas_smb_pool_guid
  changed_when: false

- name: Запретить изменение прав на чужом ZFS-пуле
  ansible.builtin.assert:
    that:
      - nas_smb_pool_guid.stdout | trim == nas_data_guid | string
      - nas_data_mountpoint == '/' ~ nas_data_pool
    fail_msg: Не подтверждён ZFS-пул данных для прав Samba

- name: Проверить состояние ZFS extended attributes
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, xattr, "{{ nas_data_pool }}"]
  register: nas_smb_zfs_xattr
  changed_when: false

- name: Не включать ACL при отключённых ZFS xattr
  ansible.builtin.assert:
    that:
      - nas_smb_zfs_xattr.stdout | trim in ['dir', 'sa']
    fail_msg: >-
      ZFS xattr отключён или имеет неподдерживаемый тип;
      назначение POSIX ACL остановлено без изменения пула

- name: Прочитать текущий POSIX ACL тип существующего пула
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, acltype, "{{ nas_data_pool }}"]
  register: nas_smb_zfs_acl_before
  changed_when: false

- name: Включить POSIX ACL существующего ZFS без форматирования
  ansible.builtin.command:
    argv: [zfs, set, acltype=posixacl, "{{ nas_data_pool }}"]
  when: nas_smb_zfs_acl_before.stdout | trim not in ['posix', 'posixacl']
  changed_when: true

- name: Перепроверить фактически доступный POSIX ACL на data ZFS
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, acltype, "{{ nas_data_pool }}"]
  register: nas_smb_zfs_acl_after
  changed_when: false

- name: Запретить публикацию Samba без действующих POSIX ACL
  ansible.builtin.assert:
    that:
      - nas_smb_zfs_acl_after.stdout | trim in ['posix', 'posixacl']
    fail_msg: Пул nas-data не подтвердил POSIX ACL; публикация Samba остановлена

- name: Создать объявленные общие каталоги без удаления файлов
  ansible.builtin.file:
    path: "{{ (nas_shared_mount if item.volume == 'shared' else nas_data_mountpoint) ~ '/' ~ item.directory }}"
    state: directory
    owner: root
    group: nas-smb
    mode: "2770"
  loop: "{{ nas_provision.shares }}"

# ACL applies only to the four verified share roots. Existing nested ACLs
# and files are not recursively modified by deployment.
- name: Назначить группе Samba полные права и наследование для новых файлов
  ansible.builtin.command:
    argv:
      - setfacl
      - -m
      - g:nas-smb:rwx,m::rwx,d:g:nas-smb:rwx,d:m::rwx
      - --
      - "{{ (nas_shared_mount if item.volume == 'shared' else nas_data_mountpoint) ~ '/' ~ item.directory }}"
  loop: "{{ nas_provision.shares }}"
  changed_when: false

- name: Согласовать объекты OMV штатными средствами Ansible
  ansible.builtin.include_tasks: omv-shares.yml

# OMV владеет smb.conf через omv-salt. Непосредственно гарантируем лишь
# состояние службы: на новой установке smbd может оставаться остановленным.
- name: Проверить итоговую конфигурацию Samba
  ansible.builtin.command:
    argv: [testparm, -s]
  changed_when: false

- name: Обеспечить запуск Samba после применения OMV
  block:
    - name: Включить автозапуск и запустить Samba
      ansible.builtin.systemd_service:
        name: smbd.service
        enabled: true
        state: started
  rescue:
    - name: Прочитать журнал отказа Samba
      ansible.builtin.command:
        argv: [journalctl, --unit=smbd.service, --no-pager, --lines=100, --output=cat]
      register: nas_smb_error_journal
      changed_when: false
      failed_when: false

    - name: Прервать настройку при ошибке службы Samba
      ansible.builtin.fail:
        msg: Samba не запущена после применения OMV; диагноз выведен без раскрытия журнала

- name: Проверить запущенную службу Samba
  ansible.builtin.command:
    argv: [systemctl, is-active, smbd.service]
  changed_when: false

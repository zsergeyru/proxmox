---
- name: Проверить назначения томов и соответствие OMV
  ansible.builtin.assert:
    that:
      - nas_shared_mount is match('^/srv/[A-Za-z0-9_./-]+$')
      - nas_data_mountpoint is match('^/[A-Za-z0-9_./-]+$')
      - nas_shared_ref is match('^[0-9a-f-]{36}$')
      - nas_data_ref is match('^[0-9a-f-]{36}$')
      - nas_shared_uuid | length > 4
    fail_msg: Нет подтверждённых ссылок на файловые системы OMV

- name: Подтвердить гостевую политику SMB
  ansible.builtin.assert:
    that:
      - nas_access_policy.schema_version == 2
      - nas_access_policy.mode == 'guest_only'
      - nas_access_policy.shares.keys() | list | sort == nas_provision.shares | map(attribute='name') | list | sort
      - nas_access_policy.shares.values() | map(attribute='access') | unique | list == ['read_write']
    fail_msg: Нужны явные разрешения гостю на чтение и запись всех SMB-папок

- name: Проверить учётную запись Samba guest
  ansible.builtin.command:
    argv: [id, -u, nobody]
  changed_when: false

- name: Повторно проверить подключение общего HDD по UUID
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ nas_shared_mount }}", --source, "UUID={{ nas_shared_uuid }}"]
  changed_when: false

- name: Повторно проверить подключение основного ZFS
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ nas_data_mountpoint }}", --types, zfs]
  changed_when: false

- name: Создать объявленные общие каталоги без удаления файлов
  ansible.builtin.file:
    path: "{{ (nas_shared_mount if item.volume == 'shared' else nas_data_mountpoint) ~ '/' ~ item.directory }}"
    state: directory
    owner: root
    group: users
    mode: "0770"
  loop: "{{ nas_provision.shares }}"

# Nobody is the system identity of an anonymous Samba connection. Grant
# POSIX permissions on declared share roots only, never on the backup pool.
# Inherited ACL applies to new children; existing nested ACLs are preserved.
- name: Разрешить гостю чтение и запись объявленных SMB-каталогов
  ansible.builtin.command:
    argv:
      - setfacl
      - -m
      - u:nobody:rwx,d:u:nobody:rwx
      - --
      - "{{ (nas_shared_mount if item.volume == 'shared' else nas_data_mountpoint) ~ '/' ~ item.directory }}"
  loop: "{{ nas_provision.shares }}"
  changed_when: false

- name: Установить штатный обработчик базы OMV
  ansible.builtin.copy:
    src: nas-omv-shares.py
    dest: /usr/local/sbin/nas-omv-shares
    owner: root
    group: root
    mode: "0750"

- name: Зарегистрировать папки и ресурсы через базу OMV
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/nas-omv-shares
      - --shares-json
      - "{{ nas_provision.shares | to_json }}"
      - --access-json
      - "{{ {'mode': nas_access_policy.mode, 'shares': nas_access_policy.shares} | to_json }}"
      - --shared-ref
      - "{{ nas_shared_ref }}"
      - --data-ref
      - "{{ nas_data_ref }}"
      - --shared-mount
      - "{{ nas_shared_mount }}"
      - --data-mount
      - "{{ nas_data_mountpoint }}"
  register: nas_smb_register
  changed_when: "'SMB_CHANGED:' in nas_smb_register.stdout"

# OMV владеет smb.conf через omv-salt. Непосредственно гарантируем лишь
# состояние службы: на новой установке smbd может оставаться остановленным.
- name: Проверить итоговую конфигурацию Samba
  ansible.builtin.command:
    argv: [samba-tool, testparm, --suppress-prompt]
  changed_when: false

- name: Обеспечить запуск Samba после применения OMV
  block:
    - name: Включить автозапуск и запустить Samba
      ansible.builtin.systemd_service:
        name: smbd.service
        enabled: true
        state: started
  rescue:
    - name: Прочитать журнал отказа Samba
      ansible.builtin.command:
        argv: [journalctl, --unit=smbd.service, --no-pager, --lines=100, --output=cat]
      register: nas_smb_error_journal
      changed_when: false
      failed_when: false

    - name: Прервать настройку при ошибке службы Samba
      ansible.builtin.fail:
        msg: Samba не запущена после применения OMV; диагноз выведен без раскрытия журнала

- name: Проверить запущенную службу Samba
  ansible.builtin.command:
    argv: [systemctl, is-active, smbd.service]
  changed_when: false

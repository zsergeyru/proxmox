---
# OMV registry reconciliation ONLY for independently mounted, verified ext4/ZFS.
# No UUID substitution, no filesystem creation and no registry deletion.
- name: Прочитать реестр точек подключения OMV
  ansible.builtin.command:
    argv: [omv-confdbadm, read, conf.system.filesystem.mountpoint]
  register: nas_adopt_omv_before
  changed_when: false
  no_log: true

- name: Нормализовать ответ OMV без исполнения кода
  ansible.builtin.set_fact:
    nas_adopt_omv_records: "{{ [raw] if raw is mapping else raw }}"
  vars:
    raw: "{{ nas_adopt_omv_before.stdout | from_json }}"
  no_log: true

- name: Отказать при неизвестной базе данных или повторяющихся путях
  ansible.builtin.assert:
    that:
      - nas_adopt_omv_records is sequence
      - nas_adopt_omv_records is not string
      - nas_adopt_omv_records | select('mapping') | list | length == nas_adopt_omv_records | length
      - nas_omv_expected_mounts | length == 3
      - nas_omv_expected_mounts | map(attribute='role') | list | sort == ['backup', 'data', 'shared']
      - nas_omv_expected_mounts | map(attribute='fsname') | unique | list | length == 3
      - nas_omv_expected_mounts | map(attribute='dir') | unique | list | length == 3
    fail_msg: Невозможно безопасно сопоставить файловые системы с OMV

- name: Не затрагивать существующие OMV-записи чужих или подменённых томов
  ansible.builtin.assert:
    that:
      - by_dir | length <= 1
      - by_source | length <= 1
      - >-
        (by_dir | length == 0 and by_source | length == 0)
        or (
          by_dir | length == 1 and by_source | length == 1
          and by_dir[0].uuid == by_source[0].uuid
          and by_dir[0].uuid is match('^[0-9a-fA-F-]{36}$')
          and by_dir[0].type == item.type
        )
    fail_msg: Обнаружен конфликт источника или каталога {{ item.role }} в OMV
  vars:
    by_dir: "{{ nas_adopt_omv_records | selectattr('dir', 'equalto', item.dir) | list }}"
    by_source: "{{ nas_adopt_omv_records | selectattr('fsname', 'equalto', item.fsname) | list }}"
  loop: "{{ nas_omv_expected_mounts }}"
  loop_control:
    label: "{{ item.role }}"

- name: Добавить в OMV только отсутствующие существующие тома
  ansible.builtin.command:
    argv:
      - omv-confdbadm
      - update
      - conf.system.filesystem.mountpoint
      - "{{ entry | to_json }}"
  vars:
    entry: >-
      {{ {
        'fsname': item.fsname, 'dir': item.dir, 'type': item.type,
        'opts': 'defaults,nofail,user_xattr,acl' if item.type == 'ext4'
                else 'rw,relatime,xattr,noacl,casesensitive',
        'freq': 0, 'passno': 2 if item.type == 'ext4' else 0,
        'hidden': false if item.type == 'ext4' else true,
        'usagewarnthreshold': 0, 'comment': ''
      } }}
    by_dir: "{{ nas_adopt_omv_records | selectattr('dir', 'equalto', item.dir) | list }}"
  loop: "{{ nas_omv_expected_mounts }}"
  loop_control:
    label: "{{ item.role }}"
  when: by_dir | length == 0
  register: nas_adopt_omv_changes
  changed_when: true
  no_log: true

- name: Применить fstab только при добавлении подтверждённой OMV-записи
  ansible.builtin.command:
    argv: [omv-salt, deploy, run, fstab]
  when: nas_adopt_omv_changes is changed
  changed_when: true
  no_log: true

- name: Прочитать фактически сохранённые UUID OMV после регистрации
  ansible.builtin.command:
    argv: [omv-confdbadm, read, conf.system.filesystem.mountpoint]
  register: nas_adopt_omv_after
  changed_when: false
  no_log: true

- name: Нормализовать подтверждённый OMV-реестр
  ansible.builtin.set_fact:
    nas_adopt_omv_verified: "{{ [raw] if raw is mapping else raw }}"
  vars:
    raw: "{{ nas_adopt_omv_after.stdout | from_json }}"
  no_log: true

- name: Подтвердить все реальные записи и неизменность старых OMV UUID
  ansible.builtin.assert:
    that:
      - by_dir | length == 1
      - by_source | length == 1
      - by_dir[0].uuid is match('^[0-9a-fA-F-]{36}$')
      - by_dir[0].uuid == by_source[0].uuid
      - by_dir[0].type == item.type
      - old_dir | length == 0 or old_dir[0].uuid == by_dir[0].uuid
    fail_msg: OMV изменила существующую идентичность тома {{ item.role }}
  vars:
    by_dir: "{{ nas_adopt_omv_verified | selectattr('dir', 'equalto', item.dir) | list }}"
    by_source: "{{ nas_adopt_omv_verified | selectattr('fsname', 'equalto', item.fsname) | list }}"
    old_dir: "{{ nas_adopt_omv_records | selectattr('dir', 'equalto', item.dir) | list }}"
  loop: "{{ nas_omv_expected_mounts }}"
  loop_control:
    label: "{{ item.role }}"

- name: Сохранить только подтверждённые OMV UUID в памяти Ansible
  ansible.builtin.set_fact:
    nas_omv_registered: >-
      {{ (nas_omv_registered | default({})) | combine({
        item.role: (
          nas_adopt_omv_verified
          | selectattr('dir', 'equalto', item.dir) | first
        ).uuid
      }) }}
  loop: "{{ nas_omv_expected_mounts }}"
  loop_control:
    label: "{{ item.role }}"

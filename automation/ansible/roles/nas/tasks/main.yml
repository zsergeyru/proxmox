---
- name: Проверить декларативный план NAS
  ansible.builtin.assert:
    that:
      - nas_deploy_phase in ['base', 'services']
      - nas_provision.schema_version == 1
      - nas_provision.host == 'nas'
      - nas_provision.deployment.phases == ['base', 'services']
      - nas_provision.deployment.components == ['urbackup_server', 'urbackup_client', 'apps', 'smb']
      - nas_provision.services.qbittorrent.image is match('^lscr.io/linuxserver/qbittorrent:[A-Za-z0-9_.-]+$')
    fail_msg: Некорректный или неподдерживаемый декларативный план NAS

- name: Применить базовые пакеты и зависимости NAS
  ansible.builtin.include_tasks: base.yml
  when: nas_deploy_phase == 'base'

- name: Разрешить параметры ролей исключительно из проверенных деклараций
  ansible.builtin.set_fact:
    nas_urbackup_image: "{{ nas_backup_policy.server.image }}"
    nas_urbackup_timezone: "{{ nas_backup_policy.server.timezone }}"
    nas_urbackup_recovery_schedule: "{{ nas_backup_policy.retention.server_state_schedule }}"
    nas_urbackup_client_image: "{{ nas_backup_policy.local_client.image }}"
    nas_urbackup_client_name: "{{ nas_backup_policy.local_client.name }}"
    nas_urbackup_schedule: "{{ nas_backup_policy.local_client.schedule }}"
    nas_qbit_image: "{{ nas_provision.services.qbittorrent.image }}"
  when: nas_deploy_phase == 'services'

- name: Применить заявленные компоненты NAS после подтверждения томов
  ansible.builtin.include_tasks: "{{ item }}.yml"
  loop: "{{ nas_provision.deployment.components }}"
  when: nas_deploy_phase == 'services'

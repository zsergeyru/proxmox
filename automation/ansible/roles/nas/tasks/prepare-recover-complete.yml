---
# Staged transaction coordinator for NAS recovery after FIRST creation.
# It is intentionally unreachable from every CLI/Ansible playbook.
# Never run on the real NAS before isolated disk / OMV acceptance tests.
# First-create has a separate, disabled journal/writer path.
- name: Разрешить только подтверждённое восстановление без форматирования
  ansible.builtin.assert:
    that:
      - physical_host_name == 'nas'
      - physical_storage.host == 'nas'
      - physical_disk_intent is mapping
      - physical_disk_intent.mode == 'recover'
      - physical_disk_intent.host == 'nas'
      - physical_disk_intent.fingerprint is match('^[a-f0-9]{64}$')
      - nas_omv_registration_authorized | default(false) | bool
      - physical_storage_state_commit_authorized | default(false) | bool
      - physical_storage.policies.existing_data == 'preserve'
      - physical_storage.policies.unverified_devices == 'reject_writes'
      - physical_storage.policies.missing_mount == 'reject_writes'
    fail_msg: Нет точного разрешённого восстановления; изменения OMV и 910 запрещены

- name: Независимо проверить HDD, журнал и реальную идентичность ext4/ZFS
  ansible.builtin.include_role:
    name: physical_storage
    tasks_from: prepare-recover-inspect.yml

- name: Найти любые конфликты регистрации файловых систем OMV до записи
  ansible.builtin.include_tasks: prepare-omv-audit.yml

- name: Зарегистрировать лишь отсутствующие и подтверждённые тома OMV
  ansible.builtin.include_tasks: prepare-omv-register.yml

- name: Безопасно применить fstab и перепроверить UUID/GUID
  ansible.builtin.include_tasks: prepare-omv-activate.yml

- name: Собрать настоящие serial SSD/HDD и подтверждённые тома
  ansible.builtin.include_tasks: prepare-observed-identity.yml

- name: Однократно закрепить в 910 проверенные назначения томов
  ansible.builtin.include_role:
    name: physical_storage
    tasks_from: persist-verified.yml

- name: Завершить только после полного подтверждения всех стадий
  ansible.builtin.debug:
    msg: Восстановление HDD проверено, OMV согласована, состояние 910 подтверждено

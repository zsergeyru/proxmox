---
# Согласование OMV через штатную confdb. Ни один шаг не меняет smb.conf,
# UUID существующих объектов и вложенные файлы на дисках.
- name: Прочитать существующие папки OMV
  ansible.builtin.command:
    argv: [omv-confdbadm, read, conf.system.sharedfolder]
  changed_when: false
  register: nas_omv_folders_before
  no_log: true

- name: Прочитать существующие ресурсы SMB
  ansible.builtin.command:
    argv: [omv-confdbadm, read, conf.service.smb.share]
  changed_when: false
  register: nas_omv_smb_before
  no_log: true

- name: Прочитать общие настройки Samba в базе OMV
  ansible.builtin.command:
    argv: [omv-confdbadm, read, conf.service.smb]
  changed_when: false
  register: nas_omv_global_before
  no_log: true

- name: Нормализовать фактические записи базы OMV
  ansible.builtin.set_fact:
    nas_omv_folder_records: "{{ [nas_omv_folder_raw] if nas_omv_folder_raw is mapping else nas_omv_folder_raw }}"
    nas_omv_smb_records: "{{ [nas_omv_smb_raw] if nas_omv_smb_raw is mapping else nas_omv_smb_raw }}"
    nas_omv_global_record: "{{ nas_omv_global_before.stdout | from_json }}"
  vars:
    nas_omv_folder_raw: "{{ nas_omv_folders_before.stdout | from_json }}"
    nas_omv_smb_raw: "{{ nas_omv_smb_before.stdout | from_json }}"
  no_log: true

- name: Проверить структуру объявлений и базы OMV перед первой записью
  ansible.builtin.assert:
    that:
      - nas_omv_folder_records is sequence
      - nas_omv_smb_records is sequence
      - nas_omv_global_record is mapping
      - nas_provision.shares | length > 0
      - nas_provision.shares | map(attribute='name') | unique | list | length == nas_provision.shares | length
      - nas_provision.shares | map(attribute='volume') | zip(nas_provision.shares | map(attribute='directory')) | list | unique | list | length == nas_provision.shares | length
    fail_msg: Структура OMV или объявлений SMB неоднозначна; изменение запрещено

- name: Отвергнуть чужие совпадающие имена и занятые каталоги OMV
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9-]{0,30}$')
      - item.directory is match('^[a-z][a-z0-9-]{0,30}$')
      - item.volume in ['shared', 'data']
      - existing_named | length <= 1
      - existing_path | length == 0 or (existing_path | length == 1 and existing_path[0].name == item.name)
      - existing_named | length == 0 or (existing_named[0].mntentref == target_ref and (existing_named[0].reldirpath | trim('/')) == item.directory)
    fail_msg: "SMB: конфликт имени или расположения папки {{ item.name }}; чужая запись не изменялась"
  vars:
    target_ref: "{{ nas_shared_ref if item.volume == 'shared' else nas_data_ref }}"
    existing_named: "{{ nas_omv_folder_records | selectattr('name', 'equalto', item.name) | list }}"
    existing_path: "{{ nas_omv_folder_records | selectattr('mntentref', 'equalto', target_ref) | selectattr('reldirpath', 'match', '^/?' ~ item.directory ~ '/? | list }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Создать только отсутствующие папки в конфигурационной базе OMV
  ansible.builtin.command:
    argv:
      - omv-confdbadm
      - update
      - conf.system.sharedfolder
      - "{{ {'name': item.name, 'comment': 'Под управлением Infra Manager', 'mntentref': target_ref, 'reldirpath': item.directory ~ '/', 'privileges': {'privilege': []}} | to_json }}"
  vars:
    target_ref: "{{ nas_shared_ref if item.volume == 'shared' else nas_data_ref }}"
    existing_named: "{{ nas_omv_folder_records | selectattr('name', 'equalto', item.name) | list }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: existing_named | length == 0
  register: nas_omv_created_folders
  changed_when: true
  no_log: true

# Новым объектам OMV сама назначает UUID. Повторное чтение обязательно.
- name: Прочитать действительные UUID папок после создания
  ansible.builtin.command:
    argv: [omv-confdbadm, read, conf.system.sharedfolder]
  changed_when: false
  register: nas_omv_folders_after
  no_log: true

- name: Сохранить подтверждённые записи OMV после создания
  ansible.builtin.set_fact:
    nas_omv_folder_records: "{{ [raw] if raw is mapping else raw }}"
  vars:
    raw: "{{ nas_omv_folders_after.stdout | from_json }}"
  no_log: true

- name: Убедиться, что каждая объявленная папка имеет реальный UUID OMV
  ansible.builtin.assert:
    that:
      - existing_named | length == 1
      - existing_named[0].uuid is match('^[0-9a-fA-F-]{36}$')
      - existing_named[0].mntentref == target_ref
      - (existing_named[0].reldirpath | trim('/')) == item.directory
    fail_msg: "OMV не подтвердила регистрацию папки {{ item.name }}; публикация SMB остановлена"
  vars:
    target_ref: "{{ nas_shared_ref if item.volume == 'shared' else nas_data_ref }}"
    existing_named: "{{ nas_omv_folder_records | selectattr('name', 'equalto', item.name) | list }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Проверить отсутствие конкурирующих ресурсов SMB перед включением службы
  ansible.builtin.assert:
    that:
      - existing_smb | length <= 1
      - existing_smb | length == 0 or existing_smb[0].uuid is match('^[0-9a-fA-F-]{36}$')
    fail_msg: "Несколько ресурсов SMB используют папку {{ item.name }} или повреждён UUID"
  vars:
    folder_ref: "{{ (nas_omv_folder_records | selectattr('name', 'equalto', item.name) | first).uuid }}"
    existing_smb: "{{ nas_omv_smb_records | selectattr('sharedfolderref', 'equalto', folder_ref) | list }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"

# Включение корневого объекта conf.service.smb выполняем ДО создания ресурсов:
# старый вложенный shares.share иначе мог бы стереть новые записи.
- name: Включить Samba в OMV, сохранив остальные её параметры
  ansible.builtin.command:
    argv:
      - omv-confdbadm
      - update
      - conf.service.smb
      - "{{ nas_omv_global_record | combine({'enable': true}) | to_json }}"
  when: not (nas_omv_global_record.enable | default(false) | bool)
  register: nas_omv_enabled_smb
  changed_when: true
  no_log: true

- name: Создать отсутствующие SMB-ресурсы и исправить только разрешённые права
  ansible.builtin.command:
    argv:
      - omv-confdbadm
      - update
      - conf.service.smb.share
      - "{{ payload | to_json }}"
  vars:
    folder_ref: "{{ (nas_omv_folder_records | selectattr('name', 'equalto', item.name) | first).uuid }}"
    existing_smb: "{{ nas_omv_smb_records | selectattr('sharedfolderref', 'equalto', folder_ref) | list }}"
    new_record:
      enable: true
      sharedfolderref: "{{ folder_ref }}"
      comment: Домашний NAS
      guest: "no"
      readonly: false
      browseable: true
      recyclebin: false
      recyclemaxsize: 0
      recyclemaxage: 0
      hidedotfiles: true
      inheritacls: false
      inheritpermissions: true
      easupport: true
      storedosattributes: true
      hostsallow: ""
      hostsdeny: ""
      audit: false
      macoscompat: false
      transportencryption: false
      followsymlinks: false
      widelinks: false
      extraoptions: ""
    payload: "{{ (existing_smb[0] | combine({'enable': true, 'guest': 'no', 'readonly': false})) if existing_smb | length else new_record }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    existing_smb | length == 0
    or existing_smb[0].enable is not sameas true
    or existing_smb[0].guest != 'no'
    or existing_smb[0].readonly is not sameas false
  register: nas_omv_updated_smb
  changed_when: true
  no_log: true

- name: Применить конфигурацию Samba только после реальных изменений OMV
  ansible.builtin.command:
    argv: [omv-salt, deploy, run, samba]
  when: >-
    (nas_omv_created_folders is changed)
    or (nas_omv_enabled_smb is changed)
    or (nas_omv_updated_smb is changed)
  changed_when: true
  no_log: true
) | list }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Создать только отсутствующие папки в конфигурационной базе OMV
  ansible.builtin.command:
    argv:
      - omv-confdbadm
      - update
      - conf.system.sharedfolder
      - "{{ {'name': item.name, 'comment': 'Под управлением Infra Manager', 'mntentref': target_ref, 'reldirpath': item.directory ~ '/', 'privileges': {'privilege': []}} | to_json }}"
  vars:
    target_ref: "{{ nas_shared_ref if item.volume == 'shared' else nas_data_ref }}"
    existing_named: "{{ nas_omv_folder_records | selectattr('name', 'equalto', item.name) | list }}"
  loop: "{{ nas_provision.shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: existing_named | length == 0
  register: nas_omv_created_folders
  changed_when: true
  no_log: true


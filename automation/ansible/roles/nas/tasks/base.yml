---
- name: Проверить Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] == '13'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: Установить Debian 13 необходимо вручную

- name: Проверить установленную OpenMediaVault
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}', openmediavault]
  changed_when: false
  register: nas_omv_version

- name: Требовать OpenMediaVault 8
  ansible.builtin.assert:
    that:
      - (nas_omv_version.stdout | regex_replace('^[0-9]+:', '')).startswith('8.')
    fail_msg: Установить OpenMediaVault 8 необходимо вручную

# Уже установленные пакеты не должны зависеть от обновления индекса APT.
# При первой установке источники пакетов всё равно должны работать.
- name: Установить средства диагностики, не изменяя разметку
  block:
    - name: Проверить и при необходимости установить диагностические программы
      ansible.builtin.apt:
        name: "{{ nas_provision.system.packages.diagnostics }}"
        state: present
        update_cache: false
  rescue:
    - name: Проверить DNS на NAS после ошибки APT
      ansible.builtin.command:
        argv: [getent, ahostsv4, deb.debian.org]
      register: nas_apt_dns
      failed_when: false
      changed_when: false

    - name: Объяснить отказ APT до любых операций над HDD
      ansible.builtin.fail:
        msg: >-
          Не удалось установить средства диагностики NAS из APT.
          {{
            'NAS не разрешает имя deb.debian.org: проверьте DNS, шлюз и доступ в интернет.'
            if nas_apt_dns.rc != 0
            else 'DNS Debian работает, но пакетный менеджер отказал: проверьте доступность репозиториев Debian/OMV и правильность настроенных APT-источников.'
          }}
          На HDD ничего не форматировалось. После восстановления доступа
          к пакетам повторите infra-manager deploy nas.

- name: Включить службу наблюдения за SMART
  ansible.builtin.systemd_service:
    name: "{{ nas_provision.system.services.smart }}"
    enabled: true
    state: started

- name: Подтвердить доступность конфигурационной базы OMV
  ansible.builtin.command:
    argv:
      - omv-confdbadm
      - read
      - conf.system.filesystem.mountpoint
  changed_when: false
  register: nas_mounts

- name: Проверить структуру ответа OMV
  ansible.builtin.assert:
    that:
      - (nas_mounts.stdout | from_json) is sequence
    fail_msg: Не удалось прочитать зарегистрированные тома OpenMediaVault

- name: Установить зависимости установки пакетов OMV
  ansible.builtin.apt:
    name: "{{ nas_provision.system.packages.omv_prerequisites }}"
    state: present

- name: Проверить наличие OMV-Extras
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Status}', openmediavault-omvextrasorg]
  register: nas_omv_extras
  changed_when: false
  failed_when: false

- name: Получить пакет OMV-Extras для восьмой версии
  ansible.builtin.get_url:
    url: https://github.com/OpenMediaVault-Plugin-Developers/packages/raw/master/openmediavault-omvextrasorg_latest_all8.deb
    dest: /var/cache/apt/archives/omv-extras8.deb
    mode: "0644"
    timeout: 40
  when: nas_omv_extras.stdout is not search('install ok installed')

- name: Установить OMV-Extras штатным пакетным менеджером
  ansible.builtin.apt:
    deb: /var/cache/apt/archives/omv-extras8.deb
    state: present
  when: nas_omv_extras.stdout is not search('install ok installed')

- name: Проверить недостающие пакеты ZFS и Docker
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f=${binary:Package} ${Status}\\n'] + nas_provision.system.packages.omv_extensions + nas_provision.system.packages.docker }}"
  register: nas_required_packages
  changed_when: false
  failed_when: false

# Модуль apt скрывает истинную причину ошибочного update-cache после
# пяти повторов. apt-get даёт stdout/stderr для безопасной классификации.
# Error-Mode=any запрещает считать частично недоступные репозитории успехом.
- name: Обновить перечень пакетов после установки OMV-Extras
  ansible.builtin.command:
    argv:
      - apt-get
      - -o
      - APT::Update::Error-Mode=any
      - update
  register: nas_apt_refresh
  changed_when: nas_apt_refresh.rc == 0
  failed_when: false
  when: >-
    nas_omv_extras.stdout is not search('install ok installed')
    or
    (
      nas_required_packages.stdout_lines
      | select('search', ' install ok installed$')
      | list | length
    ) != 6

# Диагностика запускается только после ошибки APT, не меняет
# конфигурацию репозиториев и не принимает недоверенные зеркала.
# HTTPS-запрос является дополнительной проверкой доступности,
# а не точным воспроизведением APT (схема источника может отличаться).
- name: Проверить DNS основного репозитория OMV после ошибки APT
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - packages.openmediavault.org
  register: nas_apt_omv_dns
  failed_when: false
  changed_when: false
  when:
    - nas_apt_refresh is not skipped
    - nas_apt_refresh.rc | default(0) != 0

- name: Проверить HTTPS-ответ основного репозитория OMV после ошибки APT
  ansible.builtin.command:
    argv:
      - curl
      - --location
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --write-out
      - '%{http_code}'
      - --max-time
      - '15'
      - --connect-timeout
      - '5'
      - --proto
      - =https
      - --proto-redir
      - =https
      - https://packages.openmediavault.org/public/dists/synchrony/InRelease
  register: nas_apt_omv_https
  failed_when: false
  changed_when: false
  when:
    - nas_apt_refresh is not skipped
    - nas_apt_refresh.rc | default(0) != 0

- name: Восстановить официальный список зеркал OMV при подтверждённом HTTP 503
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/nas-omv-mirror-recover.py apply"
    executable: /usr/bin/python3
  register: nas_apt_mirror_recovery
  changed_when: nas_apt_mirror_recovery.rc == 0
  when:
    - nas_apt_refresh is not skipped
    - nas_apt_refresh.rc | default(0) != 0
    - (nas_apt_omv_https.stdout | default('') | trim) == '503'
    - "'packages.openmediavault.org' in (nas_apt_refresh.stdout | default('')) or 'packages.openmediavault.org' in (nas_apt_refresh.stderr | default(''))"

- name: Повторить обновление APT через проверенные зеркала OMV
  ansible.builtin.command:
    argv:
      - apt-get
      - -o
      - APT::Update::Error-Mode=any
      - update
  register: nas_apt_mirror_refresh
  changed_when: nas_apt_mirror_refresh.rc == 0
  failed_when: false
  when:
    - nas_apt_mirror_recovery is not skipped
    - nas_apt_mirror_recovery.rc | default(1) == 0

- name: Откатить изменения OMV при повторной ошибке обновления APT
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/nas-omv-mirror-recover.py rollback"
    executable: /usr/bin/python3
  when:
    - nas_apt_mirror_refresh is not skipped
    - nas_apt_mirror_refresh.rc | default(0) != 0

- name: Прервать настройку из-за ошибки обновления APT
  ansible.builtin.fail:
    msg: >-
      Не удалось обновить индексы пакетов после установки OMV-Extras
      (код APT {{ nas_apt_refresh.rc }}).
      Проверьте вывод диагностики выше; изменение разметки дисков
      не начиналось. После исправления репозиториев повторите
      infra-manager deploy nas.
  when:
    - nas_apt_refresh is not skipped
    - nas_apt_refresh.rc | default(0) != 0
    - nas_apt_mirror_refresh is skipped or nas_apt_mirror_refresh.rc | default(0) != 0

- name: Установить расширения OMV для ZFS и Docker
  ansible.builtin.apt:
    name: "{{ nas_provision.system.packages.omv_extensions }}"
    state: present
    update_cache: false

- name: Проверить наличие модуля ZFS после установки расширения
  ansible.builtin.command:
    argv: [modinfo, zfs]
  register: nas_zfs_module
  changed_when: false
  failed_when: false

# OpenZFS из backports устанавливает DKMS-источники, но может
# остаться в состоянии "added", если заголовков работающего ядра нет.
# Подготовка выполняется только при отсутствии уже собранного модуля.
# Важно: не устанавливать новое ядро, не делать autoremove/reboot.
- name: Проверить безопасное имя работающего ядра для ZFS
  ansible.builtin.assert:
    that:
      - ansible_facts['kernel'] is match('^[0-9][a-zA-Z0-9.+_-]{0,79}$')
    fail_msg: >-
      Невозможно безопасно определить имя работающего ядра NAS.
      Автоматическая установка заголовков остановлена.
  when: nas_zfs_module.rc != 0

- name: Проверить заголовки работающего ядра для DKMS
  ansible.builtin.stat:
    path: "/lib/modules/{{ ansible_facts['kernel'] }}/build"
    follow: true
  register: nas_zfs_kernel_headers
  when: nas_zfs_module.rc != 0

- name: Установить заголовки текущего ядра и DKMS без удаления пакетов
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_facts['kernel'] }}"
      - dkms
    state: present
    update_cache: false
    fail_on_autoremove: true
    force_apt_get: true
  when:
    - nas_zfs_module.rc != 0
    - not (nas_zfs_kernel_headers.stat.isdir | default(false))

- name: Проверить ZFS после установки заголовков
  ansible.builtin.command:
    argv: [modinfo, -F, filename, zfs]
  register: nas_zfs_module_after_headers
  changed_when: false
  failed_when: false
  when: nas_zfs_module.rc != 0

- name: Собрать ZFS для работающего ядра через DKMS
  ansible.builtin.command:
    argv:
      - dkms
      - autoinstall
      - -k
      - "{{ ansible_facts['kernel'] }}"
  register: nas_zfs_dkms_build
  changed_when: nas_zfs_dkms_build.rc == 0
  failed_when: false
  when:
    - nas_zfs_module.rc != 0
    - nas_zfs_module_after_headers.rc != 0

- name: Проверить модуль ZFS после DKMS
  ansible.builtin.command:
    argv: [modinfo, -F, filename, zfs]
  register: nas_zfs_ready
  changed_when: false
  failed_when: false

- name: Подтвердить готовность ZFS после сборки DKMS
  ansible.builtin.assert:
    that:
      - nas_zfs_ready.rc == 0
      - nas_zfs_dkms_build is skipped or nas_zfs_dkms_build.rc == 0
    fail_msg: >-
      Модуль ZFS отсутствует для работающего ядра {{ ansible_facts['kernel'] }}
      даже после установки его заголовков и попытки сборки DKMS.
      Установка нового ядра и перезагрузка не выполнялись.
      Проверьте совместимость zfs-dkms с текущим ядром и журнал DKMS.

- name: Загрузить проверенный модуль ZFS в работающее ядро
  ansible.builtin.command:
    argv: [modprobe, zfs]
  register: nas_zfs_modprobe
  changed_when: false
  failed_when: false

- name: Проверить загрузку ZFS в ядро
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: nas_zfs_loaded

- name: Подтвердить загрузку ZFS в работающее ядро
  ansible.builtin.assert:
    that:
      - nas_zfs_modprobe.rc == 0
      - nas_zfs_loaded.stat.isdir | default(false)
    fail_msg: >-
      Модуль ZFS найден, но не загрузился в работающее ядро.
      Система не перезагружалась, ядро не менялось,
      подготовка и форматирование HDD не выполнялись.

- name: Установить Docker через источник пакетов, управляемый OMV-Extras
  ansible.builtin.apt:
    name: "{{ nas_provision.system.packages.docker }}"
    state: present
    update_cache: false

- name: Запустить Docker с автоматическим запуском после загрузки NAS
  ansible.builtin.systemd_service:
    name: "{{ nas_provision.system.services.containers }}"
    enabled: true
    state: started

- name: Проверить поддержку Docker Compose
  ansible.builtin.command:
    argv: [docker, compose, version]
  changed_when: false

- name: Проверить доступность инструментов ZFS
  ansible.builtin.command:
    argv: [zpool, --version]
  changed_when: false

- name: Проверить доступность Docker
  ansible.builtin.command:
    argv: [docker, --version]
  changed_when: false

- name: Установить одноразовый исполнитель подготовки пустых HDD
  ansible.builtin.copy:
    src: nas-storage-prepare.py
    dest: /usr/local/sbin/nas-storage-prepare
    owner: root
    group: root
    mode: "0700"

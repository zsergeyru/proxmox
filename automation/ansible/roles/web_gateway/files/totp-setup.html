<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Первоначальная настройка Google Authenticator</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#18243b;margin:0;padding:30px 12px}
main{max-width:500px;margin:auto;background:white;border-radius:14px;padding:26px;box-sizing:border-box}
h1{font-size:24px}img{display:block;width:260px;max-width:100%;margin:22px auto}
label{display:block;margin:15px 0 6px}input{font:inherit;font-size:24px;letter-spacing:7px;width:100%;box-sizing:border-box;padding:12px}
button{font:inherit;padding:12px 16px;margin-top:12px;cursor:pointer}
small{color:#555}p{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Подключение Google Authenticator</h1>
<p>Отсканируйте QR-код телефоном. Введите шестизначный код из приложения и нажмите кнопку подтверждения.</p>
<img src="/totp-setup/qr.png" alt="QR-код первоначального администратора">
<form method="post" action="/totp-setup/confirm">
<label for="code">Код из Google Authenticator</label>
<input id="code" name="code" type="text" pattern="[0-9 ]{6,7}" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required>
<button type="submit">Подтвердить и удалить QR-код</button>
</form>
<p><small>Доступ только из домашней сети в течение 15 минут после развёртывания. После подтверждения QR-код будет удалён, но второй фактор продолжит работать.</small></p>
<form method="post" action="/totp-setup/close">
<button type="submit">Закрыть без подтверждения</button>
</form>
</main>
</body>
</html>

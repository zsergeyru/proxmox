---
# 140: все изменяемые данные должны быть доступны ДО любой записи на диск.
- name: Проверить машинное описание веб-шлюза
  ansible.builtin.assert:
    that:
      - provision.guest_vmid == 140
      - provision.web_gateway.storage.allow_missing_mount == false
      - provision.web_gateway.storage.required_mount == "/var/lib/web-gateway"
      - provision.web_gateway.paths.persistent_state == "/var/lib/web-gateway"
      - provision.web_gateway.authelia.storage.type == "sqlite"
      - provision.web_gateway.caddy.enabled | bool
      - provision.web_gateway.authelia.enabled | bool
      - provision.web_gateway.homarr.enabled | bool
      - provision.web_gateway.authelia.totp_setup.username == provision.web_gateway.authelia.initial_admin.username
      - provision.web_gateway.authelia.totp_setup.qr_host == provision.web_gateway.authelia.data.host ~ '/totp-setup/admin.png'
      - provision.web_gateway.authelia.totp_setup.qr_container == '/data/totp-setup/admin.png'
      - provision.web_gateway.caddy.private_networks | length > 0
      - provision.web_gateway.authelia.public_url.split('://', 1)[1] in provision.web_gateway.caddy.public_domains
      - provision.web_gateway.homarr.public_url.split('://', 1)[1] in provision.web_gateway.caddy.public_domains
    fail_msg: "140: некорректная схема служб или постоянного хранилища"

- name: Проверить настоящее подключение постоянного тома
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.web_gateway.storage.required_mount }}"
  changed_when: false

- name: Проверить каталог постоянного состояния
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.paths.persistent_state }}"
    follow: false
  register: web_gateway_state

- name: Запретить подмену постоянного каталога обычной папкой или ссылкой
  ansible.builtin.assert:
    that:
      - web_gateway_state.stat.isdir | default(false)
      - not (web_gateway_state.stat.islnk | default(false))
    fail_msg: "140: постоянное состояние отсутствует, не запускать службы"

- name: Подготовить каталоги воспроизводимых файлов
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ provision.web_gateway.paths.root }}"
    - "{{ provision.web_gateway.paths.compose }}"
    - "{{ provision.web_gateway.paths.configuration }}"
    - "{{ provision.web_gateway.paths.configuration }}/caddy"
    - "{{ provision.web_gateway.paths.configuration }}/caddy/local-home"
    - "{{ provision.web_gateway.paths.configuration }}/caddy/totp-setup"
    - "{{ provision.web_gateway.paths.configuration }}/authelia"
    - "{{ provision.web_gateway.paths.secrets }}"

- name: Подготовить каталоги на проверенном постоянном томе
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ provision.web_gateway.caddy.data.host }}"
    - "{{ provision.web_gateway.caddy.config.host }}"
    - "{{ provision.web_gateway.authelia.data.host }}"
    - "{{ provision.web_gateway.authelia.data.host }}/totp-setup"
    - "{{ provision.web_gateway.homarr.data.host }}"
    - "{{ provision.web_gateway.paths.secrets }}"
    - "{{ provision.web_gateway.paths.persistent_state }}/management"
    - "{{ provision.web_gateway.paths.persistent_state }}/management/catalog"
    - "{{ provision.web_gateway.paths.persistent_state }}/management/totp-setup-socket"

# Во время любого развёртывания Homarr должен оставаться закрытым,
# пока его действительное состояние не проверено через штатный интерфейс.
- name: Закрыть публичный вход Homarr до подтверждения готовности
  ansible.builtin.file:
    path: "{{ provision.web_gateway.homarr.onboarding.ready_file }}"
    state: absent

- name: Сформировать каталог приложений Homarr из Git
  ansible.builtin.include_tasks: catalog.yml

# Все секреты и пользователи принадлежат самому гостю, хранятся на mp0.
# Закрытый первоначальный пароль не должен попадать в журнал Semaphore.
- name: Подготовить каталог сценариев гостя
  ansible.builtin.file:
    path: /usr/local/lib/web-gateway
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Установить сценарий начальной настройки Homarr
  ansible.builtin.copy:
    src: initialize-homarr.py
    dest: /usr/local/lib/web-gateway/initialize-homarr.py
    owner: root
    group: root
    mode: "0700"

- name: Установить сценарий однократной подготовки
  ansible.builtin.copy:
    src: initialize.py
    dest: /usr/local/lib/web-gateway/initialize.py
    owner: root
    group: root
    mode: "0700"

- name: Установить сценарий просмотра сохранённого операторского пароля
  ansible.builtin.copy:
    src: show-initial-password.py
    dest: /usr/local/lib/web-gateway/show-initial-password.py
    owner: root
    group: root
    mode: "0700"

- name: Установить сценарий явной смены пароля администратора
  ansible.builtin.copy:
    src: reset-admin-password.py
    dest: /usr/local/lib/web-gateway/reset-admin-password.py
    owner: root
    group: root
    mode: "0700"

- name: Установить служебное управление вторым фактором пользователей
  ansible.builtin.copy:
    src: totp-users.py
    dest: /usr/local/lib/web-gateway/totp-users.py
    owner: root
    group: root
    mode: "0700"

- name: Проверить метку уже созданных секретов
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.paths.secrets }}/.initialized"
  register: web_gateway_initial_state

- name: Подготовить недостающие секреты и первого администратора
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/lib/web-gateway/initialize.py
      - "{{ provision.web_gateway.paths.persistent_state }}"
      - "{{ provision.web_gateway.authelia.initial_admin.email }}"
  register: web_gateway_initialized
  changed_when: not web_gateway_initial_state.stat.exists
  no_log: true

- name: Проверить сохранённый файл пользователей
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.authelia.users_file }}"
  register: web_gateway_users_state

- name: Остановить запуск без постоянного файла пользователей
  ansible.builtin.assert:
    that:
      - web_gateway_users_state.stat.isreg | default(false)
      - (web_gateway_users_state.stat.size | default(0) | int) > 0
    fail_msg: "140: постоянный файл пользователей отсутствует; восстановить том или его копию"

- name: Проверить все обязательные постоянные секреты
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.paths.secrets }}/{{ item }}"
  loop:
    - authelia-session-secret
    - authelia-storage-encryption-key
    - authelia-jwt-secret
    - authelia-oidc-hmac-secret
    - authelia-oidc-jwks-pem
    - authelia-homarr-client-secret-hash
    - authelia-immich-client-secret-hash
    - immich-client-secret
    - homarr.env
  register: web_gateway_secret_status
  no_log: true

- name: Не запускать веб-шлюз без постоянных ключей
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - (item.stat.size | default(0) | int) > 0
    fail_msg: "140: постоянные секреты отсутствуют; восстановить прежнюю копию mp0"
  loop: "{{ web_gateway_secret_status.results }}"
  no_log: true

# Проверяем только имена параметров, не выводя значения и содержимое файла.
- name: Проверить необходимые параметры Homarr
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - "{{ item }}"
      - "{{ provision.web_gateway.paths.secrets }}/homarr.env"
  loop:
    - '^SECRET_ENCRYPTION_KEY=[0-9a-fA-F]{64}$'
    - '^AUTH_OIDC_CLIENT_SECRET=.+$'
  changed_when: false
  no_log: true

- name: Создать первоначальный список доменов только при отсутствии сохранённого
  ansible.builtin.copy:
    dest: "{{ provision.web_gateway.management.routes_state }}"
    content: "{{ provision.web_gateway.caddy.routes | to_nice_yaml(indent=2, sort_keys=false) }}"
    owner: root
    group: root
    mode: "0640"
    force: false

- name: Прочитать сохранённый список доменов
  ansible.builtin.slurp:
    src: "{{ provision.web_gateway.management.routes_state }}"
  register: web_gateway_routes_content

- name: Получить действующие настройки доменов
  ansible.builtin.set_fact:
    web_gateway_routes: "{{ web_gateway_routes_content.content | b64decode | from_yaml }}"

- name: Проверить тип списка доменов
  ansible.builtin.assert:
    that:
      - web_gateway_routes is sequence
      - web_gateway_routes is not string
    fail_msg: "140: сохранённый список доменов имеет неверный формат"

- name: Проверить включённые маршруты перед формированием Caddyfile
  ansible.builtin.assert:
    that:
      - item.domain is string
      - item.domain is match('^[a-z0-9-]+(\\.[a-z0-9-]+)*\\.zsergey\\.ru$')
      - item.upstream is defined
      - item.upstream is string
      - item.upstream is match('^https?://[A-Za-z0-9.:-]+$')
      - (item.access | default('public' if item.domain in provision.web_gateway.caddy.public_domains else 'protected')) in ['public', 'protected', 'private']
      - (item.access | default('public' if item.domain in provision.web_gateway.caddy.public_domains else 'protected')) != 'public' or item.domain in provision.web_gateway.caddy.public_domains
      - item.domain != provision.web_gateway.authelia.public_url.split('://', 1)[1] or (item.access | default('public')) == 'public'
    fail_msg: "140: неверное имя, назначение или режим доступа маршрута Caddy"
  loop: "{{ web_gateway_routes | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.domain | default('?') }}"

# Статическая страница не зависит от начальной настройки Homarr и HTTPS.
- name: Установить начальную домашнюю страницу
  ansible.builtin.copy:
    src: local-home.html
    dest: "{{ provision.web_gateway.paths.configuration }}/caddy/local-home/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Установить страницу подключения Google Authenticator
  ansible.builtin.copy:
    src: totp-setup.html
    dest: "{{ provision.web_gateway.paths.configuration }}/caddy/totp-setup/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Подготовить основной Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ provision.web_gateway.caddy.config_file }}"
    owner: root
    group: root
    mode: "0644"
  register: web_gateway_main_caddyfile

- name: Подготовить маршруты из сохранённого состояния
  ansible.builtin.template:
    src: sites.generated.caddy.j2
    dest: "{{ provision.web_gateway.caddy.generated_routes_file }}"
    owner: root
    group: root
    mode: "0644"
  register: web_gateway_generated_routes

- name: Подготовить настройки Authelia
  ansible.builtin.template:
    src: authelia-configuration.yml.j2
    dest: "{{ provision.web_gateway.authelia.config_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Подготовить Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ provision.web_gateway.paths.compose_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Проверить Docker Compose без вывода секретов
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.web_gateway.paths.compose_file }}"
      - config
      - --quiet
  changed_when: false
  no_log: true

- name: Загрузить закреплённые образы
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.web_gateway.paths.compose_file }}"
      - pull
  changed_when: false

- name: Проверить Caddyfile до запуска
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - caddy
      - --mount
      - "type=bind,src={{ provision.web_gateway.paths.configuration }}/caddy,dst=/etc/caddy,readonly"
      - "{{ provision.web_gateway.caddy.image }}"
      - validate
      - --config
      - /etc/caddy/Caddyfile
  changed_when: false

- name: Проверить конфигурацию Authelia до запуска
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.web_gateway.paths.compose_file }}"
      - run
      - --rm
      - --no-deps
      - authelia
      - authelia
      - config
      - validate
      - --config
      - /config/configuration.yml
  changed_when: false
  no_log: true

- name: Запустить веб-шлюз
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.web_gateway.paths.compose_file }}"
      - up
      - -d
      - --remove-orphans
  register: web_gateway_started
  changed_when: >-
    'Started' in (web_gateway_started.stdout + web_gateway_started.stderr)
    or 'Created' in (web_gateway_started.stdout + web_gateway_started.stderr)
    or 'Recreated' in (web_gateway_started.stdout + web_gateway_started.stderr)

- name: Применить изменённые маршруты без перезапуска Caddy
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ provision.web_gateway.caddy.container_name }}"
      - caddy
      - reload
      - --config
      - /etc/caddy/Caddyfile
  changed_when: true
  when: web_gateway_main_caddyfile.changed or web_gateway_generated_routes.changed

- name: Проверить отклик Homarr только на локальном порту
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ provision.web_gateway.homarr.internal_port }}"
    status_code: [200, 301, 302, 303, 307, 308]
    follow_redirects: none
  register: web_gateway_homarr_health
  until: web_gateway_homarr_health.status in [200, 301, 302, 303, 307, 308]
  retries: 20
  delay: 3

# Выполняем запросы напрямую на закрытый loopback-порт Homarr.
# Не обращаться через Caddy: сертификат пока может отсутствовать.
- name: Завершить первоначальную настройку Homarr через его интерфейс
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/lib/web-gateway/initialize-homarr.py
      - --url
      - "http://127.0.0.1:{{ provision.web_gateway.homarr.internal_port }}"
      - --state-file
      - "{{ provision.web_gateway.homarr.onboarding.ready_file }}"
      - --admin-group
      - "{{ provision.web_gateway.homarr.onboarding.admin_group }}"
  changed_when: false

# Создание через штатную CLI Authelia: в SQLite сохраняется закрытый ключ,
# QR не печатается в журналы и никогда не заменяется при повторном deploy.
- name: Установить сценарий подготовки Google Authenticator
  ansible.builtin.copy:
    src: initialize-totp.py
    dest: /usr/local/lib/web-gateway/initialize-totp.py
    owner: root
    group: root
    mode: "0700"

- name: Подготовить QR первого администратора через Authelia
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/lib/web-gateway/initialize-totp.py
      - --container
      - "{{ provision.web_gateway.authelia.container_name }}"
      - --username
      - "{{ provision.web_gateway.authelia.totp_setup.username }}"
      - --issuer
      - "{{ provision.web_gateway.domain }}"
      - --png
      - "{{ provision.web_gateway.authelia.totp_setup.qr_host }}"
      - --container-png
      - "{{ provision.web_gateway.authelia.totp_setup.qr_container }}"
  changed_when: false
  no_log: true

# Постоянного дополнительного веб-сервиса нет: systemd запускает временный
# обработчик только при незавершённой первичной регистрации (не более 15 минут).
- name: Установить временный обработчик QR
  ansible.builtin.copy:
    src: totp-setup-server.py
    dest: /usr/local/lib/web-gateway/totp-setup-server.py
    owner: root
    group: root
    mode: "0700"

- name: Установить описание временной службы QR
  ansible.builtin.template:
    src: web-gateway-totp-setup.service.j2
    dest: /etc/systemd/system/web-gateway-totp-setup.service
    owner: root
    group: root
    mode: "0644"

- name: Проверить наличие незавершённой регистрации
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.authelia.totp_setup.qr_host }}"
  register: web_gateway_totp_qr

- name: Проверить наличие временного URI
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.authelia.totp_setup.qr_host | regex_replace('\\.png$', '.uri') }}"
  register: web_gateway_totp_uri
  no_log: true

- name: Проверить подтверждение Google Authenticator
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.authelia.totp_setup.qr_host | regex_replace('\\.png$', '.confirmed') }}"
  register: web_gateway_totp_confirmed

- name: Открыть временную страницу на 15 минут
  ansible.builtin.systemd_service:
    name: web-gateway-totp-setup.service
    state: restarted
    enabled: false
    daemon_reload: true
  when:
    - web_gateway_totp_qr.stat.isreg | default(false)
    - web_gateway_totp_uri.stat.isreg | default(false)
    - not (web_gateway_totp_confirmed.stat.exists | default(false))

- name: Закрыть временную страницу если настройка уже завершена
  ansible.builtin.systemd_service:
    name: web-gateway-totp-setup.service
    state: stopped
    enabled: false
    daemon_reload: true
  when: >-
    not (web_gateway_totp_qr.stat.isreg | default(false))
    or not (web_gateway_totp_uri.stat.isreg | default(false))
    or (web_gateway_totp_confirmed.stat.exists | default(false))

- name: Подсказать адрес привязки Google Authenticator
  ansible.builtin.debug:
    msg: >-
      140: первый вход Google Authenticator без почты — откройте
      {{ provision.web_gateway.authelia.public_url }}{{ provision.web_gateway.authelia.totp_setup.url_path }}
      из домашней сети в течение 15 минут и отсканируйте QR.
      Введите шестизначный код для завершения: QR удалится автоматически.
      Для работы адреса нужен действительный сертификат HTTPS.

  when:
    - web_gateway_totp_qr.stat.isreg | default(false)
    - web_gateway_totp_uri.stat.isreg | default(false)
    - not (web_gateway_totp_confirmed.stat.exists | default(false))

- name: Подсказать команду просмотра первого пароля из терминала PVE
  ansible.builtin.debug:
    msg: >-
      140: пароль admin создан. Из доверенного терминала PVE выполните
      pct exec 140 -- python3 /usr/local/lib/web-gateway/show-initial-password.py .
      Команда читает сохранённый пароль без удаления; не запускайте её из Semaphore.
  when: not web_gateway_initial_state.stat.exists

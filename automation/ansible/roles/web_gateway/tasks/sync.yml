---
# При Sync нельзя создавать службы, менять их образы или секреты.
# Здесь обновляется только файл действующих маршрутов и выполняется caddy reload.
- name: Проверить постоянный том веб-шлюза перед синхронизацией
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.web_gateway.storage.required_mount }}"
  changed_when: false

- name: Проверить сохранённый список маршрутов
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.management.routes_state }}"
  register: web_gateway_routes_state

- name: Не создавать настройки маршрутов заново
  ansible.builtin.assert:
    that:
      - web_gateway_routes_state.stat.isreg | default(false)
    fail_msg: >-
      Отсутствует сохранённый список маршрутов 140.
      Sync не создаёт новое состояние; проверьте том и резервную копию.

- name: Прочитать действующие маршруты
  ansible.builtin.slurp:
    src: "{{ provision.web_gateway.management.routes_state }}"
  register: web_gateway_routes_content

- name: Проверить формат маршрутов
  ansible.builtin.set_fact:
    web_gateway_routes: "{{ web_gateway_routes_content.content | b64decode | from_yaml }}"

- name: Проверить список маршрутов
  ansible.builtin.assert:
    that:
      - web_gateway_routes is sequence
      - web_gateway_routes is not string
    fail_msg: "140: сохранённый список маршрутов имеет неверный формат"

- name: Проверить включённые маршруты перед изменением Caddy
  ansible.builtin.assert:
    that:
      - item.domain is string
      - item.domain is match('^[a-z0-9-]+(\\.[a-z0-9-]+)*\\.zsergey\\.ru$')
      - item.upstream is defined
      - item.upstream is string
      - item.upstream is match('^https?://[A-Za-z0-9.:-]+$')
      - (item.access | default('protected')) in ['public', 'protected', 'private', 'app_auth', 'git_https']
      - (item.access | default('protected')) != 'git_https' or (item.domain == 'git.zsergey.ru' and item.service | default('') == 'gogs')
      - (item.access | default('protected')) != 'app_auth' or (item.domain == 'photos.zsergey.ru' and item.service | default('') == 'immich')
      - (item.access | default('protected')) != 'public' or item.domain in provision.web_gateway.caddy.public_domains
    fail_msg: "140: неверное имя или назначение маршрута Caddy"
  loop: "{{ web_gateway_routes | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.domain | default('?') }}"

- name: Проверить установленный Caddy без изменения контейнера
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ provision.web_gateway.caddy.container_name }}"
  changed_when: false

- name: Сформировать маршруты из сохранённого состояния
  ansible.builtin.template:
    src: sites.generated.caddy.j2
    dest: "{{ provision.web_gateway.caddy.generated_routes_file }}"
    owner: root
    group: root
    mode: "0644"
  register: web_gateway_generated_routes

- name: Проверить новые маршруты в работающем Caddy
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ provision.web_gateway.caddy.container_name }}"
      - caddy
      - validate
      - --config
      - /etc/caddy/Caddyfile
  changed_when: false
  when: web_gateway_generated_routes.changed

- name: Применить маршруты без обновления Caddy
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ provision.web_gateway.caddy.container_name }}"
      - caddy
      - reload
      - --config
      - /etc/caddy/Caddyfile
  changed_when: true
  when: web_gateway_generated_routes.changed

- name: Проверить сохранённый каталог приложений
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.paths.persistent_state }}/management/catalog"
  register: web_gateway_catalog_dir

- name: Запретить синхронизацию без первоначального развёртывания
  ansible.builtin.assert:
    that:
      - web_gateway_catalog_dir.stat.isdir | default(false)
    fail_msg: >-
      На 140 ещё нет каталога портала. Нужна однократная установка
      настройки Caddy через infra-manager deploy 140.

- name: Обновить список гостей для администрирования
  ansible.builtin.include_tasks: catalog.yml

- name: Обновить домашние приложения без перезапуска служб
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/lib/web-gateway/home-apps.py
      - --state
      - "{{ provision.web_gateway.paths.persistent_state }}"
      - --policy
      - "{{ provision.web_gateway.paths.configuration }}/caddy/routes-policy.json"
  changed_when: false

- name: Проверить, что закрытая служба страниц работает
  ansible.builtin.stat:
    path: "{{ provision.web_gateway.portal.socket }}"
  register: web_gateway_portal_sync

- name: Запретить синхронизацию без работающего веб-портала
  ansible.builtin.assert:
    that:
      - web_gateway_portal_sync.stat.issock | default(false)

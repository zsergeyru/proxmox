---
- name: Проверить описание фотоархива
  ansible.builtin.assert:
    that:
      - provision.photo_archive.application == "immich"
      - provision.photo_archive.mode == "api-with-local-worker"
      - provision.photo_archive.storage.allow_missing_mount == false
    fail_msg: "340: некорректное описание Photo Archive"

- name: Проверить подключение постоянного хранилища
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.photo_archive.storage.required_external_mount }}"
  changed_when: false
  # При отсутствии mp0 не допускаем создания архива на системном диске.

- name: Проверить подключение постоянного состояния
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.photo_archive.storage.required_state_mount }}"
  changed_when: false

- name: Проверить подключение хранилища медиаданных
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ provision.photo_archive.storage.required_media_mount }}"
  changed_when: false
  # Не допускаем записи миниатюр и видео в корневой диск LXC.

- name: Проверить наличие каталога оригиналов
  ansible.builtin.stat:
    path: "{{ provision.photo_archive.paths.originals }}"
  register: photo_archive_originals

- name: Проверить каталог оригиналов
  ansible.builtin.assert:
    that:
      - photo_archive_originals.stat.isdir | default(false)
    fail_msg: "340: на подключённом хранилище отсутствует каталог originals"

- name: Создать постоянные каталоги приложения
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ provision.photo_archive.paths.root }}"
    - "{{ provision.photo_archive.paths.compose }}"
    - "{{ provision.photo_archive.paths.configuration }}"
    - "{{ provision.photo_archive.storage.required_state_mount }}/secrets"
    - "{{ provision.photo_archive.paths.uploads }}"
    - "{{ provision.photo_archive.paths.database }}"

- name: Проверить существующий пароль PostgreSQL
  ansible.builtin.stat:
    path: "{{ provision.photo_archive.paths.environment }}"
  register: photo_archive_env

- name: Проверить существующие файлы базы
  ansible.builtin.find:
    paths: "{{ provision.photo_archive.paths.database }}"
    file_type: any
    hidden: true
    recurse: false
  register: photo_archive_database_files

- name: Не создавать новый пароль для существующей базы
  ansible.builtin.assert:
    that:
      - photo_archive_env.stat.exists or photo_archive_database_files.matched | int == 0
    fail_msg: "340: база уже существует, но постоянный файл секрета отсутствует. Восстановить прежний секрет из OpenBao или резервной копии."

- name: Сгенерировать пароль базы при первом запуске
  ansible.builtin.command:
    argv: [python3, -c, "import secrets,string; a=string.ascii_letters+string.digits; print(''.join(secrets.choice(a) for _ in range(48)))"]
  changed_when: false
  register: photo_archive_generated_password
  no_log: true
  when: not photo_archive_env.stat.exists

- name: Сохранить параметры подключения к базе
  ansible.builtin.copy:
    dest: "{{ provision.photo_archive.paths.environment }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      DB_PASSWORD={{ photo_archive_generated_password.stdout }}
      POSTGRES_PASSWORD={{ photo_archive_generated_password.stdout }}
      REDIS_PASSWORD={{ photo_archive_generated_password.stdout }}
      DB_USERNAME=postgres
      DB_DATABASE_NAME=immich
      DB_HOSTNAME=database
      REDIS_HOSTNAME=redis
      TZ=Europe/Moscow
  no_log: true
  when: not photo_archive_env.stat.exists

- name: Проверить наличие пароля Redis для существующих параметров
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - "^REDIS_PASSWORD=[A-Za-z0-9]\\{16,\\}$"
      - "{{ provision.photo_archive.paths.environment }}"
  changed_when: false
  no_log: true
  # При старых параметрах не перезаписывать пароль и не ломать базу.

- name: Установить программу подготовки дополнений
  ansible.builtin.copy:
    src: setup_addons.py
    dest: "{{ provision.photo_archive.paths.root }}/setup_addons.py"
    owner: root
    group: root
    mode: "0750"

- name: Подготовить постоянные параметры дополнений
  ansible.builtin.command:
    argv:
      - python3
      - "{{ provision.photo_archive.paths.root }}/setup_addons.py"
      - --state
      - "{{ provision.photo_archive.storage.required_state_mount }}"
  register: photo_archive_addons_prepared
  changed_when: "'подготовлено файлов 0' not in photo_archive_addons_prepared.stdout"

- name: Проверить ключ Immich для включённых инструментов управления
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - "^IMMICH_API_KEY=.+"
      - /mnt/persistent-state/secrets/immich-power-tools.env
  changed_when: false
  no_log: true
  when: provision.photo_archive.addons.power_tools.enabled

- name: Проверить ключ Immich для включённого анализатора
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - "^IMMICH_API_KEY=.+"
      - /mnt/persistent-state/secrets/immich-analyze.env
  changed_when: false
  no_log: true
  when: provision.photo_archive.addons.analyze.enabled

- name: Проверить адрес локальной модели для включённого анализатора
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - "^IMMICH_ANALYZE_HOSTS=https?://.+"
      - /mnt/persistent-state/secrets/immich-analyze.env
  changed_when: false
  no_log: true
  when: provision.photo_archive.addons.analyze.enabled

- name: Проверить имя локальной модели для включённого анализатора
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - "^IMMICH_ANALYZE_MODEL_NAME=.+"
      - /mnt/persistent-state/secrets/immich-analyze.env
  changed_when: false
  no_log: true
  when: provision.photo_archive.addons.analyze.enabled

- name: Сформировать состав служб
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ provision.photo_archive.paths.compose_file }}"
    mode: "0644"

- name: Проверить состав служб
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.photo_archive.paths.compose_file }}"
      - config
      - --quiet
  changed_when: false

- name: Загрузить образы
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --profile
      - disabled-addons
      - -f
      - "{{ provision.photo_archive.paths.compose_file }}"
      - pull
  changed_when: false

- name: Запустить сервер фотоархива
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ provision.photo_archive.paths.compose_file }}"
      - up
      - -d
      - --remove-orphans
  register: photo_archive_started
  changed_when: "'Started' in (photo_archive_started.stdout + photo_archive_started.stderr) or 'Created' in (photo_archive_started.stdout + photo_archive_started.stderr) or 'Recreated' in (photo_archive_started.stdout + photo_archive_started.stderr)"

- name: Дождаться ответа Immich
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ provision.photo_archive.web_port }}/api/server/ping"
    status_code: 200
  register: photo_archive_health
  until: photo_archive_health.status == 200
  retries: 60
  delay: 3

- name: Проверить запись в исходный каталог из Docker Immich
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - immich_server
      - sh
      - -c
      - 'file=$(mktemp /external/originals/.immich-write-check.XXXXXX) && rm -f "$file"'
  changed_when: false
  when: not provision.photo_archive.storage.originals_read_only

- name: Установить программу начальной настройки Immich
  ansible.builtin.copy:
    src: initial_setup.py
    dest: "{{ provision.photo_archive.paths.root }}/initial_setup.py"
    owner: root
    group: root
    mode: "0750"

- name: Сохранить описание начальной настройки без паролей
  ansible.builtin.copy:
    dest: "{{ provision.photo_archive.paths.configuration }}/initial-setup.json"
    owner: root
    group: root
    mode: "0644"
    content: "{{ provision.photo_archive.initial_setup | to_nice_json(ensure_ascii=False) }}"

- name: Создать администратора, пользователей и семейную библиотеку при первом запуске
  ansible.builtin.command:
    argv:
      - python3
      - "{{ provision.photo_archive.paths.root }}/initial_setup.py"
      - --base-url
      - "http://127.0.0.1:{{ provision.photo_archive.web_port }}"
      - --config
      - "{{ provision.photo_archive.paths.configuration }}/initial-setup.json"
      - --state
      - "{{ provision.photo_archive.storage.required_state_mount }}"
      - --originals
      - "{{ provision.photo_archive.paths.originals }}"
  register: photo_archive_initial_setup
  changed_when: "'настройка Immich: применена' in photo_archive_initial_setup.stdout"

- name: Дождаться интерфейса воспоминаний
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ provision.photo_archive.addons.memories.web_port }}/health"
    status_code: 200
  register: photo_archive_memories_health
  until: photo_archive_memories_health.status == 200
  retries: 20
  delay: 3
  when: provision.photo_archive.addons.memories.enabled

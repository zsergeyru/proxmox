---
- name: Создать рабочие каталоги 910
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ provision.paths.configuration }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.secrets }}", owner: root, group: root, mode: "0700" }
    - { path: "{{ provision.paths.ca }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.ansible_identity }}", owner: "1001", group: "0", mode: "0700" }
    - { path: "{{ provision.paths.pve_host_identity }}", owner: "1001", group: "0", mode: "0700" }
    - { path: "{{ provision.paths.data }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.semaphore_data }}", owner: "1001", group: "0", mode: "0770" }
    - { path: "{{ provision.paths.opentofu_data }}", owner: "1001", group: "0", mode: "0750" }
    - { path: "{{ provision.paths.opentofu_state | dirname }}", owner: "1001", group: "0", mode: "0750" }
    - { path: "{{ provision.paths.compose }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ provision.paths.python_package }}", owner: root, group: root, mode: "0755" }

- name: Проверить сертификат PVE
  ansible.builtin.stat:
    path: "{{ provision.access.pve.ca_source }}"
  register: pve_ca

- name: Подтвердить сертификат PVE
  ansible.builtin.assert:
    that:
      - pve_ca.stat.exists
      - pve_ca.stat.size | int > 0
    fail_msg: "Первоначальный контур должен передать PVE CA до общей настройки"

- name: Добавить сертификат PVE в систему
  ansible.builtin.command:
    argv:
      - update-ca-certificates
  changed_when: false

- name: Подготовить общий набор сертификатов
  ansible.builtin.shell: |
    set -eu
    cat /etc/ssl/certs/ca-certificates.crt         {{ provision.access.pve.ca_source }}         > "{{ provision.paths.ca }}/ca-bundle.crt.tmp"
    chmod 0644 "{{ provision.paths.ca }}/ca-bundle.crt.tmp"
    mv "{{ provision.paths.ca }}/ca-bundle.crt.tmp" "{{ provision.paths.ca }}/ca-bundle.crt"
  args:
    executable: /bin/bash

- name: Проверить временный доступ к PVE
  ansible.builtin.stat:
    path: "{{ provision.access.pve.staging_credential }}"
  register: staging_pve_credential

- name: Сохранить постоянный доступ к PVE
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access.pve.staging_credential }}"
    dest: "{{ provision.access.pve.persistent_credential }}"
    owner: root
    group: root
    mode: "0600"
  when: staging_pve_credential.stat.exists

- name: Проверить сохранённый доступ к PVE
  ansible.builtin.stat:
    path: "{{ provision.access.pve.persistent_credential }}"
  register: permanent_pve_credential

- name: Подтвердить постоянный доступ к PVE
  ansible.builtin.assert:
    that:
      - permanent_pve_credential.stat.exists
      - permanent_pve_credential.stat.size | int > 0
    fail_msg: "Не удалось подготовить постоянный PVE API credential"

- name: Удалить временные данные доступа
  ansible.builtin.file:
    path: "{{ provision.access.pve.staging_credential }}"
    state: absent

- name: Проверить ключ управления гостями
  ansible.builtin.stat:
    path: "{{ provision.paths.ansible_identity }}/guest_ed25519"
  register: infra_ansible_private_key_stat

- name: Создать ключ управления гостями
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - infra-manager ansible guest
      - -f
      - "{{ provision.paths.ansible_identity }}/guest_ed25519"
  when: not infra_ansible_private_key_stat.stat.exists

- name: Получить открытый ключ управления
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ provision.paths.ansible_identity }}/guest_ed25519"
  register: infra_ansible_public_key_result
  changed_when: false

- name: Сохранить открытый ключ управления
  ansible.builtin.copy:
    dest: "{{ provision.paths.ansible_identity }}/guest_ed25519.pub"
    owner: "1001"
    group: "0"
    mode: "0644"
    content: "{{ infra_ansible_public_key_result.stdout }} infra-manager ansible guest\n"

- name: Защитить ключ управления
  ansible.builtin.file:
    path: "{{ provision.paths.ansible_identity }}/guest_ed25519"
    owner: "1001"
    group: "0"
    mode: "0600"

- name: Подготовить SSH-каталог root
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Разрешить постоянному Ansible-ключу управлять 910
  ansible.builtin.blockinfile:
    path: /root/.ssh/authorized_keys
    marker: "# {mark} infra-manager ansible self"
    block: "{{ infra_ansible_public_key_result.stdout }} infra-manager ansible guest"
    create: true
    owner: root
    group: root
    mode: "0600"

- name: Проверить полный доступ к PVE
  ansible.builtin.stat:
    path: "{{ provision.access.pve.root_ssh_private_key }}"
  register: pve_root_ssh_key

- name: Подтвердить полный доступ к PVE
  ansible.builtin.assert:
    that:
      - pve_root_ssh_key.stat.exists
      - pve_root_ssh_key.stat.size | int > 0
    fail_msg: "Первоначальный контур должен передать root SSH-ключ PVE"

- name: Защитить ключ доступа к PVE
  ansible.builtin.file:
    path: "{{ provision.access.pve.root_ssh_private_key }}"
    owner: "1001"
    group: "0"
    mode: "0600"

- name: Зафиксировать ключ сервера PVE
  ansible.builtin.file:
    path: "{{ provision.access.pve.root_ssh_known_hosts }}"
    owner: "1001"
    group: "0"
    mode: "0644"

- name: Получить выбранную ветку проекта для самообновления
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ provision.paths.bootstrap_repository }}"
      - fetch
      - --depth
      - "1"
      - origin
      - "{{ infra_project_branch | default('main') }}"
  environment:
    GIT_SSH_COMMAND: "ssh -F /root/.ssh/github_config"
  changed_when: true
  when: infra_self_update | default(false) | bool

- name: Переключить рабочую копию 910 на полученную версию
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ provision.paths.bootstrap_repository }}"
      - reset
      - --hard
      - FETCH_HEAD
  changed_when: true
  when: infra_self_update | default(false) | bool

- name: Удалить лишние файлы из рабочей копии 910
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ provision.paths.bootstrap_repository }}"
      - clean
      - -ffdx
  changed_when: true
  when: infra_self_update | default(false) | bool

- name: Подготовить файлы управляющей среды
  ansible.builtin.copy:
    src: "{{ guest_root }}/compose/"
    dest: "{{ provision.paths.compose }}/"
    owner: root
    group: root
    mode: preserve

- name: Зафиксировать ключ GitHub для Semaphore
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.access.github.known_hosts }}"
    dest: "{{ provision.paths.semaphore_data }}/known_hosts"
    owner: "1001"
    group: "0"
    mode: "0644"

- name: Проверить настройки Semaphore
  ansible.builtin.stat:
    path: "{{ provision.paths.secrets }}/semaphore-server.env"
  register: semaphore_env

- name: Создать пароль Semaphore
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "24"]
  register: semaphore_admin_password
  no_log: true
  changed_when: true
  when: not semaphore_env.stat.exists

- name: Создать ключ защиты Semaphore
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "32"]
  register: semaphore_encryption_key
  no_log: true
  changed_when: true
  when: not semaphore_env.stat.exists

- name: Сохранить настройки Semaphore
  ansible.builtin.copy:
    dest: "{{ provision.paths.secrets }}/semaphore-server.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      SEMAPHORE_DB_DIALECT=sqlite
      SEMAPHORE_DB_HOST=/var/lib/semaphore/semaphore.sqlite
      SEMAPHORE_ADMIN=admin
      SEMAPHORE_ADMIN_PASSWORD={{ semaphore_admin_password.stdout | default('') }}
      SEMAPHORE_ADMIN_NAME=Admin
      SEMAPHORE_ADMIN_EMAIL=admin@localhost
      SEMAPHORE_ACCESS_KEY_ENCRYPTION={{ semaphore_encryption_key.stdout | default('') }}
      TZ={{ ansible_facts.date_time.tz | default('UTC') }}
  no_log: true
  when: not semaphore_env.stat.exists

- name: Сохранить пароль Semaphore
  ansible.builtin.copy:
    dest: "{{ provision.paths.secrets }}/initial-admin-password"
    owner: root
    group: root
    mode: "0600"
    content: "{{ semaphore_admin_password.stdout | default('') }}\n"
  no_log: true
  when: not semaphore_env.stat.exists

- name: Проверить пароль Semaphore
  ansible.builtin.stat:
    path: "{{ provision.paths.secrets }}/initial-admin-password"
  register: semaphore_admin_password_file

- name: Проверить сохранённые настройки Semaphore
  ansible.builtin.assert:
    that:
      - semaphore_admin_password_file.stat.exists
      - semaphore_admin_password_file.stat.size | int > 0
    fail_msg: "Есть semaphore-server.env, но отсутствует initial-admin-password"
  when: semaphore_env.stat.exists

- name: Удалить старую настройку исполнителя Semaphore
  ansible.builtin.lineinfile:
    path: "{{ provision.paths.secrets }}/semaphore-server.env"
    regexp: "{{ item }}"
    state: absent
  loop:
    - "^SEMAPHORE_USE_REMOTE_RUNNER="
    - "^SEMAPHORE_RUNNER_REGISTRATION_TOKEN="
  no_log: true

- name: Удалить старый файл исполнителя Semaphore
  ansible.builtin.file:
    path: "{{ provision.paths.secrets }}/semaphore-runner.env"
    state: absent

- name: Подготовить список гостей для OpenTofu
  ansible.builtin.command:
    argv:
      - python3
      - "{{ provision.paths.bootstrap_repository }}/scripts/guests/render-opentofu-input.py"
      - --output
      - "{{ provision.paths.opentofu_data }}/guests.json"
      - --exclude-vmid
      - "910"
  changed_when: true

- name: Защитить список гостей OpenTofu
  ansible.builtin.file:
    path: "{{ provision.paths.opentofu_data }}/guests.json"
    owner: "1001"
    group: "0"
    mode: "0640"

- name: Записать версии управляющих средств
  ansible.builtin.copy:
    dest: "{{ provision.paths.compose }}/.versions.env"
    owner: root
    group: root
    mode: "0644"
    content: |
      SEMAPHORE_VERSION={{ provision.docker.services.runtime.base_image.split(':')[-1] }}
      RUNTIME_VERSION={{ provision.docker.services.runtime.image.split(':')[-1] }}
      OPENTOFU_VERSION={{ provision.docker.services.runtime.tools.opentofu }}
      PACKER_VERSION={{ provision.docker.services.runtime.tools.packer }}

- name: Установить описание состояния 910
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/infrastructure/guests/{{ guest }}/status.yaml"
    dest: "{{ provision.paths.configuration }}/status.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Установить служебный код 910
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/infra_manager/"
    dest: "{{ provision.paths.python_package }}/infra_manager/"
    owner: root
    group: root
    mode: preserve

- name: Установить команды управления
  ansible.builtin.copy:
    remote_src: true
    src: "{{ provision.paths.bootstrap_repository }}/scripts/infra-manager/commands/{{ item.source }}"
    dest: "/usr/local/sbin/{{ item.target }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { source: status.sh, target: infra-manager-status }
    - { source: pve-access-check.sh, target: infra-manager-pve-access-check }
    - { source: pve-lifecycle-test.sh, target: infra-manager-pve-lifecycle-test }
    - { source: activate-runtime.sh, target: infra-manager-activate-runtime }

- name: Создать короткие команды управления
  ansible.builtin.file:
    src: "/usr/local/sbin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - infra-manager-status
    - infra-manager-pve-access-check
    - infra-manager-pve-lifecycle-test

- name: Настроить владельца данных Semaphore
  ansible.builtin.file:
    path: "{{ provision.paths.semaphore_data }}"
    owner: "1001"
    group: "0"
    recurse: true

- name: Настроить права каталогов Semaphore
  ansible.builtin.command:
    argv:
      - find
      - "{{ provision.paths.semaphore_data }}"
      - -type
      - d
      - -exec
      - chmod
      - "0770"
      - "{}"
      - "+"
  changed_when: true

- name: Настроить права файлов Semaphore
  ansible.builtin.command:
    argv:
      - find
      - "{{ provision.paths.semaphore_data }}"
      - -type
      - f
      - -exec
      - chmod
      - "0660"
      - "{}"
      - "+"
  changed_when: true

- name: Собрать управляющую среду
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - build
      - --pull
      - runtime
  changed_when: true

- name: Запустить управляющую среду
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ provision.paths.compose }}/.versions.env"
      - -f
      - "{{ provision.paths.compose }}/docker-compose.yml"
      - up
      - -d
      - --remove-orphans
  changed_when: true
  when: not (infra_self_update | default(false) | bool)

- name: Дождаться запуска Semaphore
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3000
    timeout: 120

- name: Проверить управляющие средства
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [docker, exec, infra-runtime, tofu, version]
    - [docker, exec, infra-runtime, packer, version]
    - [docker, exec, infra-runtime, ansible, --version]
    - [docker, exec, infra-runtime, python3, -c, "import proxmoxer, yaml, jsonschema"]
  changed_when: false

- name: Настроить проект Semaphore
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - infra_manager
      - semaphore-project
  environment:
    PYTHONPATH: "{{ provision.paths.python_package }}"
    INFRA_PROJECT_BRANCH: "{{ infra_project_branch | default(lookup('env', 'INFRA_PROJECT_BRANCH') | default('main', true), true) }}"
  changed_when: true

- name: Проверить готовность 910
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/infra-manager-status
      - --full
      - --quiet
  environment:
    INFRA_PROJECT_BRANCH: "{{ infra_project_branch | default(lookup('env', 'INFRA_PROJECT_BRANCH') | default('main', true), true) }}"
  changed_when: false

- name: Назначить активацию новой управляющей среды после задания Semaphore
  ansible.builtin.command:
    argv:
      - systemd-run
      - "--unit=infra-manager-runtime-activate-{{ ansible_date_time.epoch }}"
      - --on-active=30s
      - --collect
      - env
      - "INFRA_PROJECT_BRANCH={{ infra_project_branch | default('main') }}"
      - /usr/local/sbin/infra-manager-activate-runtime
  changed_when: true
  when: infra_self_update | default(false) | bool

---
- name: Зарегистрировать общие папки через OpenMediaVault
  hosts: nas
  gather_facts: false
  become: false
  tasks:
    - name: Проверить назначения томов и соответствие OMV
      ansible.builtin.assert:
        that:
          - nas_shared_mount is match('^/srv/[A-Za-z0-9_./-]+$')
          - nas_data_mountpoint is match('^/[A-Za-z0-9_./-]+$')
          - nas_shared_ref is match('^[0-9a-f-]{36}$')
          - nas_data_ref is match('^[0-9a-f-]{36}$')
          - nas_shared_uuid | length > 4
        fail_msg: Нет подтверждённых ссылок на файловые системы OMV

    - name: Повторно проверить подключение общего HDD по UUID
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, "{{ nas_shared_mount }}", --source, "UUID={{ nas_shared_uuid }}"]
      changed_when: false

    - name: Повторно проверить подключение основного ZFS
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, "{{ nas_data_mountpoint }}", --types, zfs]
      changed_when: false

    - name: Создать общие каталоги без удаления существующих файлов
      ansible.builtin.file:
        path: "{{ item.root }}/{{ item.directory }}"
        state: directory
        owner: root
        group: users
        mode: "0770"
      loop:
        - {root: "{{ nas_shared_mount }}", directory: shared}
        - {root: "{{ nas_shared_mount }}", directory: movies}
        - {root: "{{ nas_shared_mount }}", directory: music}
        - {root: "{{ nas_data_mountpoint }}", directory: data}

    - name: Установить штатный обработчик базы OMV
      ansible.builtin.copy:
        src: ../files/nas-omv-shares.py
        dest: /usr/local/sbin/nas-omv-shares
        owner: root
        group: root
        mode: "0750"

    - name: Зарегистрировать папки и ресурсы через базу OMV
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/nas-omv-shares
          - --shared-ref
          - "{{ nas_shared_ref }}"
          - --data-ref
          - "{{ nas_data_ref }}"
          - --shared-mount
          - "{{ nas_shared_mount }}"
          - --data-mount
          - "{{ nas_data_mountpoint }}"
      register: nas_smb_register
      changed_when: "'Созданы новые записи' in nas_smb_register.stdout"

    - name: Проверить запущенную службу Samba
      ansible.builtin.command:
        argv: [systemctl, is-active, smbd.service]
      changed_when: false

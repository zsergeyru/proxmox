---
# Internal trusted phase of "infra-manager deploy nas" ONLY. No extra command.
# Approvals arrive from the PVE prompt as a fingerprint, never device paths.
- name: Безопасно подтвердить накопители в рамках одного deploy NAS
  hosts: nas
  gather_facts: false
  become: false
  vars:
    physical_storage: >-
      {{ lookup('ansible.builtin.file',
         playbook_dir ~ '/../../../infrastructure/hosts/nas/storage.yaml') | from_yaml }}
  tasks:
    - name: Проверить и пересчитать план на реальном железе
      ansible.builtin.include_role:
        name: physical_storage
        tasks_from: plan.yml

    - name: Запретить подмену плана между показом и подтверждением на PVE
      ansible.builtin.assert:
        that:
          - physical_approved_fingerprint is defined
          - physical_approved_fingerprint is match('^[0-9a-f]{64}$')
          - physical_plan_fingerprint == physical_approved_fingerprint
          - physical_plan_assignments | length == physical_storage.devices | length
          - physical_plan_assignments | map(attribute='serial') | unique | list | length == physical_plan_assignments | length
        fail_msg: Диски изменились после подтверждения. Никаких записей не выполнялось

    - name: Подтвердить, что уже зафиксированные UUID/GUID остаются неизменны
      ansible.builtin.debug:
        msg: Контроллер и Ansible подтвердили действующую идентичность дисков
      when: physical_plan_previous.stat.exists | default(false)

    - name: Принять существующие ext4/ZFS после независимой сверки
      ansible.builtin.include_role:
        name: nas
        tasks_from: adopt-storage.yml
      when:
        - not (physical_plan_previous.stat.exists | default(false))
        - physical_plan_assignments | map(attribute='action') | unique | list == ['preserve']

    - name: Создать ФС только на действительно пустых ранее утверждённых HDD
      ansible.builtin.include_role:
        name: nas
        tasks_from: initialize-blank.yml
      when:
        - not (physical_plan_previous.stat.exists | default(false))
        - physical_plan_assignments | rejectattr('role', 'equalto', 'system') | map(attribute='action') | unique | list == ['recreate']

    - name: Проверить полную идентичность HDD в permanent state 910
      ansible.builtin.include_role:
        name: physical_storage
        tasks_from: verified.yml

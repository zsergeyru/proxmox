---
- name: Развернуть приложения на подтверждённом томе NAS
  hosts: nas
  gather_facts: false
  become: false
  tasks:
    - name: Проверить подтверждённые параметры загрузок
      ansible.builtin.assert:
        that:
          - nas_shared_mount is match('^/srv/[A-Za-z0-9_./-]+$')
          - nas_shared_uuid | length > 4
          - nas_qbit_image is match('^lscr.io/linuxserver/qbittorrent:[A-Za-z0-9_.-]+$')
        fail_msg: Нельзя запускать приложения без подтверждённого тома и образа

    - name: Повторно сверить точку подключения и UUID ext4
      ansible.builtin.command:
        argv:
          - findmnt
          - --mountpoint
          - "{{ nas_shared_mount }}"
          - --source
          - "UUID={{ nas_shared_uuid }}"
      register: nas_qbit_mounted
      changed_when: false

    - name: Создать служебную группу
      ansible.builtin.group:
        name: nas-qbittorrent
        system: true

    - name: Создать служебного пользователя
      ansible.builtin.user:
        name: nas-qbittorrent
        group: nas-qbittorrent
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Узнать номер служебного пользователя
      ansible.builtin.command:
        argv: [id, -u, nas-qbittorrent]
      register: nas_qbit_uid
      changed_when: false

    - name: Узнать номер служебной группы
      ansible.builtin.command:
        argv: [id, -g, nas-qbittorrent]
      register: nas_qbit_gid
      changed_when: false

    - name: Создать каталоги загрузок только на подтверждённом HDD
      ansible.builtin.file:
        path: "{{ nas_shared_mount }}/{{ item }}"
        state: directory
        owner: nas-qbittorrent
        group: nas-qbittorrent
        mode: "0770"
      loop:
        - downloads
        - downloads/incomplete
        - downloads/complete

    - name: Создать каталог настроек приложения на SSD
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: nas-qbittorrent
        group: nas-qbittorrent
        mode: "0750"
      loop:
        - /var/lib/nas-apps
        - /var/lib/nas-apps/qbittorrent
        - /var/lib/nas-apps/qbittorrent/config

    - name: Создать каталог описания приложения
      ansible.builtin.file:
        path: /etc/nas-apps/qbittorrent
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Установить описание Docker Compose
      ansible.builtin.template:
        src: ../templates/nas-qbittorrent.compose.yml.j2
        dest: /etc/nas-apps/qbittorrent/compose.yml
        owner: root
        group: root
        mode: "0644"
      register: nas_qbit_compose

    - name: Установить службу запуска с проверкой HDD
      ansible.builtin.template:
        src: ../templates/nas-qbittorrent.service.j2
        dest: /etc/systemd/system/nas-qbittorrent.service
        owner: root
        group: root
        mode: "0644"
      register: nas_qbit_unit

    - name: Подключить службу qBittorrent после проверки HDD
      ansible.builtin.systemd_service:
        name: nas-qbittorrent.service
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (nas_qbit_compose.changed or nas_qbit_unit.changed) else 'started' }}"

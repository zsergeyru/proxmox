---
# Read-only proof for a previous full three-disk creation attempt.
# Not a formatter: it cannot call prepare-journal.yml or prepare-write.yml.
# The old recovery executor still owns OMV registration and state persistence.
- name: Проверить существующие тома по журналу без повторного форматирования
  hosts: all
  gather_facts: false
  become: false
  vars:
    physical_storage: >-
      {{ lookup('ansible.builtin.file',
         playbook_dir ~ '/../../../infrastructure/hosts/' ~ physical_host_name ~ '/storage.yaml')
         | from_yaml }}
    physical_recovery_intent: "{{ physical_disk_intent }}"
  tasks:
    - name: Сверить прежний журнал и фактические ext4/ZFS HDD
      ansible.builtin.include_role:
        name: physical_storage
        tasks_from: prepare-recover-inspect.yml

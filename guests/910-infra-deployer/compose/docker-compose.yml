services:
  semaphore:
    build:
      context: ./semaphore
      args:
        SEMAPHORE_VERSION: ${SEMAPHORE_VERSION}
        OPENTOFU_VERSION: ${OPENTOFU_VERSION}
        PACKER_VERSION: ${PACKER_VERSION}
    image: infra-deployer-semaphore:${SEMAPHORE_VERSION}
    container_name: infra-deployer-semaphore
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/infra-deployer/secrets/semaphore-server.env
    volumes:
      - /var/lib/infra-deployer/semaphore:/var/lib/semaphore
      - /etc/infra-deployer/ca:/etc/infra-deployer/ca:ro
      - /var/lib/infra-deployer/opentofu:/var/lib/infra-deployer/opentofu

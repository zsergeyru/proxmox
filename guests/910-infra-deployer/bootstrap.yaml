schema_version: 1

vmid: 910
name: infra-deployer
type: lxc
node: pve

os:
  distribution: debian
  version: 13
  template: debian-13-standard

resources:
  cores: 2
  memory_mb: 2048
  swap_mb: 512
  root_disk_gb: 32
  storage: local-lvm

network:
  bridge: vmbr0
  addressing: vmid

lxc:
  unprivileged: true
  nesting: true
  keyctl: true

boot:
  onboot: true

protection: true

ownership:
  owner: public-bootstrap
  role: infra-deployer
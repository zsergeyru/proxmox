schema_version: 1

defaults:
  node: pve
  protection: false
  placement:
    pool: managed
  resources:
    disk:
      storage: local-lvm
  network:
    bridge: vmbr0
    mode: current
    default_gateway: current
  boot:
    onboot: true
    start_after_deploy: true
  management:
    ssh:
      user: ops
      port: 22

network_stages:
  current:
    subnet: 192.168.0.0/16
    gateway: 192.168.1.1
  target:
    subnet: 10.0.0.0/16
    gateway: 10.0.0.1

profiles:
  debian-vm:
    type: vm
    vm:
      source:
        template_vmid: 9000
        clone: full
      guest_agent: true

  docker-lxc:
    type: lxc
    lxc:
      container_runtime: docker
      source:
        ostemplate: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst
        download_if_missing: true
      unprivileged: true
      features:
        nesting: true
        keyctl: true

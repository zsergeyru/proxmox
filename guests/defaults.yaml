schema_version: 4

defaults:
  node: pve
  protection: true
  pve_management: true
  resources:
    disk_storage: local-lvm
  network:
    bridge: vmbr0
    subnet: 192.168.0.0/16
    gateway: 192.168.1.1
  boot:
    onboot: true

profiles:
  debian-vm:
    type: vm
    template_vmid: 9000

  debian-lxc-docker:
    type: lxc
    ostemplate: local:vztmpl/debian-13-standard
    features:
      - container-host

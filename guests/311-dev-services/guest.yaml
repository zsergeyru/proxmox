schema_version: 2
vmid: 311
name: dev-services
type: lxc
state: planned
deployable: true
node: pve

description: Ansible, Semaphore, Git, CI and development services

protection: false

placement:
  pool: managed

resources:
  cpu:
    cores: 2
  memory_mb: 4096
  swap_mb: 1024
  disk:
    size_gb: 32
    storage: local-lvm

network:
  bridge: vmbr0
  current:
    ipv4:
      address: 192.168.3.11/16
      gateway: 192.168.1.1
  target:
    ipv4:
      address: 10.0.3.11/16
      gateway: 10.0.0.1

boot:
  onboot: true
  start_after_deploy: true

management:
  ssh:
    user: ops
    port: 22

lxc:
  container_runtime: docker
  source:
    ostemplate: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst
    download_if_missing: true
  unprivileged: true
  features:
    nesting: true
    keyctl: true

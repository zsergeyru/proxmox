$schema: https://json-schema.org/draft/2020-12/schema
$title: Proxmox guest source manifest
type: object
additionalProperties: false
required: [schema_version, vmid, name, state, deployable, description]
properties:
  schema_version:
    const: 7
  vmid:
    type: integer
    minimum: 100
    maximum: 999
  name:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  profile:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  type:
    enum: [vm, lxc, undecided]
  state:
    enum: [planned, active, bootstrap, legacy]
  deployable:
    type: boolean
  node:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  protection:
    type: boolean
  placement:
    $ref: '#/$defs/placement'
  resources:
    $ref: '#/$defs/resources'
  network:
    $ref: '#/$defs/sourceNetwork'
  boot:
    $ref: '#/$defs/boot'
  management:
    $ref: '#/$defs/management'
  bootstrap:
    $ref: '#/$defs/bootstrap'
  vm:
    $ref: '#/$defs/vm'
  lxc:
    $ref: '#/$defs/lxc'
$defs:
  placement:
    type: object
    additionalProperties: false
    properties:
      pool:
        type: [string, 'null']
        minLength: 1
  resources:
    type: object
    additionalProperties: false
    properties:
      cpu:
        type: object
        additionalProperties: false
        properties:
          cores:
            type: integer
            minimum: 1
          type:
            type: string
            minLength: 1
      memory_mb:
        type: integer
        minimum: 256
      ballooning_mb:
        type: integer
        minimum: 0
      swap_mb:
        type: integer
        minimum: 0
      disk:
        type: object
        additionalProperties: false
        properties:
          size_gb:
            type: integer
            minimum: 1
          storage:
            type: string
            minLength: 1
  sourceNetwork:
    type: object
    additionalProperties: false
    properties:
      bridge:
        type: string
        minLength: 1
      ipv4:
        type: object
        additionalProperties: false
        required: [address]
        properties:
          address:
            type: string
            minLength: 1
  boot:
    type: object
    additionalProperties: false
    properties:
      onboot:
        type: boolean
      start_after_deploy:
        type: boolean
  management:
    type: object
    additionalProperties: false
    properties:
      ssh:
        type: object
        additionalProperties: false
        properties:
          user:
            type: string
            minLength: 1
          port:
            type: integer
            minimum: 1
            maximum: 65535
      ssh_identity:
        type: boolean
      project_repo_read:
        type: boolean
  bootstrap:
    type: object
    additionalProperties: false
    required: [capabilities]
    properties:
      capabilities:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          base:
            type: boolean
          git:
            type: boolean
          docker:
            type: boolean
          ansible_controller:
            type: boolean
  vm:
    type: object
    additionalProperties: false
    properties:
      source:
        type: object
        additionalProperties: false
        properties:
          template_vmid:
            type: integer
            minimum: 100
            maximum: 9999
          clone:
            enum: [full]
      guest_agent:
        type: boolean
      bios:
        enum: [ovmf, seabios]
  lxc:
    type: object
    additionalProperties: false
    properties:
      container_runtime:
        enum: [docker]
      source:
        type: object
        additionalProperties: false
        properties:
          ostemplate:
            type: string
            minLength: 1
      unprivileged:
        type: boolean
      features:
        type: object
        additionalProperties: false
        properties:
          nesting:
            type: boolean
          keyctl:
            type: boolean
allOf:
  - if:
      required: [deployable]
      properties:
        deployable:
          const: true
    then:
      required: [profile, resources]
      properties:
        resources:
          required: [cpu, memory_mb, disk]
          properties:
            cpu:
              required: [cores]
            disk:
              required: [size_gb]
  - if:
      required: [deployable]
      properties:
        deployable:
          const: false
    then:
      required: [type]
  - if:
      required: [type]
      properties:
        type:
          const: undecided
    then:
      properties:
        deployable:
          const: false
  - if:
      required: [bootstrap]
    then:
      properties:
        deployable:
          const: true
  - if:
      required: [management]
      properties:
        management:
          anyOf:
            - required: [ssh_identity]
            - required: [project_repo_read]
    then:
      properties:
        deployable:
          const: true

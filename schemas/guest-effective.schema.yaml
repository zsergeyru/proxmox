$schema: https://json-schema.org/draft/2020-12/schema
$title: Proxmox effective guest desired state
type: object
additionalProperties: false
required:
  - schema_version
  - vmid
  - name
  - profile
  - type
  - state
  - deployable
  - node
  - description
properties:
  schema_version:
    const: 5
  vmid:
    type: integer
    minimum: 100
    maximum: 999
  name:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  profile:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  type:
    enum: [vm, lxc]
  state:
    enum: [planned, active, bootstrap, legacy]
  deployable:
    const: true
  node:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  protection:
    type: boolean
  placement:
    type: object
    additionalProperties: false
    required: [pool]
    properties:
      pool:
        type: [string, 'null']
        minLength: 1
  resources:
    type: object
    additionalProperties: false
    required: [cpu, memory_mb, disk]
    properties:
      cpu:
        type: object
        additionalProperties: false
        required: [cores]
        properties:
          cores:
            type: integer
            minimum: 1
          type:
            type: string
            minLength: 1
      memory_mb:
        type: integer
        minimum: 256
      ballooning_mb:
        type: integer
        minimum: 0
      swap_mb:
        type: integer
        minimum: 0
      disk:
        type: object
        additionalProperties: false
        required: [size_gb, storage]
        properties:
          size_gb:
            type: integer
            minimum: 1
          storage:
            type: string
            minLength: 1
  network:
    type: object
    additionalProperties: false
    required: [bridge, subnet, gateway, addressing, ipv4]
    properties:
      bridge:
        type: string
        minLength: 1
      subnet:
        type: string
        minLength: 1
      gateway:
        type: string
        minLength: 1
      addressing:
        const: vmid
      ipv4:
        type: object
        additionalProperties: false
        required: [address]
        properties:
          address:
            type: string
            minLength: 1
  boot:
    type: object
    additionalProperties: false
    required: [onboot, start_after_deploy]
    properties:
      onboot:
        type: boolean
      start_after_deploy:
        type: boolean
  management:
    type: object
    additionalProperties: false
    required: [ssh]
    properties:
      ssh:
        type: object
        additionalProperties: false
        required: [user, port]
        properties:
          user:
            const: root
          port:
            const: 22
  vm:
    type: object
    additionalProperties: false
    properties:
      source:
        type: object
        additionalProperties: false
        required: [template_vmid, clone]
        properties:
          template_vmid:
            type: integer
            minimum: 100
            maximum: 9999
          clone:
            enum: [full]
      guest_agent:
        type: boolean
      bios:
        enum: [ovmf, seabios]
  lxc:
    type: object
    additionalProperties: false
    properties:
      container_runtime:
        enum: [docker]
      source:
        type: object
        additionalProperties: false
        required: [ostemplate]
        properties:
          ostemplate:
            type: string
            minLength: 1
      unprivileged:
        type: boolean
      features:
        type: object
        additionalProperties: false
        required: [nesting, keyctl]
        properties:
          nesting:
            type: boolean
          keyctl:
            type: boolean
allOf:
  - required: [protection, placement, resources, network, boot, management]
  - if:
      properties:
        type:
          const: vm
    then:
      required: [vm]
      properties:
        vm:
          required: [source, guest_agent]
  - if:
      properties:
        type:
          const: lxc
    then:
      required: [lxc]
      properties:
        resources:
          required: [swap_mb]
        lxc:
          required: [source, unprivileged, features]
  - if:
      properties:
        lxc:
          type: object
          required: [container_runtime]
          properties:
            container_runtime:
              const: docker
      required: [lxc]
    then:
      properties:
        lxc:
          properties:
            unprivileged:
              const: true
            features:
              properties:
                nesting:
                  const: true
                keyctl:
                  const: true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "F821",
    "BLE001",
    "PIE810",
    "RUF100",
    "TRY004",
    "UP037",
]

[tool.ruff.lint.per-file-ignores]
# GuestConfigError — доменная ошибка некорректного содержимого внешней
# конфигурации, даже когда конкретная проверка начинается с isinstance.
"scripts/guests/resolver.py" = ["TRY004"]

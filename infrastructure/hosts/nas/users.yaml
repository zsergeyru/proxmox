# Локальные учётные записи NAS для SMB. Без LDAP и Authelia.
# Список заполняется до первого развёртывания NAS.
# Паролей, хешей и временных кодов в этом файле быть не должно.
schema_version: 1

# Группы создаются на NAS, если их ещё нет.
# Пример (неактивен, пока не указан реальный пользователь):
# groups:
#   - family
#   - nas-admins
groups: []

# Пароль каждого пользователя создаётся или получается отдельно из OpenBao.
# Пример:
# users:
#   - name: example
#     groups: [family]
users: []

# Доступ к общим папкам только по указанным группам.
# Запись подразумевает чтение. Пустой список запрещает доступ этой категории.
# Ниже права пока никому не выданы — их нужно согласовать до запуска.
shares:
  shared:
    read_groups: []
    write_groups: []
  movies:
    read_groups: []
    write_groups: []
  music:
    read_groups: []
    write_groups: []
  data:
    read_groups: []
    write_groups: []

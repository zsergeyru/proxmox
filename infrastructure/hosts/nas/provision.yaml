# Declarative NAS deployment and operator-facing services.
# Physical identity and disk layout are in host.yaml/storage.yaml.
# UrBackup policy and retention stay in backup.yaml.
schema_version: 1
host: nas
system:
  distribution: debian
  version: "13"
  application: openmediavault
  application_version: "8"
  # Allowlisted, additive package groups. Packages no longer required by an
  # optional component are preserved; deploy does not remove packages.
  packages:
    diagnostics:
      - smartmontools
      - acl
      - gdisk
      - e2fsprogs
      - util-linux
      - udev
      - jq
      - ca-certificates
      - curl
      - python3
    omv_prerequisites: [python3-debian, xz-utils, gnupg]
    omv_extensions: [openmediavault-zfs, openmediavault-compose]
    docker: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
  services:
    smart: smartmontools.service
    containers: docker.service
deployment:
  phases: [base, services]
  # Keep dependency order: server network -> LAN client -> downloads -> SMB.
  components: [urbackup_server, urbackup_client, apps, smb]
  # Dependencies are checked before any Ansible task is run.
  dependencies:
    urbackup_client: [urbackup_server]
services:
  openmediavault:
    component: base
    title: OpenMediaVault
    # OMV was installed manually; detect its actual published URL instead
    # of assuming a working HTTP/HTTPS port or resetting its password.
    address: auto_omv
    operator:
      username: admin
  qbittorrent:
    component: apps
    title: qBittorrent
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    runtime:
      timezone: Etc/UTC
      web_port: 8080
      torrent_port: 6881
      downloads_directory: downloads
      directories: [downloads, downloads/incomplete, downloads/complete]
    url: "http://{address}:8080/"
    operator:
      username: admin
  urbackup:
    component: urbackup_server
    title: UrBackup Server
    # Admin port is intentionally bound to NAS loopback only.
    url: "http://127.0.0.1:55414/"
    access: "SSH-туннель к NAS (локальный порт 55414)"
    operator:
      username: admin
      password:
        source: host_file
        path: /etc/nas-apps/urbackup/admin-password

# OMV shared folders are reconciled against this description, not a Python list.
# Their physical identities and mount points are still verified using storage.yaml.
shares:
  - {name: shared, volume: shared, directory: shared}
  - {name: movies, volume: shared, directory: movies}
  - {name: music, volume: shared, directory: music}
  - {name: data, volume: data, directory: data}

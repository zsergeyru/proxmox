# SMB on the physical NAS: anonymous guest-only, full read/write on declared
# shared folders. This does NOT affect OMV/SSH/Authelia authentication.
# UrBackup backup directories are not shared by provision.yaml.
schema_version: 2
mode: guest_only
shares:
  shared: {access: read_write}
  movies: {access: read_write}
  music: {access: read_write}
  data: {access: read_write}

# Windows-compatible authenticated Samba access for users in infrastructure/users.yaml.
# Never store the password, an NT hash or encrypted password in Git.
# The credential is stored in protected persistent Infra Manager state on 910.
schema_version: 3
mode: named_users
credential:
  source: controller_file
  path: /var/lib/infra-manager/physical-hosts/nas-smb-password
shares:
  shared: {access: read_write}
  movies: {access: read_write}
  music: {access: read_write}
  data: {access: read_write}

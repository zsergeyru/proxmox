# Shared status contract, adapted to a physical host identity.
# Disk identity/UUID/GUID and ZFS safety are checked independently before
# any declared app checks; no backup success claims here.
schema_version: 2
host: nas
health:
  disk_usage_warning_percent: 95
checks:
  - type: systemd
    component: base
    unit_from: system.services.containers
    message: Docker работает
  - type: systemd
    component: smb
    unit_from: deployment.managed_units.smb.0
    message: Samba работает
  - type: systemd
    component: urbackup_server
    unit_from: deployment.managed_units.urbackup_server.1
    message: UrBackup Server запущен
  - type: systemd
    component: urbackup_client
    unit_from: deployment.managed_units.urbackup_client.1
    message: UrBackup Client запущен
  - type: docker
    component: urbackup_server
    container_from: backup.server.name
    message: "UrBackup Server: контейнер запущен"
  - type: docker
    component: urbackup_client
    container_from: backup.local_client.container
    message: "UrBackup Client: контейнер запущен"
  - type: docker
    component: apps
    container_from: services.qbittorrent.container
    message: "qBittorrent: контейнер запущен"
  - type: tcp
    component: apps
    port_from: services.qbittorrent.runtime.web_port
    message: "qBittorrent: веб-интерфейс доступен"
  - type: file
    component: urbackup_server
    path: /etc/nas-apps/urbackup/initialized
    message: Администратор UrBackup инициализирован

# Адрес и SSH-ключ можно подтвердить при первом deploy nas в терминале PVE.
# После проверки они сохраняются в persistent-state 910; Git менять не нужно.
# Машинное описание физического NAS. Отсутствующие идентификаторы не угадываются.
schema_version: 1
name: nas
kind: physical
system:
  distribution: debian
  version: "13"
connection:
  address: null
  port: 22
  user: root
  ssh_host_fingerprint: null

# Машинное описание физического NAS. Отсутствующие идентификаторы не угадываются.
schema_version: 1
name: nas
kind: physical
system:
  distribution: debian
  version: "13"
management:
  engine: ansible
  phases: [base, services]
  callback: infra_nas_compact
connection:
  address: 192.168.1.12
  port: 22
  user: root
  ssh_host_fingerprint: null

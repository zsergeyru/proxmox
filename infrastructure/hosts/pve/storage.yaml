# Диски и общие тома PVE: желаемое состояние, не разрешение очистки.
# ЦЕЛЬ: deploy 910 сверяет ВСЕ перечисленные общие LVM-тома, при необходимости
# безопасно создаёт отсутствующие, проверяет и восстанавливает подключения.
# deploy другого гостя проверяет только тома, на которые тот ссылается.
# Существующие тома/разделы не переформатировать и не очищать.
# Физический SSD готовить только по отдельно подтверждённому плану, повторный
# deploy его лишь проверяет. Серийный номер НЕ должен навсегда закреплять роль.
# На PVE ничего не устанавливать без крайней необходимости (см. AGENTS.md).
# ТЕКУЩИЙ КОД пока создаёт LVM-тома лишь при deploy гостя-потребителя;
# общая сверка при deploy 910 и подготовка физического SSD ещё не реализованы.
# Управление защищёнными pve-only/access/state для 910 остаётся у 990.
schema_version: 1
host: pve
devices:
  - id: nvme
    role: system
    model: SSD 512GB
    capacity_gb: 512
    serial: null
    by_id: null
  # SSD быстрых копий: 20.10.2026 наблюдался WD Green WDS240G2G0A,
  # серийный номер 19386J473508, 223,6 ГиБ (/dev/sda только на тот момент).
  # lsblk не показал разделов, wipefs -n — сигнатур; владелец разрешил
  # подготовку конкретно этого диска, но она ещё не выполнена.
  # ID реального диска проверять заново перед записью, не доверять /dev/sda.
  # Физический ext4/раздел и подключение пока НЕ объявлены в схеме v1;
  # само описание не разрешает автоматическое форматирование.
  - id: backup_ssd
    role: backup
    model: unconfirmed
    capacity_gb: 240
    serial: null
    by_id: null
volumes:
  - id: infra_state
    kind: lvm_thin
    device: nvme
    volume_group: pve
    thin_pool: data
    size_gb: 40
    filesystem: ext4
    filesystem_uuid: null
  - id: gogs_data
    kind: lvm_thin
    device: nvme
    volume_group: pve
    thin_pool: data
    size_gb: 30
    filesystem: ext4
    filesystem_uuid: null
  - id: photo_archive
    kind: lvm_thin
    device: nvme
    volume_group: pve
    thin_pool: data
    size_gb: 240
    filesystem: ext4
    filesystem_uuid: null
mounts:
  - volume: infra_state
    path: /mnt/bindmounts/infra-state
  - volume: gogs_data
    path: /mnt/bindmounts/gogs-data
  - volume: photo_archive
    path: /mnt/bindmounts/photo-archive
policies:
  existing_data: preserve
  unverified_devices: reject_writes
  missing_mount: reject_writes

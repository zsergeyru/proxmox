$schema: https://json-schema.org/draft/2020-12/schema
$title: Proxmox effective guest desired state
type: object
additionalProperties: false
required:
  - schema_version
  - vmid
  - name
  - profile
  - type
  - node
  - description
  - protection
  - pve_management
  - resources
  - network
  - boot
  - management
properties:
  schema_version:
    const: 11
  vmid:
    type: integer
    minimum: 100
    maximum: 999
  name:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  profile:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  type:
    enum: [vm, lxc]
  node:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  protection:
    type: boolean
  pve_management:
    type: boolean
  resources:
    type: object
    additionalProperties: false
    required: [cores, memory_mb, disk_size_gb, disk_storage]
    properties:
      cores:
        type: integer
        minimum: 1
      memory_mb:
        type: integer
        minimum: 256
      ballooning_mb:
        type: integer
        minimum: 0
      swap_mb:
        type: integer
        minimum: 0
      disk_size_gb:
        type: integer
        minimum: 1
      disk_storage:
        type: string
        minLength: 1
  network:
    type: object
    additionalProperties: false
    required: [bridge, subnet, gateway, ipv4]
    properties:
      bridge:
        type: string
        minLength: 1
      subnet:
        type: string
        minLength: 1
      gateway:
        type: string
        minLength: 1
      ipv4:
        oneOf:
          - const: dhcp
          - type: string
            pattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
  boot:
    type: object
    additionalProperties: false
    required: [onboot]
    properties:
      onboot:
        type: boolean
      order:
        type: integer
        minimum: 0
      startup_delay_seconds:
        type: integer
        minimum: 0
  management:
    type: array
    uniqueItems: true
    items:
      enum: [ssh_identity, project_repo_read]
  template_vmid:
    type: integer
    minimum: 100
    maximum: 9999
  ostemplate:
    type: string
    minLength: 1
  features:
    type: array
    uniqueItems: true
    items:
      enum: [container-host]
allOf:
  - if:
      properties:
        type:
          const: vm
    then:
      required: [template_vmid]
      properties:
        resources:
          not:
            required: [swap_mb]
      not:
        anyOf:
          - required: [ostemplate]
          - required: [features]
  - if:
      properties:
        type:
          const: lxc
    then:
      required: [ostemplate, features]
      properties:
        resources:
          required: [swap_mb]
          not:
            required: [ballooning_mb]
      not:
        required: [template_vmid]

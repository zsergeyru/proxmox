$schema: https://json-schema.org/draft/2020-12/schema
title: Права сетевых папок NAS
type: object
additionalProperties: false
required: [schema_version, shares]
properties:
  schema_version:
    const: 1
  shares:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 16
    patternProperties:
      '^[a-z][a-z0-9-]{0,30}
$defs:
  permissions:
    type: object
    additionalProperties: false
    required: [read_groups, write_groups]
    properties:
      read_groups:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
      write_groups:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
:
        $ref: '#/$defs/permissions'
$defs:
  permissions:
    type: object
    additionalProperties: false
    required: [read_groups, write_groups]
    properties:
      read_groups:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
      write_groups:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'

$schema: https://json-schema.org/draft/2020-12/schema
title: Authenticated Samba shares on the physical NAS
type: object
additionalProperties: false
required: [schema_version, mode, credential, shares]
properties:
  schema_version: {const: 3}
  mode: {const: named_users}
  credential:
    type: object
    additionalProperties: false
    required: [source, path]
    properties:
      source: {const: controller_file}
      path: {const: /var/lib/infra-manager/physical-hosts/nas-smb-password}
  shares:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 16
    patternProperties:
      '^[a-z][a-z0-9-]{0,30}$':
        $ref: '#/$defs/permissions'
$defs:
  permissions:
    type: object
    additionalProperties: false
    required: [access]
    properties:
      access: {const: read_write}

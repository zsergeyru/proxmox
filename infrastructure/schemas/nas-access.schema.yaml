$schema: https://json-schema.org/draft/2020-12/schema
title: Guest-only network share access on the physical NAS
type: object
additionalProperties: false
required: [schema_version, mode, shares]
properties:
  schema_version: {const: 2}
  mode: {const: guest_only}
  shares:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 16
    patternProperties:
      '^[a-z][a-z0-9-]{0,30}$':
        $ref: '#/$defs/permissions'
$defs:
  permissions:
    type: object
    additionalProperties: false
    required: [access]
    properties:
      access: {const: read_write}

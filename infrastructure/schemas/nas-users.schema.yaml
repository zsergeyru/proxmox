$schema: https://json-schema.org/draft/2020-12/schema
title: Пользователи и группы SMB физического NAS
type: object
additionalProperties: false
required: [schema_version, groups, users, shares]
properties:
  schema_version:
    const: 1
  groups:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z][a-z0-9_-]{1,31}$'
  users:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, groups]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
        groups:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            pattern: '^[a-z][a-z0-9_-]{1,31}$'
  shares:
    type: object
    additionalProperties: false
    required: [shared, movies, music, data]
    properties:
      shared:
        $ref: '#/$defs/permissions'
      movies:
        $ref: '#/$defs/permissions'
      music:
        $ref: '#/$defs/permissions'
      data:
        $ref: '#/$defs/permissions'
$defs:
  permissions:
    type: object
    additionalProperties: false
    required: [read_groups, write_groups]
    properties:
      read_groups:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
      write_groups:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'

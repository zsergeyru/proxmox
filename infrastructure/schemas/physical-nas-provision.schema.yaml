$schema: https://json-schema.org/draft/2020-12/schema
$title: Declarative physical NAS provisioning
type: object
additionalProperties: false
required: [schema_version, host, system, deployment, services, shares]
properties:
  schema_version: {const: 1}
  host: {const: nas}
  system:
    type: object
    additionalProperties: false
    required: [distribution, version, application, application_version, packages, services]
    properties:
      distribution: {const: debian}
      version: {const: "13"}
      application: {const: openmediavault}
      application_version: {const: "8"}
      packages:
        type: object
        additionalProperties: false
        required: [diagnostics, omv_prerequisites, omv_extensions, docker]
        properties:
          diagnostics: {$ref: '#/$defs/nas_diagnostics'}
          omv_prerequisites: {$ref: '#/$defs/nas_prerequisites'}
          omv_extensions: {$ref: '#/$defs/nas_extensions'}
          docker: {$ref: '#/$defs/nas_docker_packages'}
      services:
        type: object
        additionalProperties: false
        required: [smart, containers]
        properties:
          smart: {const: smartmontools.service}
          containers: {const: docker.service}
  deployment:
    type: object
    additionalProperties: false
    required: [phases, components, dependencies]
    properties:
      phases:
        const: [base, services]
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [urbackup_server, urbackup_client, apps, smb]
      dependencies:
        type: object
        additionalProperties: false
        properties:
          urbackup_server: {$ref: '#/$defs/dependency_list'}
          urbackup_client: {$ref: '#/$defs/dependency_list'}
          apps: {$ref: '#/$defs/dependency_list'}
          smb: {$ref: '#/$defs/dependency_list'}
        required: [urbackup_client]
  services:
    type: object
    minProperties: 1
    additionalProperties:
      $ref: '#/$defs/service'
    required: [openmediavault]
    properties:
      openmediavault:
        allOf:
          - $ref: '#/$defs/service'
          - type: object
            required: [address]
            properties:
              component: {const: base}
              address: {const: auto_omv}
      qbittorrent:
        allOf:
          - $ref: '#/$defs/service'
          - type: object
            required: [url, image, container, runtime]
            properties:
              component: {const: apps}
              runtime: {$ref: '#/$defs/qbittorrent_runtime'}
              url: {const: 'http://{address}:{web_port}/'}
              container: {const: nas-qbittorrent}
      urbackup:
        allOf:
          - $ref: '#/$defs/service'
          - type: object
            required: [url]
            properties:
              component: {const: urbackup_server}
              url: {const: 'http://{web_bind}:{web_port}/'}
  shares:
    type: array
    minItems: 1
    maxItems: 16
    items:
      type: object
      additionalProperties: false
      required: [name, volume, directory]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
        volume: {enum: [shared, data]}
        directory: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
$defs:
  nas_diagnostics:
    type: array
    minItems: 10
    maxItems: 10
    uniqueItems: true
    items: {enum: [smartmontools, acl, gdisk, e2fsprogs, util-linux, udev, jq, ca-certificates, curl, python3]}
  nas_prerequisites:
    type: array
    minItems: 3
    maxItems: 3
    uniqueItems: true
    items: {enum: [python3-debian, xz-utils, gnupg]}
  nas_extensions:
    type: array
    minItems: 2
    maxItems: 2
    uniqueItems: true
    items: {enum: [openmediavault-zfs, openmediavault-compose]}
  nas_docker_packages:
    type: array
    minItems: 4
    maxItems: 4
    uniqueItems: true
    items: {enum: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]}
  qbittorrent_runtime:
    type: object
    additionalProperties: false
    required: [timezone, web_port, torrent_port, downloads_directory, directories]
    properties:
      timezone: {type: string, pattern: '^[A-Za-z0-9_+/-]{1,60}$'}
      web_port: {const: 8080}
      torrent_port: {type: integer, minimum: 1024, maximum: 65535}
      downloads_directory: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
      directories:
        type: array
        minItems: 1
        maxItems: 12
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}(/[a-z][a-z0-9-]{0,30})?$'}
  dependency_list:
    type: array
    uniqueItems: true
    maxItems: 3
    items: {enum: [urbackup_server, urbackup_client, apps, smb]}
  operator:
    type: object
    additionalProperties: false
    required: [username]
    properties:
      username: {type: string, pattern: '^[a-zA-Z0-9@._-]{1,90}$'}
      password:
        type: object
        additionalProperties: false
        required: [source, path]
        properties:
          source: {const: host_file}
          path: {const: /etc/nas-apps/urbackup/admin-password}
  service:
    type: object
    additionalProperties: false
    required: [title, component, operator]
    properties:
      title: {type: string, minLength: 1, maxLength: 100}
      component: {enum: [base, urbackup_server, urbackup_client, apps, smb]}
      image: {type: string, pattern: '^lscr[.]io/linuxserver/qbittorrent:[a-zA-Z0-9_.-]+$'}
      container: {const: nas-qbittorrent}
      runtime: {$ref: '#/$defs/qbittorrent_runtime'}
      address: {const: auto_omv}
      url:
        type: string
        pattern: '^https?://(\{address\}|\{web_bind\}|127[.]0[.]0[.]1):(\{web_port\}|[0-9]{2,5})/$'
      access: {type: string, minLength: 1, maxLength: 200}
      operator: {$ref: '#/$defs/operator'}
    oneOf:
      - required: [address]
      - required: [url]

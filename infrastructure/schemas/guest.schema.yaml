$schema: https://json-schema.org/draft/2020-12/schema
$title: Proxmox guest source manifest
type: object
additionalProperties: false
required: [schema_version, vmid, name, description]
properties:
  schema_version:
    const: 10
  vmid:
    type: integer
    minimum: 100
    maximum: 999
  name:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  profile:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  node:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  protection:
    type: boolean
  pve_management:
    type: boolean
  resources:
    $ref: '#/$defs/resources'
  network:
    $ref: '#/$defs/sourceNetwork'
  boot:
    $ref: '#/$defs/boot'
  management:
    $ref: '#/$defs/management'
  bootstrap:
    $ref: '#/$defs/bootstrap'
$defs:
  resources:
    type: object
    additionalProperties: false
    properties:
      cores:
        type: integer
        minimum: 1
      memory_mb:
        type: integer
        minimum: 256
      ballooning_mb:
        type: integer
        minimum: 0
      swap_mb:
        type: integer
        minimum: 0
      disk_size_gb:
        type: integer
        minimum: 1
      disk_storage:
        type: string
        minLength: 1
  sourceNetwork:
    type: object
    additionalProperties: false
    required: [ipv4]
    properties:
      ipv4:
        oneOf:
          - const: dhcp
          - type: string
            pattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}
  boot:
    type: object
    additionalProperties: false
    required: [onboot]
    properties:
      onboot:
        type: boolean
  management:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum: [ssh_identity, project_repo_read]
  bootstrap:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum: [git, docker, ansible]
allOf:
  - if:
      required: [profile]
    then:
      required: [resources]
      properties:
        resources:
          required: [cores, memory_mb, disk_size_gb]
  - if:
      required: [bootstrap]
    then:
      required: [profile]
  - if:
      required: [management]
    then:
      required: [profile]
  - if:
      required: [pve_management]
    then:
      required: [profile]

  boot:
    type: object
    additionalProperties: false
    required: [onboot]
    properties:
      onboot:
        type: boolean
  management:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum: [ssh_identity, project_repo_read]
  bootstrap:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum: [git, docker, ansible]
allOf:
  - if:
      required: [profile]
    then:
      required: [resources]
      properties:
        resources:
          required: [cores, memory_mb, disk_size_gb]
  - if:
      required: [bootstrap]
    then:
      required: [profile]
  - if:
      required: [management]
    then:
      required: [profile]
  - if:
      required: [pve_management]
    then:
      required: [profile]

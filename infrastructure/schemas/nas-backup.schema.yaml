$schema: https://json-schema.org/draft/2020-12/schema
title: Physical NAS backup policy
type: object
additionalProperties: false
required: [schema_version, host, engine, server, local_client, retention]
properties:
  schema_version: {const: 1}
  host: {const: nas}
  engine: {const: urbackup}
  server:
    type: object
    additionalProperties: false
    required: [image, name, admin_user, timezone, web_bind, web_port, data_subdir, recovery_subdir]
    properties:
      image: {type: string, pattern: '^uroni/urbackup-server:[A-Za-z0-9._-]+(@sha256:[0-9a-f]{64})?$'}
      name: {const: nas-urbackup}
      admin_user: {const: admin}
      timezone: {type: string, minLength: 1, maxLength: 64}
      web_bind: {const: "127.0.0.1"}
      web_port: {const: 55414}
      data_subdir: {const: urbackup/backups}
      recovery_subdir: {const: urbackup/recovery}
  local_client:
    type: object
    additionalProperties: false
    required: [enabled, image, name, container, source_volume, target_volume, schedule, exclude_volumes]
    properties:
      enabled: {const: true}
      image: {const: 'uroni/urbackup-client:2.5.31'}
      name: {const: nas-local}
      container: {const: nas-urbackup-client}
      source_volume: {const: data}
      target_volume: {const: backup}
      schedule: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
      exclude_volumes:
        type: array
        const: [shared, backup]
  retention:
    type: object
    additionalProperties: false
    required: [keep_daily, keep_weekly, max_parallel_jobs, server_state_schedule]
    properties:
      keep_daily: {type: integer, minimum: 7, maximum: 365}
      keep_weekly: {type: integer, minimum: 4, maximum: 104}
      max_parallel_jobs: {const: 1}
      server_state_schedule: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}

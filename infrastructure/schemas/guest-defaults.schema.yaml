$schema: https://json-schema.org/draft/2020-12/schema
$title: Proxmox guest defaults and profiles
type: object
additionalProperties: false
required: [schema_version, defaults, profiles]
properties:
  schema_version:
    const: 11
  defaults:
    $ref: '#/$defs/defaults'
  profiles:
    type: object
    minProperties: 1
    propertyNames:
      pattern: '^[a-z0-9][a-z0-9-]*$'
    additionalProperties:
      $ref: '#/$defs/profile'
$defs:
  defaults:
    type: object
    additionalProperties: false
    required: [node, protection, pve_management, resources, network, boot]
    properties:
      node:
        type: string
        minLength: 1
      protection:
        type: boolean
      pve_management:
        type: boolean
      resources:
        type: object
        additionalProperties: false
        required: [disk_storage]
        properties:
          disk_storage:
            type: string
            minLength: 1
      network:
        type: object
        additionalProperties: false
        required: [bridge, subnet, gateway]
        properties:
          bridge:
            type: string
            minLength: 1
          subnet:
            type: string
            minLength: 1
          gateway:
            type: string
            minLength: 1
      boot:
        type: object
        additionalProperties: false
        required: [onboot]
        properties:
          onboot:
            type: boolean
  profile:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        enum: [vm, lxc]
      template_vmid:
        type: integer
        minimum: 100
        maximum: 9999
      ostemplate:
        type: string
        minLength: 1
      features:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [container-host]
    allOf:
      - if:
          properties:
            type:
              const: vm
        then:
          required: [template_vmid]
          not:
            anyOf:
              - required: [ostemplate]
              - required: [features]
      - if:
          properties:
            type:
              const: lxc
        then:
          required: [ostemplate]
          not:
            required: [template_vmid]

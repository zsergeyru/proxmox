$schema: https://json-schema.org/draft/2020-12/schema
$title: Описание физического сервера
type: object
additionalProperties: false
required: [schema_version, name, kind, system, management, connection]
properties:
  schema_version:
    const: 1
  name:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
  kind:
    const: physical
  system:
    type: object
    additionalProperties: false
    required: [distribution, version]
    properties:
      distribution:
        const: debian
      version:
        const: '13'
  management:
    type: object
    additionalProperties: false
    required: [driver]
    properties:
      driver:
        type: string
        pattern: '^[a-z][a-z0-9-]*    type: object
    additionalProperties: false
    required: [address, port, user, ssh_host_fingerprint]
    properties:
      address:
        oneOf:
          - type: 'null'
          - type: string
            minLength: 1
            maxLength: 253
            pattern: '^[A-Za-z0-9.:-]+$'
      port:
        type: integer
        minimum: 1
        maximum: 65535
      user:
        const: root
      ssh_host_fingerprint:
        oneOf:
          - type: 'null'
          - type: string
            pattern: '^SHA256:[A-Za-z0-9+/]{43}$'

  connection:
    type: object
    additionalProperties: false
    required: [address, port, user, ssh_host_fingerprint]
    properties:
      address:
        oneOf:
          - type: 'null'
          - type: string
            minLength: 1
            maxLength: 253
            pattern: '^[A-Za-z0-9.:-]+$'
      port:
        type: integer
        minimum: 1
        maximum: 65535
      user:
        const: root
      ssh_host_fingerprint:
        oneOf:
          - type: 'null'
          - type: string
            pattern: '^SHA256:[A-Za-z0-9+/]{43}$'

$schema: https://json-schema.org/draft/2020-12/schema
$title: Physical host description
type: object
additionalProperties: false
required: [schema_version, name, kind, system, connection, storage]
properties:
  schema_version:
    const: 1
  name:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
  kind:
    const: physical
  system:
    type: object
    additionalProperties: false
    required: [distribution, version]
    properties:
      distribution:
        const: debian
      version:
        const: '13'
  connection:
    type: object
    additionalProperties: false
    required: [address, port, user, ssh_host_fingerprint]
    properties:
      address:
        oneOf:
          - type: 'null'
          - type: string
            minLength: 1
            maxLength: 253
            pattern: '^[A-Za-z0-9.:-]+$'
      port:
        type: integer
        minimum: 1
        maximum: 65535
      user:
        const: root
      ssh_host_fingerprint:
        oneOf:
          - type: 'null'
          - type: string
            pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
  storage:
    type: object
    additionalProperties: false
    required: [devices]
    properties:
      devices:
        type: array
        minItems: 1
        maxItems: 16
        items:
          type: object
          additionalProperties: false
          required: [role, model, capacity_gb, serial]
          properties:
            role:
              enum: [system, shared, data, backup, unused]
            model:
              type: string
              minLength: 1
              maxLength: 100
            capacity_gb:
              type: integer
              minimum: 1
            serial:
              oneOf:
                - type: 'null'
                - type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9_-]+$'

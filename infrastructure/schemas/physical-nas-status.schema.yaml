{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$title": "Physical NAS service checks",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "host",
    "checks",
    "health"
  ],
  "properties": {
    "schema_version": {
      "const": 2
    },
    "host": {
      "const": "nas"
    },
    "checks": {
      "type": "array",
      "minItems": 1,
      "items": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "type",
              "message",
              "component"
            ],
            "properties": {
              "type": {
                "const": "systemd"
              },
              "message": {
                "type": "string",
                "minLength": 1,
                "maxLength": 150
              },
              "component": {
                "enum": [
                  "base",
                  "urbackup_server",
                  "urbackup_client",
                  "apps",
                  "smb"
                ]
              },
              "unit": {
                "type": "string",
                "pattern": "^[a-zA-Z0-9_.@-]+[.](service|timer)$"
              },
              "unit_from": {
                "const": "system.services.containers"
              }
            },
            "allOf": [
              {
                "oneOf": [
                  {
                    "required": [
                      "unit"
                    ]
                  },
                  {
                    "required": [
                      "unit_from"
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "type",
              "message",
              "component"
            ],
            "properties": {
              "type": {
                "const": "docker"
              },
              "message": {
                "type": "string",
                "minLength": 1,
                "maxLength": 150
              },
              "component": {
                "enum": [
                  "base",
                  "urbackup_server",
                  "urbackup_client",
                  "apps",
                  "smb"
                ]
              },
              "container": {
                "type": "string",
                "pattern": "^[a-zA-Z0-9][a-zA-Z0-9_.-]+$"
              },
              "container_from": {
                "enum": [
                  "services.qbittorrent.container",
                  "backup.server.name",
                  "backup.local_client.container"
                ]
              }
            },
            "allOf": [
              {
                "oneOf": [
                  {
                    "required": [
                      "container"
                    ]
                  },
                  {
                    "required": [
                      "container_from"
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "type",
              "message",
              "component"
            ],
            "properties": {
              "type": {
                "const": "tcp"
              },
              "message": {
                "type": "string",
                "minLength": 1,
                "maxLength": 150
              },
              "component": {
                "enum": [
                  "base",
                  "urbackup_server",
                  "urbackup_client",
                  "apps",
                  "smb"
                ]
              },
              "port": {
                "type": "integer",
                "minimum": 1,
                "maximum": 65535
              },
              "port_from": {
                "const": "services.qbittorrent.runtime.web_port"
              }
            },
            "allOf": [
              {
                "oneOf": [
                  {
                    "required": [
                      "port"
                    ]
                  },
                  {
                    "required": [
                      "port_from"
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "type",
              "message",
              "component",
              "path"
            ],
            "properties": {
              "type": {
                "const": "file"
              },
              "message": {
                "type": "string",
                "minLength": 1,
                "maxLength": 150
              },
              "component": {
                "enum": [
                  "base",
                  "urbackup_server",
                  "urbackup_client",
                  "apps",
                  "smb"
                ]
              },
              "path": {
                "const": "/etc/nas-apps/urbackup/initialized"
              }
            }
          }
        ]
      }
    },
    "health": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "disk_usage_warning_percent"
      ],
      "properties": {
        "disk_usage_warning_percent": {
          "type": "integer",
          "minimum": 50,
          "maximum": 99
        }
      }
    }
  }
}

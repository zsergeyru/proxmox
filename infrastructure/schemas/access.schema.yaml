$schema: https://json-schema.org/draft/2020-12/schema
$title: Project access contract
type: object
additionalProperties: false
required: [schema_version, rules]
properties:
  schema_version:
    const: 1
  rules:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/rule'
$defs:
  rule:
    type: object
    additionalProperties: false
    required: [id, subject, service, resource, targets, access]
    properties:
      id:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
      subject:
        type: string
        pattern: '^(guest:[1-9][0-9]{2}|host:pve|service:[a-z0-9][a-z0-9-]*)$'
      service:
        enum: [pve-api, ssh, github, semaphore, pve-operator, openbao]
      resource:
        enum:
          - guests
          - storage
          - host
          - guest
          - identity
          - repository
          - infrastructure-task
          - credential
          - ssh-ca
          - instance
      targets:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:/-]+$'
      access:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum:
            - read
            - create
            - clone
            - configure
            - power
            - delete
            - connect-root
            - issue
            - execute
            - materialize
            - update
            - sign
            - unseal

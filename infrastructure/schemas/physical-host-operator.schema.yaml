$schema: https://json-schema.org/draft/2020-12/schema
title: Physical host operator credential and status declarations
type: object
additionalProperties: false
required: [schema_version, host, credentials]
properties:
  schema_version: {const: 1}
  host: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
  credentials:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
      additionalProperties: false
      required: [id, prompt, min_length, max_length, status]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
        prompt: {type: string, minLength: 4, maxLength: 150}
        min_length: {type: integer, minimum: 4, maximum: 128}
        max_length: {type: integer, minimum: 4, maximum: 128}
        status:
          type: object
          additionalProperties: false
          required: [title, accounts_source, shares_source, share_url, permissions]
          properties:
            title: {type: string, minLength: 1, maxLength: 100}
            accounts_source: {const: global_users}
            shares_source: {const: provision}
            share_url: {type: string, minLength: 8, maxLength: 200}
            permissions: {type: string, minLength: 1, maxLength: 120}

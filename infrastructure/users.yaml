# Общий первоначальный список людей и групп проекта Proxmox.
# При повторном развёртывании изменения учётных записей приложений не сбрасываются.
# В публичном Git запрещено хранить пароли, хеши, коды и иные секреты.
schema_version: 1

# Имена групп согласованы с действующей Authelia (гость веб-шлюза).
groups:
  - admins
  - family
  - guests

# Логины в нижнем регистре; это начальные назначения ролей.
# Служебного администратора Authelia «admin» создаёт сам гость.
# Живые учётные записи приложений не сбрасываются по этому перечню.
users:
  - name: sergey
    groups: [admins]
  - name: sveta
    groups: [family]
  - name: danya
    groups: [family]

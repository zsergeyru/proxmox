# Общий первоначальный список людей и групп проекта Proxmox.
# При повторном развёртывании изменения учётных записей приложений не сбрасываются.
# В публичном Git запрещено хранить пароли, хеши, коды и иные секреты.
schema_version: 1

# Имена групп согласованы с действующей Authelia (гость веб-шлюза).
groups:
  - admins
  - family
  - guests

# Заполняется после согласования имён; начального администратора
# Authelia «admin» создаёт сам гость, это служебная запись.
# Пример (неактивен):
# users:
#   - name: exampleuser
#     groups: [family]
users: []

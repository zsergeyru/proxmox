schema_version: 1
guest_vmid: 310

system:
  distribution: debian
  version: "13"
  architecture: amd64
  required_packages:
    - ca-certificates
    - python3
    - sqlite3

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running
  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

# Постоянные репозитории не находятся на корневом диске LXC.
# Общее хранилище infra_state и каталоги 910 здесь не используются.
# Размер тома gogs_data указан только в hosts/pve/storage.yaml.
pve_storage:
  mounts:
    - slot: mp0
      volume: gogs_data
      directory: 310-gogs
      target: /var/lib/gogs
      read_only: false

gogs:
  # Исходный образ Docker Desktop (Windows, amd64, сборка 2026-05-19).
  # Не заменять на другую сборку edge без проверки копии SQLite и Git.
  image: "docker.io/gogs/gogs@sha256:593818f84e4f6233560706173fd5cdf8ba903065b9619c91bcbb796c3dc73e41"
  source_version: "0.15.0+dev"
  container_name: gogs
  paths:
    root: /opt/gogs
    compose: /opt/gogs/compose
    compose_file: /opt/gogs/compose/docker-compose.yml
    data: /var/lib/gogs
    config: /var/lib/gogs/gogs/conf/app.ini
    database: /var/lib/gogs/gogs/data/gogs.db
    repositories: /var/lib/gogs/git/gogs-repositories
    prepared_marker: /var/lib/gogs/.gogs-imported
  network:
    public_url: https://git.zsergey.ru/
    domain: git.zsergey.ru
    http_port: 3000
    ssh_port: 2222
    # В исходном Docker-образе используется OpenSSH в контейнере на 22,
    # в домашней сети остаётся прежний внешний порт 2222.
    ssh_container_port: 22
    ssh_public: false
  storage:
    required_mount: /var/lib/gogs
    allow_missing_mount: false
    require_import_before_start: true
  access:
    type: gogs
    require_signin: true
    allow_registration: false
    allow_reverse_proxy_authentication: false

# Для универсального резервирования постоянного тома: перед LVM snapshot
# остановить всех работающих LXC-потребителей и сразу возобновить их.
persistence:
  backup_consistency: offline_lxc
  backup_required:
    - /var/lib/gogs
  reproducible:
    - /opt/gogs
  ephemeral:
    - docker-images
    - docker-build-cache

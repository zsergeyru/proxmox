schema_version: 1
guest_vmid: 410

system:
  distribution: debian
  version: "13"
  architecture: amd64

  required_packages:
    - ca-certificates
    - curl
    - git
    - jq
    - openssh-client
    - python3

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running

  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

ai_control:
  agent:
    primary: hermes
    replaceable: true
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: hermes
    command: gateway run
    shm_size: 1g
    uid: 10000
    gid: 10000

    api:
      enabled: true
      host: 127.0.0.1
      port: 8642
      model_name: hermes-agent

    dashboard:
      enabled: false
      port: 9119

  web:
    required: true
    provider: open-webui
    image: ghcr.io/open-webui/open-webui:0.11.4-slim
    container_name: open-webui
    port: 4100
    admin_email: admin@ai-control.local

  paths:
    root: /opt/ai-control
    compose: /opt/ai-control/compose
    compose_file: /opt/ai-control/compose/docker-compose.yml
    state: /opt/ai-control/state
    hermes_data: /opt/ai-control/state/hermes
    open_webui_data: /opt/ai-control/state/open-webui
    configuration: /etc/ai-control
    hermes_env: /etc/ai-control/hermes.env
    open_webui_env: /etc/ai-control/open-webui.env

integrations:
  infrastructure_executor:
    role: infra-manager
    service: semaphore
    purpose: Повторяемое выполнение OpenTofu, Ansible и других инфраструктурных задач
    local_opentofu_required: false
    local_ansible_controller_required: false
    local_packer_required: false

boundaries:
  application_services_allowed: false
  speech_services_allowed: false
  general_file_storage_allowed: false
  member_of_managed_pool: false
  may_manage_itself_in_proxmox: false

persistence:
  backup_required:
    - /opt/ai-control/state
    - /etc/ai-control/hermes.env
    - /etc/ai-control/open-webui.env

  reproducible:
    - /opt/ai-control/compose

  ephemeral:
    - docker-images
    - docker-build-cache

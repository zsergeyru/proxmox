schema_version: 1
guest_vmid: 410

portal:
  local:
    enabled: true
    title: Управление ИИ

system:
  distribution: debian
  version: "13"
  architecture: amd64

  required_packages:
    - ca-certificates
    - curl
    - git
    - jq
    - openssh-client
    - python3
    - python3-yaml

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running

  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

ai_control:
  agent:
    primary: hermes
    replaceable: true
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: hermes
    command: gateway run
    shm_size: 1g
    uid: 10000
    gid: 10000

    initial_config:
      model:
        default: openrouter/free
        provider: openrouter
        base_url: https://openrouter.ai/api/v1
        api_mode: chat_completions
      providers:
        local:
          enabled: false
          name: Local model
          base_url: ""
          default_model: ""
          api_key: local
          transport: chat_completions

    api:
      enabled: true
      host: 127.0.0.1
      port: 8642
      model_name: hermes-agent
      model_routes:
        openrouter-free:
          model: openrouter/free
          provider: openrouter
        openai-gpt-5.4-mini:
          model: gpt-5.4-mini
          provider: openai-api
        claude-opus-4.6:
          model: anthropic/claude-opus-4.6
          provider: openrouter
        claude-sonnet-4.6:
          model: anthropic/claude-sonnet-4.6
          provider: openrouter

    dashboard:
      enabled: true
      host: 0.0.0.0
      port: 9119
      username: admin
      portal:
        name: Hermes Dashboard
        description: Настройки агента, моделей и инструментов
        icon: mdi-tune-#38bdf8
        scheme: http
        port: 9119
        targets:
          - local
          - home
        operator:
          username: admin
          password:
            source: guest_env
            path: /etc/ai-control/hermes.env
            key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD

  web:
    required: true
    provider: open-webui
    image: ghcr.io/open-webui/open-webui:0.11.4-slim
    container_name: open-webui
    port: 4100
    admin_email: admin@ai-control.local
    portal:
      name: Open WebUI
      description: Веб-интерфейс ИИ
      icon: mdi-robot-#38bdf8
      scheme: http
      port: 4100
      targets:
        - local
        - home
      operator:
        username: admin@ai-control.local
        password:
          source: guest_env
          path: /etc/ai-control/open-webui.env
          key: WEBUI_ADMIN_PASSWORD

  paths:
    root: /opt/ai-control
    compose: /opt/ai-control/compose
    compose_file: /opt/ai-control/compose/docker-compose.yml
    state: /opt/ai-control/state
    hermes_data: /opt/ai-control/state/hermes
    open_webui_data: /opt/ai-control/state/open-webui
    configuration: /etc/ai-control
    hermes_env: /etc/ai-control/hermes.env
    open_webui_env: /etc/ai-control/open-webui.env

integrations:
  infrastructure_executor:
    role: infra-manager
    service: semaphore
    purpose: Повторяемое выполнение OpenTofu, Ansible и других инфраструктурных задач
    local_opentofu_required: false
    local_ansible_controller_required: false
    local_packer_required: false

boundaries:
  application_services_allowed: false
  speech_services_allowed: false
  general_file_storage_allowed: false
  member_of_managed_pool: false
  may_manage_itself_in_proxmox: false

persistence:
  backup_required:
    - /opt/ai-control/state
    - /etc/ai-control/hermes.env
    - /etc/ai-control/open-webui.env

  reproducible:
    - /opt/ai-control/compose

  ephemeral:
    - docker-images
    - docker-build-cache

schema_version: 1
guest_vmid: 410

system:
  distribution: debian
  version: "13"
  architecture: amd64

  required_packages:
    - ca-certificates
    - curl
    - git
    - jq
    - openssh-client
    - python3
    - python3-venv

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running

  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

ai_control:
  user: ai-control
  group: ai-control

  agent:
    primary: hermes
    replaceable: true

  api:
    listen: 127.0.0.1
    port: 4110
    openai_model_id: hermes-agent

  web:
    required: true
    provider: open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.4-slim
    port: 4100
    admin_email: admin@ai-control.local
    compose_file: /opt/ai-control/compose/open-webui.yml

  service:
    name: ai-control
    unit: ai-control.service
    executable: /opt/ai-control/core/bin/ai-control

  paths:
    root: /opt/ai-control
    core: /opt/ai-control/core
    core_bin: /opt/ai-control/core/bin
    compose: /opt/ai-control/compose
    agents: /opt/ai-control/agents
    primary_agent: /opt/ai-control/agents/hermes
    repositories: /opt/ai-control/repos
    project_repository: /opt/ai-control/repos/proxmox
    instructions: /opt/ai-control/instructions
    tools: /opt/ai-control/tools
    state: /opt/ai-control/state
    open_webui_data: /opt/ai-control/state/open-webui
    configuration: /etc/ai-control
    runtime: /run/ai-control
    cache: /var/cache/ai-control
    models_config: /etc/ai-control/models.json
    tools_config: /etc/ai-control/tools.json
    api_credentials: /etc/ai-control/api.env
    open_webui_credentials: /etc/ai-control/open-webui.env

  state_directories:
    - memory
    - conversations
    - tasks
    - events
    - observations
    - agents/hermes
    - open-webui

integrations:
  infrastructure_executor:
    role: infra-manager
    service: semaphore
    purpose: Повторяемое выполнение OpenTofu, Ansible и других инфраструктурных задач
    local_opentofu_required: false
    local_ansible_controller_required: false
    local_packer_required: false

boundaries:
  application_services_allowed: false
  speech_services_allowed: false
  general_file_storage_allowed: false
  member_of_managed_pool: false
  may_manage_itself_in_proxmox: false

persistence:
  backup_required:
    - /opt/ai-control/state
    - /etc/ai-control/api.env
    - /etc/ai-control/open-webui.env

  reproducible:
    - /opt/ai-control/core
    - /opt/ai-control/agents
    - /opt/ai-control/compose
    - /opt/ai-control/repos/proxmox
    - /opt/ai-control/instructions
    - /opt/ai-control/tools
    - /etc/ai-control/ai-control.env
    - /etc/ai-control/models.json
    - /etc/ai-control/tools.json
    - /etc/systemd/system/ai-control.service

  ephemeral:
    - /run/ai-control
    - /var/cache/ai-control

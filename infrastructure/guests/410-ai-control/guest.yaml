schema_version: 12
vmid: 410
name: ai-control
role: ai-control
profile: debian-vm

description: Центральный интеллектуальный управляющий контур квартиры

# AI Control не должен входить в собственную область управления managed.
pve_management: false
# При отсутствии VM и принадлежащих ей дисков разрешить создание заново.
# Содержимое старой VM эта операция не восстанавливает.
recreate_if_missing: true

resources:
  cores: 2
  memory_mb: 4096
  disk_size_gb: 24

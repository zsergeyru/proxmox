schema_version: 1
guest_vmid: 140

# Домашние страницы отдаются Caddy; вход и двухфакторная проверка выполняются Authelia.
system:
  distribution: debian
  version: "13"
  architecture: amd64
  required_packages:
    - ca-certificates
    - curl
    - openssl
    - python3
    - python3-yaml
    - python3-argon2
    - python3-passlib
    - python3-jinja2
    - python3-cryptography

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running
  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

# Общий том состояний уже используется гостем 340.
# Не форматировать существующий том и не затрагивать чужие каталоги.
# Подготовка производится штатным механизмом pve_storage на PVE.
pve_storage:
  volume_group: pve
  thin_pool: data
  volumes:
    - name: infra_state
      size_gb: 40
      mountpoint: /mnt/bindmounts/infra-state
  mounts:
    - slot: mp0
      volume: infra_state
      directory: 140-web-gateway
      target: /var/lib/web-gateway
      read_only: false

# Целевые параметры новой роли Ansible web_gateway.
# Само описание не устанавливает программы, пока роль не подключена.
web_gateway:
  domain: zsergey.ru

  paths:
    root: /opt/web-gateway
    compose: /opt/web-gateway/compose
    compose_file: /opt/web-gateway/compose/docker-compose.yml
    configuration: /etc/web-gateway
    secrets: /var/lib/web-gateway/secrets
    persistent_state: /var/lib/web-gateway

  storage:
    required_mount: /var/lib/web-gateway
    pve_source: /mnt/bindmounts/infra-state/140-web-gateway
    allow_missing_mount: false
    # Приложения нельзя запускать с пустым каталогом вместо mp0.
    require_mount_before_services: true

  caddy:
    enabled: true
    image: caddy:2.11.7
    container_name: web-gateway-caddy
    config_file: /etc/web-gateway/caddy/Caddyfile
    generated_routes_file: /etc/web-gateway/caddy/sites.generated.caddy
    data:
      host: /var/lib/web-gateway/caddy/data
      container: /data
    config:
      host: /var/lib/web-gateway/caddy/config
      container: /config
    listen:
      http: 80
      https: 443
      # Локальный HTTP без сертификата, доступный только из домашней сети.
      local_http: 8080
    # Только эти имена допускают публичный доступ без предварительного входа.
    public_domains:
      - home.zsergey.ru
      - auth.zsergey.ru
    # Для внутренних маршрутов проверяется адрес соединения, не HTTP-заголовки.
    private_networks:
      - 192.168.0.0/16
    routes:
      - domain: home.zsergey.ru
        service: portal
        upstream: http://caddy:8080
        access: public
        enabled: true
      - domain: auth.zsergey.ru
        service: authelia
        upstream: http://authelia:9091
        access: public
        enabled: true
      # Пробный адрес для проверки изменений через Caddy. Доступ только
      # из домашней сети; приложение за ним дополнительно требует входа.
      - domain: check.zsergey.ru
        service: portal
        upstream: http://caddy:8080
        access: private
        enabled: false
      # Gogs сам проверяет Git HTTP и веб-вход; Authelia не должна
      # перенаправлять команды git clone/pull/push на страницу авторизации.
      # Неизвестный внутренний адрес задаётся администратором после проверки.
      - domain: git.zsergey.ru
        service: gogs
        upstream: null
        access: git_https
        enabled: false
      # Внешние приложения подключать только после проверки авторизации.
      - domain: photos.zsergey.ru
        service: immich
        guest_vmid: 340
        port: 2283
        # Не включать без проверки связки Immich и мобильного приложения.
        access: app_auth
        enabled: false
      - domain: ha.zsergey.ru
        service: home-assistant
        guest_vmid: 100
        access: protected
        enabled: false
      - domain: ai.zsergey.ru
        service: open-webui
        access: protected
        enabled: false

  authelia:
    enabled: true
    image: authelia/authelia:4.39.28
    container_name: web-gateway-authelia
    internal_port: 9091
    public_url: https://auth.zsergey.ru
    operator_status:
      name: Authelia
      setup_path: /totp-setup
      setup_instructions:
        - Откройте ссылку на компьютере из домашней сети, пока не прошло 15 минут.
        - На телефоне откройте Google Authenticator, нажмите знак «+» и наведите камеру на квадратный рисунок.
        - Введите шесть цифр с телефона на странице и нажмите «Подтвердить».
        - Если вход с кодом из телефона уже работает, ничего делать не нужно.
      operator:
        username: admin
        password:
          source: guest_credential
          path: /var/lib/web-gateway/management/operator-admin.json
          users_file: /var/lib/web-gateway/authelia/users_database.yml
    config_file: /etc/web-gateway/authelia/configuration.yml
    users_file: /var/lib/web-gateway/authelia/users_database.yml
    data:
      host: /var/lib/web-gateway/authelia
      container: /data
    storage:
      type: sqlite
      container_path: /data/db.sqlite3
    initial_admin:
      username: admin
      email: admin@zsergey.ru  # Служебное поле Authelia; почтовый ящик не требуется
    totp_setup:
      # Первый фактор для admin, только домашняя сеть и готовое HTTPS.
      # Изменять уже зарегистрированные коды повторным deploy запрещено.
      username: admin
      url_path: /totp-setup
      qr_host: /var/lib/web-gateway/authelia/totp-setup/admin.png
      qr_container: /data/totp-setup/admin.png
      qr_caddy_root: /srv/totp-setup
    authentication:
      backend: file
      groups:
        - admins
        - family
        - guests
      password_hash: argon2id
      second_factor: totp
    oidc:
      enabled: true
      # Конкретные адреса возврата закрепляются вместе с ролью и версией клиента.
      clients:
        - immich

  portal:
    enabled: true
    public_url: https://home.zsergey.ru
    assets: /etc/web-gateway/portal
    socket: /var/lib/web-gateway/management/portal-socket/portal.sock
    authentication: authelia
    second_factor: true
    operator_status:
      name: Домашний сервер
      authentication: Authelia
    administration:
      path: /admin
      groups:
        - admins
      private_networks: true

  # Существующие данные Homarr сохраняются на mp0 для возможного отката.
  # Контейнер и его публичный маршрут больше не запускаются.

  management:
    # Обработчик Caddy/Authelia располагается только внутри сети Docker.
    public_access: false
    routes_state: /var/lib/web-gateway/management/routes.yaml
  secrets:
    provider: persistent-files
    # Ключи создаются однократно, затем восстанавливаются только с mp0.
    local_directory: /var/lib/web-gateway/secrets

persistence:
  backup_required:
    # Один каталог содержит все уникальные данные на подключении mp0:
    # SQLite Authelia, 2FA, сертификаты и изменения из административной панели.
    - /var/lib/web-gateway
  reproducible:
    - /opt/web-gateway/compose
    - /etc/web-gateway/caddy/Caddyfile
    - /etc/web-gateway/authelia/configuration.yml
  ephemeral:
    - docker-images
    - docker-build-cache

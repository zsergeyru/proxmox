schema_version: 1
guest_vmid: 109

system:
  distribution: debian
  version: "13"
  architecture: amd64
  required_packages:
    - ca-certificates
    - curl
    - iproute2
    - nftables
    - wireguard-tools

network_gateway:
  interfaces:
    wan: wan
    lan: lan

  forwarding:
    enabled: true

  adguard_home:
    enabled: true
    interface: lan
    domain: home.arpa
    dhcp:
      enabled: true
      range:
        start: 192.168.1.100
        end: 192.168.1.250
      lease_time: 24h
    upstream:
      host: 127.0.0.1
      port: 6053

  smartdns:
    enabled: true
    listen:
      host: 127.0.0.1
      port: 6053
    domain_sets:
      enabled: true

  routing:
    default: direct
    sources: []
    update:
      enabled: true
      interval: 6h
      keep_last_good: true
    targets:
      direct:
        type: wan
      zapret:
        type: nfqws2

  nfqws2:
    enabled: true
    target: zapret

  firewall:
    enabled: true
    direct_wan_nat: false

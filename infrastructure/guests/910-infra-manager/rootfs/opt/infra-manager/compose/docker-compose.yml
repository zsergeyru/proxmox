# Рабочий состав infra-manager без Semaphore. Управление через systemd в LXC.
services:
  runtime:
    build:
      context: .
      dockerfile: runtime-next/Dockerfile
      args:
        OPENTOFU_VERSION: ${OPENTOFU_VERSION}
        PACKER_IMAGE: ${PACKER_IMAGE}
    image: infra-runtime:${RUNTIME_VERSION}
    container_name: infra-runtime
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/infra-manager/ca:/etc/infra-manager/ca:ro
      - /mnt/pve-access/pve-host:/mnt/pve-access/pve-host:ro
      - /mnt/persistent-state/opentofu:/var/lib/infra-manager/opentofu
      - /mnt/persistent-state/locks:/var/lib/infra-manager/locks
      - /mnt/persistent-state/operations/activation:/run/infra-manager/activation
      - /mnt/persistent-state/physical-hosts:/var/lib/infra-manager/physical-hosts
      - /var/lib/infra-manager/bootstrap-repo:/var/lib/infra-manager/bootstrap-repo:ro
      - /run/infra-manager/secrets:/run/infra-manager/secrets:ro

  openbao:
    image: ghcr.io/openbao/openbao:${OPENBAO_VERSION}
    container_name: openbao
    restart: unless-stopped
    network_mode: host
    user: "0"
    command:
      - server
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_LOG_LEVEL: info
      BAO_SKIP_DROP_ROOT: "1"
      SKIP_CHOWN: "1"
    volumes:
      - /mnt/persistent-state/openbao:/openbao/file
      - /etc/infra-manager/openbao/tls:/openbao/tls:ro
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro

  web:
    profiles:
      - preview
    build:
      context: ./web
    image: infra-web:preview1
    container_name: infra-web
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    volumes:
      - /mnt/persistent-state/operations:/srv/operations:ro

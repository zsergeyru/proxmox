schema_version: 11
vmid: 910
name: infra-manager
description: Управляющий LXC для развёртывания и сопровождения инфраструктуры Proxmox
profile: debian-lxc-docker
pve_management: false

resources:
  cores: 2
  memory_mb: 2048
  swap_mb: 512
  disk_size_gb: 32

boot:
  order: 10
  startup_delay_seconds: 30

management:
  - ssh_identity
  - project_repo_read

schema_version: 1
guest_vmid: 910

system:
  distribution: debian
  version: "13"
  architecture: amd64

  required_packages:
    - ca-certificates
    - curl
    - git
    - gnupg
    - jq
    - openssh-client
    - openssl
    - python3
    - python3-yaml

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running

  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

  compose_file: rootfs/opt/infra-manager/compose/docker-compose.yml

  services:
    runtime:
      container_name: infra-runtime
      image: infra-runtime:v1
      base_image: semaphoreui/semaphore:v2.18.30
      restart: unless-stopped
      network_mode: host
      database: sqlite
      data_path: /var/lib/infra-manager/semaphore

      system_packages:
        - ca-certificates
        - curl
        - unzip
        - git
        - openssh-client
        - openssl
        - bash
        - python3
        - py3-pip

      tools:
        ansible: bundled-with-semaphore
        opentofu: "1.12.6"
        packer: "1.15.4"

      python_packages:
        proxmoxer: ">=2.2.0,<3"
        requests: ">=2.32,<3"
        PyYAML: "==6.0.2"
        jsonschema: "==4.25.1"

      mounts:
        - /mnt/persistent-state/semaphore:/var/lib/semaphore
        - /etc/infra-manager/ca:/etc/infra-manager/ca:ro
        - /mnt/persistent-state/ansible:/etc/infra-manager/ansible:ro
        - /mnt/pve-access/pve-host:/mnt/pve-access/pve-host:ro
        - /mnt/persistent-state/opentofu:/var/lib/infra-manager/opentofu
        - /run/infra-manager/secrets:/run/infra-manager/secrets:ro

    openbao:
      container_name: openbao
      image: ghcr.io/openbao/openbao:2.7.0
      restart: unless-stopped
      network_mode: host
      api_address: http://127.0.0.1:8200
      machine_api_port: 8202
      tls_path: /etc/infra-manager/openbao/tls
      data_path: /var/lib/persistent/openbao
      config_file: rootfs/opt/infra-manager/compose/openbao/openbao.hcl
      storage: raft
      auto_initialize: false

paths:
  configuration: /etc/infra-manager
  ca: /etc/infra-manager/ca
  ssh_client_ca: /etc/infra-manager/ca/ssh-client-ca.pub
  openbao_tls: /etc/infra-manager/openbao/tls
  ansible_identity: /etc/infra-manager/ansible
  pve_host_identity: /mnt/pve-access/pve-host
  data: /var/lib/infra-manager
  semaphore_data: /var/lib/infra-manager/semaphore
  semaphore_persistent_data: /mnt/persistent-state/semaphore
  opentofu_data: /var/lib/infra-manager/opentofu
  opentofu_persistent_state_dir: /mnt/persistent-state/opentofu/state
  openbao_data: /var/lib/persistent/openbao
  opentofu_state: /var/lib/infra-manager/opentofu/state/proxmox.tfstate
  compose: /opt/infra-manager/compose
  python_package: /usr/local/lib/infra-manager
  bootstrap_repository: /var/lib/infra-manager/bootstrap-repo
  log: /var/log/infra-manager/bootstrap.log

access_materialization:
  pve:
    staging_credential: /run/infra-manager/bootstrap-secrets/pve-api.env
    runtime_credential: /run/infra-manager/secrets/pve-api.env
    ca_source: /mnt/pve-access/ca/pve-root-ca.crt
    root_ssh_private_key: /mnt/pve-access/pve-host/root_ed25519
    root_ssh_known_hosts: /mnt/pve-access/pve-host/known_hosts

  github:
    staging_credential: /run/infra-manager/bootstrap-secrets/github_proxmox_repo_ed25519
    private_key: /run/infra-manager/secrets/github_proxmox_repo_ed25519
    known_hosts: /root/.ssh/github_known_hosts

  openbao_tls:
    source: /mnt/pve-access/openbao-tls
    target: /etc/infra-manager/openbao/tls

semaphore:
  project: Proxmox Infrastructure
  repository: proxmox

  views:
    - { title: Guests, position: 1 }
    - { title: Infrastructure, position: 2 }
    - { title: Security, position: 3 }

  objects:
    - GitHub project read-only
    - OpenTofu PVE
    - Infra Manager
    - OpenTofu Plan
    - Build Template 9000
    - Deploy Guest
    - Status Guest
    - Repair Guest
    - Test Guest
    - Sync Guest
    - Sync SSH Access

persistence:
  target_layout:
    implemented: true
    host_root: /mnt/bindmounts/infra-manager

    pve_only:
      host_path: /mnt/bindmounts/infra-manager/pve-only
      mounted_into_guest: false
      contains:
        - openbao-unseal-key
        - openbao-ssh-access-credentials
        - openbao-kv-access-credentials
        - openbao-tls-ca
        - recovery-github-deploy-key

    access:
      host_path: /mnt/bindmounts/infra-manager/access
      guest_path: /mnt/pve-access
      mode: ro
      contains:
        - pve-root-ssh-key
        - pve-known-hosts
        - pve-ca
        - openbao-tls-server

    state:
      host_path: /mnt/bindmounts/infra-manager/state
      guest_path: /mnt/persistent-state
      mode: rw
      contains:
        - openbao-raft
        - opentofu-state
        - semaphore-data
        - ansible-identity
      bindings:
        - { source: /mnt/persistent-state/ansible, target: /etc/infra-manager/ansible, owner: "1001", group: "0", mode: "0700" }
        - { source: /mnt/persistent-state/semaphore, target: /var/lib/infra-manager/semaphore, owner: "1001", group: "0", mode: "0770" }
        - { source: /mnt/persistent-state/opentofu, target: /var/lib/infra-manager/opentofu, owner: "1001", group: "0", mode: "0750" }
        - { source: /mnt/persistent-state/openbao, target: /var/lib/persistent/openbao, owner: root, group: root, mode: "0700" }

    guest_local:
      contains:
        - git-checkout
        - docker-images
        - compose-files
        - installed-python-code
        - caches

  backup_required:
    - /etc/infra-manager/ansible
    - /mnt/pve-access/pve-host
    - /var/lib/infra-manager/semaphore
    - /var/lib/infra-manager/opentofu/state
    - /var/lib/persistent/openbao

  reproducible:
    - /var/lib/infra-manager/bootstrap-repo
    - /opt/infra-manager/compose
    - docker-images

boundaries:
  member_of_managed_pool: false
  opentofu_manages_self: false
  application_workloads_allowed: false
  openbao_auto_initialize: false

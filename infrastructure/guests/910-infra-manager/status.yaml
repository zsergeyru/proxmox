schema_version: 1
guest_vmid: 910

title: "Состояние infra-manager"
short_ready_message: "infra-manager готов"
ready_message: "infra-manager полностью готов"

layout:
  separator: "="
  width: 60

checks:
  - type: runtime
    message: "Docker и infra-runtime работают"
  - type: portal
    message: "Homepage и его действия работают"
  - type: openbao
    message: "OpenBao запущен"
  - type: semaphore
    message: "Semaphore работает"
  - type: runtime_tools
    message: "OpenTofu, Ansible и Packer готовы"
  - type: pve_access
    message: "Доступ к PVE подтверждён"

data:

services:
  runtime:
    build:
      context: ./runtime
      args:
        SEMAPHORE_VERSION: ${SEMAPHORE_VERSION}
        OPENTOFU_VERSION: ${OPENTOFU_VERSION}
        PACKER_VERSION: ${PACKER_VERSION}
    image: infra-runtime:${RUNTIME_VERSION}
    container_name: infra-runtime
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/infra-manager/secrets/semaphore-server.env
    volumes:
      - /var/lib/infra-manager/semaphore:/var/lib/semaphore
      - /etc/infra-manager/ca:/etc/infra-manager/ca:ro
      - /etc/infra-manager/ansible:/etc/infra-manager/ansible:ro
      - /var/lib/infra-manager/opentofu:/var/lib/infra-manager/opentofu

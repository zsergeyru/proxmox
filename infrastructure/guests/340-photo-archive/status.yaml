schema_version: 2
guest_vmid: 340

checks:
  - type: docker
    container: immich_server
    message: "Immich запущен"
  - type: docker
    container: immich_postgres
    message: "База данных Immich запущена"
  - type: docker
    container: immich_redis
    message: "Очередь Immich запущена"
  - type: http
    url: "http://{address}:2283/api/server/ping"
    message: "Immich отвечает на запросы"
  - type: http
    url: "http://{address}:3001/api/healthcheck"
    message: "Домашняя страница отвечает на запросы"
  - type: docker
    container: immich_memories
    message: "Immich Memories Notify: служба запущена"
  - type: http
    url: "http://{address}:5000/health"
    message: "Immich Memories Notify: панель отвечает (http://{address}:5000)"
  - type: docker_image
    image: ghcr.io/immich-power-tools/immich-power-tools:latest
    message: "Immich Power Tools: образ установлен (запуск пока выключен)"
  - type: docker_image
    image: ghcr.io/timasoft/immich-analyze:main
    message: "Immich Analyze: образ установлен (ждёт настройки LM Studio)"

schema_version: 1
guest_vmid: 340

portal:
  local:
    enabled: true
    title: Фотоархив


system:
  distribution: debian
  version: "13"
  architecture: amd64
  required_packages:
    - ca-certificates
    - curl
    - python3

docker:
  source: docker-official-repository
  service:
    name: docker
    enabled: true
    state: running
  required_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

# Физические тома и размеры описаны в hosts/pve/storage.yaml.
# Гость объявляет только собственные каталоги и точки подключения.
# Ранее созданные тома не форматировать и не удалять.
pve_storage:
  mounts:
    - slot: mp0
      volume: photo_archive
      directory: data
      target: /srv/photo-archive
      read_only: false
    - slot: mp1
      volume: infra_state
      directory: 340-photo-archive
      target: /mnt/persistent-state
      read_only: false
    - slot: mp2
      volume: photo_archive
      directory: immich-media
      target: /srv/photo-archive-media
      read_only: false

photo_archive:
  application: immich
  mode: api-with-local-worker
  # Закреплена конкретная совместимая версия для сервера и обработчиков Windows.
  immich_version: v3.3.1
  web_port: 2283
  portal:
    name: Immich
    description: Фотографии, альбомы и поиск
    icon: mdi-image-multiple-#38bdf8
    scheme: http
    port: 2283
    targets:
      - local
      - home
    # Первоначальные пароли выводятся только при вызове через оболочку PVE.
    operator:
      accounts:
      - username: admin@zsergey.ru
        password:
          source: guest_json
          path: /mnt/persistent-state/secrets/immich-initial-users.json
          key: admin@zsergey.ru
      - username: mail@zsergey.ru
        password:
          source: guest_json
          path: /mnt/persistent-state/secrets/immich-initial-users.json
          key: mail@zsergey.ru
      - username: zsveta@elsoft35.ru
        password:
          source: guest_json
          path: /mnt/persistent-state/secrets/immich-initial-users.json
          key: zsveta@elsoft35.ru
  paths:
    root: /opt/photo-archive
    compose: /opt/photo-archive/compose
    compose_file: /opt/photo-archive/compose/docker-compose.yml
    configuration: /etc/photo-archive
    environment: /mnt/persistent-state/secrets/immich.env
    originals: /srv/photo-archive/originals
    uploads: /srv/photo-archive-media
    database: /mnt/persistent-state/postgres
  storage:
    required_external_mount: /srv/photo-archive
    required_state_mount: /mnt/persistent-state
    required_media_mount: /srv/photo-archive-media
    pve_state_source: /mnt/bindmounts/infra-state/340-photo-archive
    pve_data_source: /mnt/bindmounts/photo-archive/data
    pve_media_source: /mnt/bindmounts/photo-archive/immich-media
    originals_read_only: false
    allow_missing_mount: false
  # До настройки Windows обеспечиваем полноценную обработку на LXC.
  # При включении Windows API остаётся на 340, фоновые задания — на Windows.
  remote_worker:
    enabled: false
  workers:
    include: api,microservices
    windows_background_worker_required: false
  database:
    engine: postgresql
    vector_extension: vectorchord
    network_exposure: disabled
  queue:
    engine: redis
    network_exposure: disabled
  # Только при первом запуске; после этого изменения из веб-интерфейса сохраняются.
  initial_setup:
    admin:
      email: admin@zsergey.ru
      name: Администратор
    users:
      - email: mail@zsergey.ru
        name: Основной пользователь
      - email: zsveta@elsoft35.ru
        name: Семейный пользователь
    library:
      name: Семейный фотоархив
      import_path: /external/originals
    scan_cron: "0 * * * *"
    trash_days: 30
  # Подключать только после сопоставления всех существующих пользователей
  # с учётными записями Authelia; фотографии и права не переназначать.
  oauth:
    enabled: false
    provider_guest_vmid: 140
    issuer_url: https://auth.zsergey.ru
    client_id: immich
    public_url: https://photos.zsergey.ru
    mobile_redirect: app.immich:///oauth-callback
    auto_register: false
    keep_password_login: true

  external_library:
    enabled: true
    automatic_registration: true

  # Состав служб создаётся при deploy; небезопасные действия включаются отдельно.
  addons:
    memories:
      enabled: true
      image: ghcr.io/ismaildakrory/immich-memories-notify:latest
      web_port: 5000
    power_tools:
      enabled: false
      image: ghcr.io/immich-power-tools/immich-power-tools:latest
      web_port: 8001
    analyze:
      enabled: false
      image: ghcr.io/timasoft/immich-analyze:main

persistence:
  backup_required:
    - /mnt/persistent-state/postgres
    - /srv/photo-archive-media
    - /mnt/persistent-state/secrets/immich.env
    - /mnt/persistent-state/secrets/immich-memories.env
    - /mnt/persistent-state/secrets/immich-power-tools.env
    - /mnt/persistent-state/secrets/immich-analyze.env
    - /mnt/persistent-state/addons/memories
    - /mnt/persistent-state/addons/power-tools
    - /mnt/persistent-state/secrets/immich-initial-users.json
    - /mnt/persistent-state/initial-setup.done
    - /mnt/persistent-state/initial-settings.done
    - /srv/photo-archive
  reproducible:
    - /opt/photo-archive/compose
  ephemeral:
    - docker-images
    - docker-build-cache

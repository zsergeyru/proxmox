name: Patch sync trust boundary

on:
  push:
    branches: [feat-deploy-guest-v1]
    paths:
      - .github/patch-sync-trust-boundary.py
      - .github/workflows/patch-sync-trust-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-deploy-guest-v1
      - name: Patch bulk sync trust boundary
        run: |
          python .github/patch-sync-trust-boundary.py
          git diff --check
          python -m py_compile scripts/pve/sync-management-keys.py scripts/tests/test-sync-management-keys.py
          python scripts/tests/test-sync-management-keys.py
          git config user.name github-actions[bot]
          git config user.email 41898282+zsergeyru@users.noreply.github.com
          git add scripts/pve/sync-management-keys.py scripts/tests/test-sync-management-keys.py scripts/README.md docs/28-management-ssh-keys.md
          git commit -m "fix: запретить TOFU в bulk management sync"
          git push origin HEAD:feat-deploy-guest-v1

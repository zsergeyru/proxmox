name: Patch deploy final preflight

on:
  push:
    branches: [feat-deploy-guest-v1]
    paths:
      - .github/patch-deploy-preflight-final.py
      - .github/workflows/patch-deploy-preflight-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-deploy-guest-v1
      - name: Patch final deploy preflight
        run: |
          python .github/patch-deploy-preflight-final.py
          git diff --check
          python -m py_compile scripts/pve/deploy-guest.py scripts/tests/test-deploy-guest.py
          python scripts/tests/test-deploy-guest.py
          git config user.name github-actions[bot]
          git config user.email 41898282+zsergeyru@users.noreply.github.com
          git add scripts/pve/deploy-guest.py scripts/tests/test-deploy-guest.py docs/31-deploy-guest.md
          git commit -m "fix: блокировать non-running acceptance до мутаций"
          git push origin HEAD:feat-deploy-guest-v1

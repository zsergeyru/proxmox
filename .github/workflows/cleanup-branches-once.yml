name: One-time branch cleanup

on:
  push:
    branches:
      - infra-iac-redesign
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          failures=0
          branches=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            | jq -r '.[].name')

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              main|infra-iac-redesign)
                echo "KEEP $branch"
                ;;
              *)
                echo "DELETE $branch"
                if ! git push origin --delete "$branch"; then
                  echo "FAILED $branch" >&2
                  failures=1
                fi
                ;;
            esac
          done <<< "$branches"

          exit "$failures"

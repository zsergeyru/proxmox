name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: standardize-proximo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Proximo migration
        run: |
          cp scripts/standardize_proximo.py /tmp/standardize_proximo.py
          rm scripts/standardize_proximo.py
          python /tmp/standardize_proximo.py

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Check whitespace errors
        run: git diff --check

      - name: Show Proximo references
        run: git grep -n -E 'Proximo MCP|proximo@pve|proximo-proxmox' -- ':!archive/**' || true

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'docs: standardize Proximo MCP architecture'
            git push origin HEAD:standardize-proximo
          fi

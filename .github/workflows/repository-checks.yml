name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Standardize Proximo documentation
        if: github.ref_name == 'standardize-proximo'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # High-level documents: name the concrete MCP instead of a generic placeholder.
          for path in [
              'README.md',
              'docs/10-architecture.md',
              'guests/320-ai-control/README.md',
              'guests/320-ai-control/decisions/001-simple-management-model.md',
              'guests/320-ai-control/decisions/002-proxmox-permissions.md',
              'guests/320-ai-control/rootfs/opt/ai-control/agents/README.md',
              'guests/320-ai-control/rootfs/opt/ai-control/agents/hermes/README.md',
          ]:
              text = read(path)
              text = text.replace('Proxmox MCP', 'Proximo MCP')
              write(path, text)

          # PVE initialization: use the same identity as the real AI-control bootstrap
          # and document that the Proximo token secret is injected into 301, not retained on PVE.
          path = 'docs/20-pve-initialization.md'
          text = read(path)
          text = text.replace('PVE identity ai-agent@pve!proximo', 'PVE identity proximo@pve!ai-control')
          block = '''# 7. Proxmox identities — принято

Для host deployer и Proximo используются разные service identities и разные credentials.

## Host deployer

```text
user:  deployer@pve
token: deployer@pve!host-deploy
```

Актор — PVE-side `deploy-guest`.

Назначение:

- deterministic deployment по `guest.yaml`;
- create/clone VM/LXC;
- поддерживаемая конфигурация CPU/RAM/disk/network/Cloud-Init;
- помещение обычных объектов в `managed`;
- lifecycle, необходимый для deploy/verification;
- работа без `301` и без AI.

## Proximo MCP

```text
user:  proximo@pve
token: proximo@pve!ai-control
```

Актор — Proximo (`proximo-proxmox`), которым пользуются разрешённые AI-агенты в `301-ai-control`.

Назначение:

- runtime lifecycle разрешённых guests;
- snapshots/backups, если разрешены ACL policy;
- diagnostics/status;
- дальнейшее управление из AI control plane.

Naming:

```text
proximo@pve
→ отдельная service identity канонического Proximo MCP

!ai-control
→ credential целевого AI control plane
```

Если в будущем Proximo будет заменён другим MCP, для нового backend создаётся отдельная identity/credential вместо неявного переиспользования существующей.

## Почему две identity

Разделение принято, потому что:

- host recovery/deploy не зависит от AI credential;
- понятнее audit trail;
- credentials можно независимо отозвать/ротировать;
- права host deployer и runtime Proximo не обязаны совпадать.

Не использовать ради удобства:

```text
root@pam API token
PVEAdmin на /
```

Точная матрица ACL должна соответствовать отдельной принятой политике проекта.

---

# 8. Хранение secrets на PVE — принято

PVE постоянно хранит только credentials, необходимые самому host-side bootstrap/deployer. Secret токена Proximo — отдельное исключение: Proxmox показывает его только при создании, после чего `create-ai-control-vm.sh` сразу передаёт credential внутрь `301` через QEMU Guest Agent и не оставляет отдельный plaintext-файл с этим secret на PVE.

Целевой host-side каталог:

```text
/etc/proxmox-deployer/
├── secrets/
│   └── host-deploy.token
└── ssh/
    ├── github_proxmox_repo_ed25519
    └── github_proxmox_repo_ed25519.pub
```

Здесь:

```text
host-deploy.token
→ secret deployer@pve!host-deploy

github_proxmox_repo_ed25519
→ private read-only GitHub Deploy Key PVE
```

Credential Proximo внутри `301`:

```text
/etc/ai-control/secrets/proximo-pve-token
→ token id + secret для proximo@pve!ai-control

/etc/ai-control/proximo/proximo.env
→ параметры подключения Proximo к PVE
```

Правила:

- каталог host-side secrets доступен только root и явно нужному runtime;
- token files и private SSH keys защищаются строгими правами;
- перед созданием secret files использовать безопасный `umask 077`;
- secrets не выводить повторно в обычные logs;
- secrets не сохранять в `state.json`;
- secrets никогда не помещать в Git;
- существующий secret `host-deploy` переиспользуется, если token существует;
- secret `proximo@pve!ai-control` не восстанавливается из PVE API: если `301` утрачен вместе с credential, требуется явная ротация Proximo token;
- ротация Proximo не должна происходить молча и выполняется только явным recovery/rotation действием.

`pvedeploy` получает доступ только к host-side credential `deployer@pve!host-deploy`. Backup `301` считается чувствительным, потому что содержит Proximo token и другие private credentials AI control plane.
'''
          pattern = r'# 7\. Proxmox identities — принято\n.*?\n---\n\n# 9\. Linux user `pvedeploy` — принято'
          replacement = block + '\n---\n\n# 9. Linux user `pvedeploy` — принято'
          text2, n = re.subn(pattern, replacement, text, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one identity/secrets block in {path}, got {n}')
          write(path, text2)

          # PVE filesystem layout: host does not keep the Proximo token plaintext.
          path = 'docs/21-pve-filesystem-layout.md'
          text = read(path)
          section1 = '''## 1. Постоянная конфигурация deployer

```text
/etc/proxmox-deployer/
├── config.yaml
├── ssh/
│   ├── github_proxmox_repo_ed25519
│   ├── github_proxmox_repo_ed25519.pub
│   ├── config
│   └── known_hosts
└── secrets/
    └── host-deploy.token
```

Назначение:

```text
config.yaml
→ настройки PVE deployer: repo, branch, пути, имена identities/tokens, pool managed и другие постоянные параметры

ssh/github_proxmox_repo_ed25519
→ private read-only GitHub Deploy Key для zsergeyru/proxmox

ssh/github_proxmox_repo_ed25519.pub
→ public часть того же key

ssh/config
→ SSH alias/config для GitHub transport

ssh/known_hosts
→ проверенный host key GitHub

secrets/host-deploy.token
→ secret deployer@pve!host-deploy
```

Proximo использует отдельную identity `proximo@pve!ai-control`, но её secret после создания передаётся внутрь `301` и хранится там в `/etc/ai-control/secrets/proximo-pve-token`. Отдельный plaintext-файл с Proximo token на PVE не является частью канонической файловой структуры.

Правила:

- secrets и private key никогда не попадают в Git;
- перед созданием secret files использовать `umask 077`;
- private key и token files имеют mode `0600` либо более узкие права, требуемые runtime;
- каталоги `ssh/` и `secrets/` имеют mode `0700`;
- `pvedeploy` получает доступ только к secret, нужному host-side deploy runtime;
- потеря Proximo credential вместе с `301` требует явной ротации token, потому что PVE API не позволяет повторно получить его secret.
'''
          pattern = r'## 1\. Постоянная конфигурация deployer\n.*?\n## 2\. Private Git checkout и deployer runtime'
          text2, n = re.subn(pattern, section1 + '\n## 2. Private Git checkout и deployer runtime', text, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one section 1 in {path}, got {n}')
          text2 = text2.replace(
              '│           ├── host-deploy.token\n│           └── ai-agent-proximo.token\n',
              '│           └── host-deploy.token\n'
          )
          text2 = text2.replace(
              'Такой backup является чувствительным объектом и должен быть защищён не хуже самих secrets.',
              'Proximo token из `301` в этот host-side backup не входит; он защищается резервным копированием самого AI control plane либо явной ротацией credential. Такой backup является чувствительным объектом и должен быть защищён не хуже самих secrets.'
          )
          write(path, text2)

          # ADR 003: both current 320 and target 301 use Proximo.
          write('guests/320-ai-control/decisions/003-proxmox-mcp.md', '''# ADR 003 — Proximo MCP для AI control

## Статус

**Актуально.**

- `320-ai-control`: уже переведён на **Proximo** (`proximo-proxmox`).
- `301-ai-control`: целевой канонический MCP — **Proximo** (`proximo-proxmox`).

Таким образом, для текущего bootstrap control plane и будущего основного control plane используется один и тот же Proxmox MCP.

## Контекст

`ai-control` должен уметь создавать и сопровождать управляемые VM/LXC, но не должен получать обычный административный доступ к самому PVE host.

Нужны:

- Proxmox API вместо shell на гипервизоре;
- privilege-separated API token;
- видимая/проверяемая граница разрешений;
- guest provisioning/configuration, включая Cloud-Init;
- snapshots/backups/lifecycle;
- возможность уменьшить MCP tool surface;
- audit trail для изменений.

## Каноническое решение

Для `320-ai-control` и `301-ai-control` используется:

```text
Proximo / proximo-proxmox
```

Для целевого `301` установка выполняется zero-day bootstrap-скриптом из публичного `zsergeyru/proxmox-bootstrap`.

Целевая локальная схема `301`:

```text
Hermes
  │ stdio MCP
  ▼
Proximo
  │ HTTPS Proxmox API
  ▼
PVE
```

Отдельный HTTP MCP daemon для одного локального Hermes в `301` не нужен. Если позже появится реальная необходимость в общем сетевом MCP для нескольких клиентов, это оформляется отдельным решением.

## Management identity

Каноническая PVE identity Proximo:

```text
user:       proximo@pve
token:      proximo@pve!ai-control
privsep:    true
pool:       managed
```

Token secret:

- создаётся локально на PVE;
- показывается Proxmox только при создании;
- напрямую передаётся в `301` через QEMU Guest Agent;
- хранится внутри `301` в `/etc/ai-control/secrets/proximo-pve-token`;
- не записывается в Git;
- не хранится отдельным plaintext-файлом на PVE;
- при утрате требует явной ротации.

При privilege separation эффективные права являются пересечением прав пользователя и token, поэтому необходимые ACL выдаются обоим.

## Tool surface

По умолчанию используется:

```text
PROXIMO_TOOLSETS=pve.guests
```

Цель — не публиковать агенту без необходимости MCP domains для host network, SDN, access/IAM и других административных плоскостей.

Tool filtering — дополнительная защита. Hard boundary задаётся Proxmox ACL/token.

## Разрешённая зона

AI control должен уметь:

- видеть PVE/node/guest state в пределах необходимых audit-прав;
- использовать template `9000` как источник Full Clone;
- создавать новые гости сразу в `managed` resource pool;
- изменять CPU/RAM/disk/network/Cloud-Init управляемых гостей;
- start/stop/reboot управляемых гостей;
- делать snapshots/backups;
- выполнять guest-level diagnostics, которые разрешены выданными правами.

Template `9000` остаётся защищённым и не должен быть доступен на изменение/удаление.

`301-ai-control` не входит в обычную self-managed write-зону: control plane не должен случайно удалить или остановить самого себя. Для `320` действует тот же принцип до его вывода из эксплуатации.

## Запрещённая зона

Обычный AI control workflow не получает прав на:

```text
PVE physical NIC / vmbr* / host routes
storage definitions
users / groups / realms
roles / ACL / API tokens
Datacenter/host firewall
SDN
PVE repositories
certificates / ACME
reboot/shutdown PVE host
shell/exec на PVE host
```

Наличие соответствующих tools в Proximo не означает, что token должен уметь их выполнить.

Полная проектная матрица прав остаётся в [`002-proxmox-permissions.md`](./002-proxmox-permissions.md).

## Проверка границы

После установки/обновления Proximo обязательно выполняется:

```bash
proximo doctor
```

Нужно убедиться, что ожидаемые guest capabilities находятся в `can`, а host/IAM опасные действия остаются в `cannot`.

Для `301` результат сохраняется в `/opt/ai-control/state/proximo-doctor.json`.

Live-test целевой цепочки:

```text
Hermes + Proximo
→ Full Clone 9000 в managed pool
→ protection=0
→ Cloud-Init ops + ai_control_ed25519.pub
→ first start
→ QEMU Agent
→ SSH ops из 301
```

## Разделение функций

```text
Proximo
→ уровень виртуализации и guest-level Proxmox operations

Ansible на 311-dev-services
→ повторяемая конфигурация гостевых ОС и приложений

прямой SSH из ai-control
→ bootstrap, диагностика, аварийные и разовые действия
```

Proximo не заменяет Ansible как штатный повторяемый deploy-механизм внутри ОС.

## Главный принцип

> Proximo (`proximo-proxmox`) — единственный канонический Proxmox MCP для `320-ai-control` и `301-ai-control`; реальная граница его власти задаётся privilege-separated Proxmox token и ACL, а не возможностями самого MCP.
''')


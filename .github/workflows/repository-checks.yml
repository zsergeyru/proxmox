name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Validate template pipeline assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import yaml

          asset_dir = Path("templates/debian13")
          base_path = asset_dir / "cloud-init.yaml"
          bootstrap_path = asset_dir / "template-bootstrap.sh"
          finalize_path = asset_dir / "template-finalize.sh"

          data = yaml.safe_load(base_path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("templates/debian13/cloud-init.yaml is not a mapping")

          replacement = {
              "/usr/local/sbin/template-bootstrap": bootstrap_path.read_text(encoding="utf-8"),
              "/usr/local/sbin/template-finalize": finalize_path.read_text(encoding="utf-8"),
          }
          found = set()
          for item in data.get("write_files", []):
              if isinstance(item, dict) and item.get("path") in replacement:
                  item["content"] = replacement[item["path"]]
                  found.add(item["path"])

          if found != set(replacement):
              raise SystemExit(f"Cloud-Init guest script entries mismatch: found={sorted(found)}")

          rendered = "#cloud-config\n" + yaml.safe_dump(
              data,
              allow_unicode=True,
              sort_keys=False,
              default_flow_style=False,
          )
          parsed = yaml.safe_load(rendered)
          if not isinstance(parsed, dict):
              raise SystemExit("Rendered Cloud-Init is not a mapping")

          with tempfile.TemporaryDirectory() as temp_dir:
              for source in (bootstrap_path, finalize_path):
                  temp_path = Path(temp_dir) / source.name
                  temp_path.write_text(source.read_text(encoding="utf-8"), encoding="utf-8")
                  subprocess.run(["bash", "-n", str(temp_path)], check=True)

          if Path("scripts/pve/create-template.sh").exists():
              raise SystemExit("Legacy standalone scripts/pve/create-template.sh must not exist")

          print("Template Cloud-Init assets and guest scripts are valid")
          PY

      - name: Check whitespace errors
        run: git diff --check

name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck cloud-init jq unzip
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Compile Python tooling
        run: |
          python -m py_compile \
            scripts/guests/guest_config.py \
            scripts/validate_repo.py \
            scripts/guests/render-opentofu-input.py \
            scripts/infra-manager/infra_manager/__init__.py \
            scripts/infra-manager/infra_manager/__main__.py \
            scripts/infra-manager/infra_manager/cli.py \
            scripts/infra-manager/infra_manager/common.py \
            scripts/infra-manager/infra_manager/setup.py \
            scripts/infra-manager/infra_manager/semaphore.py \
            scripts/infra-manager/infra_manager/pve.py \
            scripts/infra-manager/infra_manager/status.py \
            scripts/tests/test-infra-manager-python.py \
            scripts/tests/test-opentofu-input.py \
            scripts/tests/test-guest-bootstrap.py \

      - name: Run infra-manager Python foundation checks
        run: python scripts/tests/test-infra-manager-python.py

      - name: Run OpenTofu input contract checks
        run: python scripts/tests/test-opentofu-input.py

      - name: Run Guest Bootstrap v1 contract checks
        run: python scripts/tests/test-guest-bootstrap.py

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: ShellCheck
        run: |
          mapfile -d '' files < <(find . -type f -name '*.sh' -print0)
          # SC2034 is intentionally excluded: lib/*.sh are sourced modules and
          # shared globals declared in 00-common.sh are consumed across files.
          shellcheck -S warning -e SC2034 "${files[@]}"

      - name: Check PVE bootstrap helper host dependencies
        run: |
          helper=scripts/infra-manager/pve-bootstrap-access.sh
          grep -q 'command -v perl' "$helper"
          grep -q 'MJSON::PP' "$helper"
          if grep -Eq 'command -v jq|(^|[[:space:]|;])jq([[:space:]]|$)' "$helper"; then
            echo "PVE bootstrap helper must not depend on jq on the host"
            exit 1
          fi
          if grep -Eq 'apt(-get)?[[:space:]]+install' "$helper"; then
            echo "PVE bootstrap helper must not install packages on the host"
            exit 1
          fi

      - name: Run infra-manager contract checks
        run: bash scripts/tests/test-setup-contract.sh

      - name: Reject obsolete direct PVE deployment path
        run: |
          test ! -e scripts/pve
          test ! -e scripts/tests/test-deploy-guest.py
          test ! -e scripts/tests/test-sync-management-keys.py

      - name: Set up Packer
        run: |
          version=1.15.4
          archive="packer_${version}_linux_amd64.zip"
          curl -fsSLo "/tmp/${archive}" "https://releases.hashicorp.com/packer/${version}/${archive}"
          curl -fsSLo /tmp/packer_SHA256SUMS "https://releases.hashicorp.com/packer/${version}/packer_${version}_SHA256SUMS"
          grep "  ${archive}$" /tmp/packer_SHA256SUMS > /tmp/packer.check
          (cd /tmp && sha256sum -c packer.check)
          sudo unzip -oq "/tmp/${archive}" -d /usr/local/bin
          packer version

      - name: Validate Packer 9000
        run: |
          packer fmt -check -recursive packer
          packer init packer/9000
          checksum="sha512:$(printf '0%.0s' {1..128})"
          packer validate \
            -var='proxmox_url=https://pve.invalid:8006/api2/json' \
            -var='proxmox_username=root@pam!infra-manager' \
            -var='proxmox_token=dummy-token-secret' \
            -var='iso_url=https://example.invalid/debian-13-amd64-netinst.iso' \
            -var="iso_checksum=${checksum}" \
            -var='build_password=BuildPassword1234567890' \
            packer/9000

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Validate OpenTofu configuration
        run: |
          tofu -chdir=opentofu fmt -check
          tofu -chdir=opentofu init -backend=false -lockfile=readonly
          tofu -chdir=opentofu validate


      - name: Validate infra-manager Compose
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("guests/910-infra-manager/compose/docker-compose.yml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          services = data.get("services", {})
          if set(services) != {"runtime"}:
              raise SystemExit(f"Unexpected services: {sorted(services)}")
          if services["runtime"].get("image") != "infra-runtime:${RUNTIME_VERSION}":
              raise SystemExit("infra-runtime image must use pinned runtime version variable")
          if services["runtime"].get("container_name") != "infra-runtime":
              raise SystemExit("infra-runtime must use the canonical container name")
          if "build" not in services["runtime"]:
              raise SystemExit("infra-runtime must use the project Dockerfile")
          if services["runtime"].get("network_mode") != "host":
              raise SystemExit("infra-runtime must use host network")
          PY

      - name: Build infra-runtime image
        run: |
          docker build \
            --build-arg SEMAPHORE_VERSION=v2.18.30 \
            --build-arg OPENTOFU_VERSION=1.12.6 \
            --build-arg PACKER_VERSION=1.15.4 \
            -t infra-runtime:test \
            guests/910-infra-manager/compose/runtime
          docker run --rm infra-runtime:test tofu version
          docker run --rm infra-runtime:test packer version
          docker run --rm --entrypoint python3 infra-runtime:test -c 'import proxmoxer'

      - name: Verify malformed guest directory is rejected
        run: |
          mkdir -p guests/not-a-valid-guest-directory
          cp guests/100-haos/guest.yaml guests/not-a-valid-guest-directory/guest.yaml
          if python scripts/validate_repo.py > /tmp/invalid-layout.out 2>&1; then
            cat /tmp/invalid-layout.out
            echo "Validator unexpectedly accepted malformed guest directory" >&2
            exit 1
          fi
          grep -q 'каталог гостя должен иметь имя' /tmp/invalid-layout.out
          rm -rf guests/not-a-valid-guest-directory
          python scripts/validate_repo.py

      - name: Check whitespace errors
        run: git diff --check

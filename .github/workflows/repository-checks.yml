name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck cloud-init jq unzip
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1 ruff==0.16.8 Jinja2==3.1.6 argon2-cffi==25.1.0 passlib==1.7.4 cryptography==46.0.3

      - name: Resolve infra-manager guest
        run: |
          python - <<'PY'
          import ipaddress
          import os
          from pathlib import Path
          import yaml

          matches = []
          for manifest in sorted(Path("infrastructure/guests").glob("*/guest.yaml")):
              data = yaml.safe_load(manifest.read_text(encoding="utf-8"))
              if isinstance(data, dict) and data.get("role") == "infra-manager":
                  matches.append((manifest, data))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one guest with role: infra-manager")

          manifest, guest = matches[0]
          vmid = guest.get("vmid")
          address = guest.get("network", {}).get("ipv4")
          if not isinstance(vmid, int) or vmid <= 0:
              raise SystemExit("infra-manager has invalid vmid")
          try:
              address = str(ipaddress.ip_address(address))
          except ValueError as exc:
              raise SystemExit("infra-manager requires a static IPv4 for CI") from exc

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"INFRA_MANAGER_DIR={manifest.parent.as_posix()}\n")
              env.write(f"INFRA_MANAGER_VMID={vmid}\n")
              env.write(f"INFRA_MANAGER_ADDRESS={address}\n")
          PY

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Run AI Control contract checks
        run: python scripts/tests/test-ai-control-contract.py

      - name: Run Network Gateway contract checks
        run: python scripts/tests/test-network-gateway-contract.py

      - name: Run AI services contract checks
        run: python scripts/tests/test-ai-services-contract.py

      - name: Check Python with Ruff
        run: ruff check scripts automation/ansible/roles/photo_archive/files/initial_setup.py automation/ansible/roles/photo_archive/files/setup_addons.py automation/ansible/roles/gogs/files/prepare_data.py

      - name: Compile Python tooling
        run: python -m compileall -q scripts

      - name: Check common physical storage schema
        run: python scripts/tests/test-storage-catalog.py

      - name: Check physical host descriptions
        run: python scripts/tests/test-physical-hosts.py
      - name: Check persistent physical-host state migration
        run: python scripts/tests/test-physical-host-state.py

      - name: Check physical storage and operator commands
        run: python scripts/tests/test-physical-storage.py

      - name: Check safe NAS storage plan
        run: python scripts/tests/test-physical-storage-plan.py

      - name: Check confirmed NAS storage preparation
        run: python scripts/tests/test-physical-storage-prepare.py

      - name: Check first NAS SSH access
        run: python scripts/tests/test-physical-bootstrap.py

      - name: Check Debian, OMV and NAS volume guards
        run: python scripts/tests/test-physical-nas-system.py

      - name: Check NAS SMB and ZFS safety
        run: python scripts/tests/test-physical-nas-services.py

      - name: Check common users, NAS rights and Authelia groups
        run: python scripts/tests/test-physical-nas-users.py


      - name: Check infra-manager startup without jsonschema
        run: python scripts/tests/test-host-python-deps.py
      - name: Check PVE automatic Python dependency recovery
        run: python scripts/tests/test-pve-manager-deps.py
      - name: Run infra-manager Python foundation checks
        run: python scripts/tests/test-infra-manager-python.py

      - name: Run runtime network diagnostics checks
        run: python scripts/tests/test-runtime-downloads.py

      - name: Run bootstrap host Python checks
        run: python scripts/tests/test-bootstrap-host.py

      - name: Run recovery host checks
        run: python scripts/tests/test-recovery-host.py

      - name: Run PVE operator command checks
        run: python scripts/tests/test-manager-host.py

      - name: Run common guest SSH session checks
        run: python scripts/tests/test-guest-ssh.py

      - name: Run guest deployment checks
        run: python scripts/tests/test-guest-deploy.py

      - name: Run guest operation checks
        run: python scripts/tests/test-guest-operations.py

      - name: Check protected persistent operation store
        run: python scripts/tests/test-operation-store.py

      - name: Check manager-owned backup preflight
        run: python scripts/tests/test-managed-backup.py

      - name: Check staged runtime without Semaphore
        run: python scripts/tests/test-standalone-runtime.py

      - name: Check infra-web readonly preview
        run: python scripts/tests/test-infra-web.py

      - name: Check authenticated infra-web and restricted system socket
        run: |
          python scripts/tests/test-infra-web-admin.py
          python scripts/tests/test-admin-socket.py

      - name: Check managed backup and standalone runtime transition
        run: python scripts/tests/test-manager-backup-transition.py

      - name: Check safe Sync does not update software
        run: python scripts/tests/test-safe-sync.py

      - name: Check Git guest catalog and Caddy integration
        run: python scripts/tests/test-homarr-catalog.py

      - name: Run unified guest status checks
        run: python scripts/tests/test-guest-status.py

      - name: Run guest portal checks
        run: python scripts/tests/test-portal.py

      - name: Run PVE host access checks
        run: python scripts/tests/test-pve-host.py

      - name: Run persistent guest storage checks
        run: python scripts/tests/test-guest-storage.py

      - name: Verify confirmed Proxmox backup SSD preparation
        run: python scripts/tests/test-pve-backup-ssd.py

      - name: Verify native Proxmox NAS backup connection
        run: python scripts/tests/test-pve-backup-nas.py
      - name: Check Web Gateway configuration templates
        run: python scripts/tests/test-web-gateway.py

      - name: Check Web Gateway initial identity and secrets
        run: python scripts/tests/test-web-gateway-initialize.py

      - name: Check safe Google Authenticator TOTP setup
        run: python scripts/tests/test-web-gateway-totp.py
      - name: Check user management for web gateway
        run: python scripts/tests/test-web-gateway-users.py
      - name: Check Caddy route change and rollback on web gateway
        run: python scripts/tests/test-web-gateway-routes.py
      - name: Check internal administration gateway
        run: python scripts/tests/test-web-gateway-admin.py

      - name: Check secure static pages and two-factor access
        run: python scripts/tests/test-web-gateway-portal.py
      - name: Validate actual Caddy gateway syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from jinja2 import Environment, FileSystemLoader, StrictUndefined

          provision = yaml.safe_load(Path("infrastructure/guests/140-web-gateway/provision.yaml").read_text())
          templates = Path("automation/ansible/roles/web_gateway/templates")
          output = Path("/tmp/portal-caddy-140")
          output.mkdir(exist_ok=True)
          env = Environment(loader=FileSystemLoader(str(templates)), undefined=StrictUndefined,
                            keep_trailing_newline=True)
          env.filters["bool"] = bool
          # Проверяем также включённый маршрут Git HTTPS, не только выключенный шаблон.
          routes = [dict(route, upstream="http://192.168.1.55:3000", enabled=True)
                    if route["domain"] == "git.zsergey.ru" else route
                    for route in provision["web_gateway"]["caddy"]["routes"]]
          routes.extend([
              {"domain": "printer.zsergey.ru", "service": "custom",
               "name": "3D принтер", "upstream": "http://192.168.1.50:7125",
               "enabled": True, "access": "protected"},
              {"domain": "nas.zsergey.ru", "service": "custom",
               "name": "Файлы", "upstream": "http://192.168.1.20:80",
               "enabled": True, "access": "private"},
          ])
          values = {"provision": provision, "web_gateway_routes": routes}
          for source, dest in (("Caddyfile.j2", "Caddyfile"),
                               ("sites.generated.caddy.j2", "sites.generated.caddy")):
              (output / dest).write_text(env.get_template(source).render(**values), encoding="utf-8")
          PY
          docker run --rm --entrypoint caddy -v /tmp/portal-caddy-140:/etc/caddy:ro \
            caddy:2.11.7 validate --config /etc/caddy/Caddyfile
      - name: Check encrypted backup preparation for web gateway
        run: python scripts/tests/test-web-gateway-backup.py

      - name: Check PVE and infra-manager encrypted backup safeguards
        run: python scripts/tests/test-backup-pve.py

      - name: Check disk and recovery backup preparations
        run: python scripts/tests/test-backup-pve-setup.py

      - name: Enforce root project rules and unified operator interface
        run: python scripts/tests/test-project-interface.py
      - name: Check Immich login safety in web gateway
        run: python scripts/tests/test-web-gateway-immich.py

      - name: Check Gogs guest and safe migration
        run: python scripts/tests/test-gogs-contract.py

      - name: Check Immich Compose template
        run: python scripts/tests/test-photo-archive-compose.py

      - name: Check Immich initial setup
        run: python scripts/tests/test-photo-archive-initial-setup.py

      - name: Run PVE lifecycle checks
        run: python scripts/tests/test-pve-lifecycle.py

      - name: Run administrative command wrapper checks
        run: python scripts/tests/test-python-command.py

      - name: Run OpenBao checks
        run: python scripts/tests/test-openbao.py

      - name: Run OpenBao OTP client checks
        run: python scripts/tests/test-openbao-otp-client.py

      - name: Run OpenBao OTP verifier checks
        run: python scripts/tests/test-openbao-otp-verify.py

      - name: Run OpenBao OTP SSH client checks
        run: python scripts/tests/test-openbao-ssh.py

      - name: Run status checks
        run: python scripts/tests/test-status.py

      - name: Run template checks
        run: python scripts/tests/test-template.py

      - name: Run OpenTofu input contract checks
        run: python scripts/tests/test-opentofu-input.py

      - name: Run guest resolver contract checks
        run: python scripts/tests/test-guest-resolver.py

      - name: Run access contract checks
        run: python scripts/tests/test-access-contract.py

      - name: Validate all Ansible YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path("automation/ansible")
          files = sorted([
              *root.rglob("*.yml"),
              *root.rglob("*.yaml"),
          ])
          if not files:
              raise SystemExit("Ansible YAML files not found")
          for path in files:
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  raise SystemExit(f"{path}: invalid YAML: {exc}") from exc
          print(f"Validated {len(files)} Ansible YAML files")
          PY

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: ShellCheck
        run: |
          mapfile -d '' files < <(find . -type f -name '*.sh' -print0)
          # SC2034 is intentionally excluded: lib/*.sh are sourced modules and
          # shared globals declared in 00-common.sh are consumed across files.
          shellcheck -S warning -e SC2034 "${files[@]}"

      - name: Run infra-manager standalone and recovery contract
        run: python scripts/tests/test-manager-standalone-contract.py

      - name: Run infra-manager OpenBao contract
        run: bash scripts/tests/test-infra-manager-openbao-contract.sh


      - name: Run infra-manager SSH contract
        run: bash scripts/tests/test-infra-manager-ssh-contract.sh

      - name: Enforce common Ansible path for infra-manager
        run: bash scripts/tests/test-bootstrap-architecture.sh

      - name: Reject obsolete direct PVE deployment path
        run: |
          test ! -e scripts/pve
          test ! -e scripts/tests/test-deploy-guest.py
          test ! -e scripts/tests/test-sync-management-keys.py

      - name: Set up Packer
        run: |
          set -Eeuo pipefail
          packer_image="$(python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          provision = yaml.safe_load((Path(os.environ["INFRA_MANAGER_DIR"]) / "provision.yaml").read_text())
          print(provision["docker"]["services"]["runtime"]["tools"]["packer_image"])
          PY
          )"
          docker pull "$packer_image"
          temporary_container="$(docker create "$packer_image")"
          trap 'docker rm -f "$temporary_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$temporary_container:/bin/packer" /tmp/packer
          sudo install -m 0755 /tmp/packer /usr/local/bin/packer
          packer version

      - name: Validate Packer 9000
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          packer fmt -check -recursive automation/packer
          packer init automation/packer/9000
          checksum="sha512:$(printf '0%.0s' {1..128})"
          packer validate \
            -var='proxmox_url=https://pve.invalid:8006/api2/json' \
            -var='proxmox_username=root@pam!infra-manager' \
            -var='proxmox_token=dummy-token-secret' \
            -var='iso_url=https://example.invalid/debian-13-amd64-netinst.iso' \
            -var="iso_checksum=${checksum}" \
            -var='build_password=BuildPassword1234567890' \
            automation/packer/9000

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Validate OpenTofu configuration
        run: |
          tofu -chdir=automation/opentofu fmt -check
          tofu -chdir=automation/opentofu init -backend=false -lockfile=readonly
          tofu -chdir=automation/opentofu validate


      - name: Validate infra-manager Compose
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path(os.environ["INFRA_MANAGER_DIR"]) / "rootfs/opt/infra-manager/compose/docker-compose.yml"
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          services = data.get("services", {})
          if set(services) != {"runtime", "openbao", "web"}:
              raise SystemExit(f"Unexpected services: {sorted(services)}")
          if services["web"].get("container_name") != "infra-web" or services["web"].get("read_only") is not True:
              raise SystemExit("Authenticated infra-web must use protected readonly container")
          if "profiles" in services["web"]:
              raise SystemExit("Protected administrative infra-web must start in default Compose")
          if services["runtime"].get("image") != "infra-runtime:${RUNTIME_VERSION}":
              raise SystemExit("infra-runtime image must use pinned runtime version variable")
          if services["runtime"].get("container_name") != "infra-runtime":
              raise SystemExit("infra-runtime must use the canonical container name")
          if "build" not in services["runtime"]:
              raise SystemExit("infra-runtime must use the project Dockerfile")
          if services["runtime"].get("network_mode") != "host":
              raise SystemExit("infra-runtime must use host network")
          if services["openbao"].get("image") != "ghcr.io/openbao/openbao:${OPENBAO_VERSION}":
              raise SystemExit("OpenBao image must use pinned version variable")
          if services["openbao"].get("container_name") != "openbao":
              raise SystemExit("OpenBao must use the canonical container name")
          if services["openbao"].get("network_mode") != "host":
              raise SystemExit("OpenBao must use host network")
          if services["openbao"].get("command") != ["server"]:
              raise SystemExit("OpenBao must not use the default dev mode")
          PY

      - name: Validate empty OpenBao server
        run: |
          set -Eeuo pipefail
          data_dir="$(mktemp -d)"
          tls_dir="$(mktemp -d)"
          chmod 0755 "$tls_dir"
          sudo ip addr add "$INFRA_MANAGER_ADDRESS/32" dev lo
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj "/CN=OpenBao test CA" \
            -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt"
          openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -subj "/CN=infra-manager" \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr"
          printf 'subjectAltName=IP:%s,DNS:infra-manager\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' \
            "$INFRA_MANAGER_ADDRESS" > "$tls_dir/server.ext"
          openssl x509 -req -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial \
            -days 1 -sha256 -extfile "$tls_dir/server.ext" \
            -out "$tls_dir/server.crt"
          chmod 0600 "$tls_dir/server.key"

          cleanup() {
            docker rm -f openbao-test >/dev/null 2>&1 || true
            sudo ip addr del "$INFRA_MANAGER_ADDRESS/32" dev lo >/dev/null 2>&1 || true
            sudo rm -rf "$data_dir" "$tls_dir"
          }
          trap cleanup EXIT

          docker run -d             --name openbao-test             --network host             --user 0             -e BAO_SKIP_DROP_ROOT=1             -e SKIP_CHOWN=1             -v "$PWD/$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro"             -v "$data_dir:/openbao/file"             -v "$tls_dir:/openbao/tls:ro"             ghcr.io/openbao/openbao:2.7.0             server

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8200/v1/sys/seal-status >/tmp/openbao-status.json; then
              break
            fi
            sleep 1
          done

          if [[ ! -s /tmp/openbao-status.json ]]; then
            docker logs openbao-test
            exit 1
          fi

          jq -e '
            .initialized == false
            and .sealed == true
            and .storage_type == "raft"
          ' /tmp/openbao-status.json

          curl --noproxy '*' --cacert "$tls_dir/ca.crt" -fsS \
            https://$INFRA_MANAGER_ADDRESS:8202/v1/sys/seal-status \
            | jq -e '.initialized == false and .sealed == true'

          docker rm -f openbao-test >/dev/null

          compat_config="$(mktemp)"
          cp "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose/openbao/openbao.hcl" "$compat_config"
          chmod 0644 "$compat_config"
          python3 - "$compat_config" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          needle = "  tls_disable     = true\n"
          if text.count(needle) != 1:
              raise SystemExit("Не найден однозначный listener OpenBao")
          if 'address         = "127.0.0.1:8200"' not in text:
              raise SystemExit("Совместимый generate-root разрешён только на loopback")
          text = text.replace(
              needle,
              "  disable_unauthed_generate_root_endpoints = false\n" + needle,
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          docker run -d \
            --name openbao-test \
            --network host \
            --user 0 \
            -e BAO_SKIP_DROP_ROOT=1 \
            -e SKIP_CHOWN=1 \
            -v "$compat_config:/openbao/config/openbao.hcl:ro" \
            -v "$data_dir:/openbao/file" \
            -v "$tls_dir:/openbao/tls:ro" \
            ghcr.io/openbao/openbao:2.7.0 \
            server

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8200/v1/sys/seal-status >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! docker inspect -f '{{.State.Running}}' openbao-test | grep -qx true; then
            echo "===== OpenBao compatibility startup logs ====="
            docker logs openbao-test || true
            exit 1
          fi

          python3 scripts/tests/test-openbao-live.py
          rm -f "$compat_config"

      - name: Build infra-web preview image
        run: |
          docker build -t infra-web:ci "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose/web"
          docker run --rm --entrypoint python3 infra-web:ci -m py_compile /opt/infra-web/app.py /opt/infra-web/admin.py

      - name: Build independent infra-runtime without Semaphore
        run: |
          docker build \
            --build-arg OPENTOFU_VERSION=1.12.6 \
            --build-arg PACKER_IMAGE="$(python3 -c 'import os,yaml; from pathlib import Path; p=Path(os.environ["INFRA_MANAGER_DIR"])/"provision.yaml"; print(yaml.safe_load(p.read_text())["docker"]["services"]["runtime"]["tools"]["packer_image"])')" \
            -f "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose/runtime-next/Dockerfile" \
            -t infra-runtime:next \
            "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose"
          docker run --rm infra-runtime:next tofu version
          docker run --rm infra-runtime:next packer version
          docker run --rm infra-runtime:next ansible --version
          docker run --rm --entrypoint python3 infra-runtime:next -c 'import proxmoxer, yaml, jsonschema'
          if docker run --rm --entrypoint sh infra-runtime:next -c 'test -e /etc/semaphore'; then
            echo 'Next runtime unexpectedly includes Semaphore'
            exit 1
          fi

      - name: Build Semaphore-free runtime candidate
        run: |
          docker build \
            -f "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose/runtime-next/Dockerfile" \
            --build-arg OPENTOFU_VERSION=1.12.6 \
            --build-arg PACKER_IMAGE="$(python3 -c 'import os,yaml; from pathlib import Path; p=Path(os.environ["INFRA_MANAGER_DIR"])/"provision.yaml"; print(yaml.safe_load(p.read_text())["docker"]["services"]["runtime"]["tools"]["packer_image"])')" \
            -t infra-runtime:standalone-test \
            "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose"
          docker run --rm --entrypoint tofu infra-runtime:standalone-test version
          docker run --rm --entrypoint ansible infra-runtime:standalone-test --version
          docker run --rm --entrypoint packer infra-runtime:standalone-test version
          docker run --rm --entrypoint python3 infra-runtime:standalone-test -c 'import proxmoxer, yaml, jsonschema'

      - name: Build infra-runtime image
        run: |
          docker build \
            --build-arg SEMAPHORE_VERSION=v2.18.30 \
            --build-arg OPENTOFU_VERSION=1.12.6 \
            --build-arg PACKER_IMAGE="$(python3 -c 'import os,yaml; from pathlib import Path; p=Path(os.environ["INFRA_MANAGER_DIR"])/"provision.yaml"; print(yaml.safe_load(p.read_text())["docker"]["services"]["runtime"]["tools"]["packer_image"])')" \
            -t infra-runtime:test \
            "$INFRA_MANAGER_DIR/rootfs/opt/infra-manager/compose/runtime"
          docker run --rm infra-runtime:test tofu version
          docker run --rm --entrypoint packer infra-runtime:test version
          docker run --rm infra-runtime:test packer version
          docker run --rm --entrypoint python3 infra-runtime:test -c 'import proxmoxer'
          docker run --rm --entrypoint python3 infra-runtime:test -c 'import yaml, jsonschema'
          # SSH-конфигурация должна быть доступна штатному пользователю Semaphore.
          docker run --rm --user 1001:0 --entrypoint sh infra-runtime:test -c \
            'test "$(stat -c %a /etc/ssh/ssh_config.d/99-infra-manager.conf)" = 644'
          docker run --rm --user 1001:0 --entrypoint ssh infra-runtime:test \
            -G github.com >/dev/null

      - name: Verify real Semaphore startup in infra-runtime
        run: |
          set -Eeuo pipefail
          trap 'docker rm -f infra-runtime-smoke >/dev/null 2>&1 || true' EXIT

          # Временная БД, тестовый пароль. Данные настоящего 910 не подключаются.
          docker run -d \
            --name infra-runtime-smoke \
            --publish 127.0.0.1:3000:3000 \
            --tmpfs /var/lib/semaphore:rw,uid=1001,gid=0,mode=0770 \
            -e SEMAPHORE_DB_DIALECT=sqlite \
            -e SEMAPHORE_DB_HOST=/var/lib/semaphore/semaphore.sqlite \
            -e SEMAPHORE_ADMIN=admin \
            -e SEMAPHORE_ADMIN_PASSWORD=CI-Only-Temporary-Password \
            -e SEMAPHORE_ADMIN_NAME=Admin \
            -e SEMAPHORE_ADMIN_EMAIL=admin@localhost \
            -e SEMAPHORE_ACCESS_KEY_ENCRYPTION="$(openssl rand -hex 16)" \
            infra-runtime:test

          if [ "$(docker inspect -f '{{.Config.User}}' infra-runtime-smoke)" != "1001:0" ]; then
            echo "[ОШИБКА] Semaphore должен запускаться без root, uid=1001" >&2
            exit 1
          fi
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/ping >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' infra-runtime-smoke)" != "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "[ОШИБКА] Semaphore не открыл /api/ping на порту 3000" >&2
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' infra-runtime-smoke
            docker logs --tail 40 infra-runtime-smoke 2>&1
            exit 1
          fi

          docker exec infra-runtime-smoke sh -c 'test ! -e /etc/semaphore/requirements.txt'
          if docker logs infra-runtime-smoke 2>&1 | grep -Fq 'Installing additional python dependencies'; then
            echo "[ОШИБКА] Semaphore пытается переустановить Python-зависимости при запуске" >&2
            exit 1
          fi
          echo "[ОК] Semaphore запущен от uid 1001; порт 3000 отвечает"

      - name: Build bootstrap-runner image
        run: |
          docker build \
            --build-arg OPENTOFU_VERSION=1.12.6 \
            -t bootstrap-runtime:test \
            infrastructure/bootstrap-runner/runtime
          docker run --rm bootstrap-runtime:test tofu version
          docker run --rm bootstrap-runtime:test ansible --version
          docker run --rm bootstrap-runtime:test python3 -c 'import yaml, jsonschema, requests'
          guest_dir="${INFRA_MANAGER_DIR##*/}"
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            bootstrap-runtime:test \
            ansible-playbook --syntax-check \
            -i localhost, \
            -e "guest=$guest_dir" \
            automation/ansible/playbooks/configure-guest.yml

      - name: Verify malformed guest directory is rejected
        run: |
          mkdir -p infrastructure/guests/not-a-valid-guest-directory
          cp infrastructure/guests/100-haos/guest.yaml infrastructure/guests/not-a-valid-guest-directory/guest.yaml
          if python scripts/validate_repo.py > /tmp/invalid-layout.out 2>&1; then
            cat /tmp/invalid-layout.out
            echo "Validator unexpectedly accepted malformed guest directory" >&2
            exit 1
          fi
          grep -q 'каталог гостя должен иметь имя' /tmp/invalid-layout.out
          rm -rf infrastructure/guests/not-a-valid-guest-directory
          python scripts/validate_repo.py

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git show --check --format= "$CURRENT_SHA"
          else
            git diff --check "$BEFORE_SHA..$CURRENT_SHA"
          fi

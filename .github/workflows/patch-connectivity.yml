name: Patch connectivity check

on:
  push:
    branches: [fix-lightweight-github-connectivity-check]
    paths: [.github/workflows/patch-connectivity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lightweight-github-connectivity-check
      - name: Patch PVE connectivity check
        run: |
          python - <<'PY'
          from pathlib import Path

          system = Path('scripts/pve/setup/lib/20-system.sh')
          text = system.read_text(encoding='utf-8')
          old = 'curl -fsS --connect-timeout 10 --max-time 20 -o /dev/null https://github.com/ \\\n        || die "Нет HTTPS-доступа к GitHub"'
          new = 'curl -fsSI --connect-timeout 10 --max-time 20 -o /dev/null https://github.com/ \\\n        || die "Нет HTTPS-доступа к GitHub"'
          if old not in text:
              raise SystemExit('expected GitHub connectivity check not found')
          system.write_text(text.replace(old, new, 1), encoding='utf-8')

          common = Path('scripts/pve/setup/lib/00-common.sh')
          ctext = common.read_text(encoding='utf-8')
          if 'PVE_CONFIGURATION_VERSION=25' not in ctext:
              raise SystemExit('PVE Configuration version 25 not found')
          common.write_text(ctext.replace('PVE_CONFIGURATION_VERSION=25', 'PVE_CONFIGURATION_VERSION=26', 1), encoding='utf-8')

          test = Path('scripts/pve/setup/tests/test-deploy-runtime-contract.sh')
          ttext = test.read_text(encoding='utf-8')
          if 'PVE_CONFIGURATION_VERSION=25' not in ttext or 'must be 25' not in ttext:
              raise SystemExit('runtime contract version 25 expectation not found')
          ttext = ttext.replace('PVE_CONFIGURATION_VERSION=25', 'PVE_CONFIGURATION_VERSION=26', 1)
          ttext = ttext.replace('PVE_CONFIGURATION_VERSION must be 25', 'PVE_CONFIGURATION_VERSION must be 26', 1)
          test.write_text(ttext, encoding='utf-8')
          PY
          git diff --check
          bash -n scripts/pve/setup/lib/20-system.sh
          bash -n scripts/pve/setup/lib/00-common.sh
          bash -n scripts/pve/setup/tests/test-deploy-runtime-contract.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pve/setup/lib/20-system.sh scripts/pve/setup/lib/00-common.sh scripts/pve/setup/tests/test-deploy-runtime-contract.sh
          git commit -m "fix: облегчить проверку HTTPS GitHub"
          git push origin HEAD:fix-lightweight-github-connectivity-check

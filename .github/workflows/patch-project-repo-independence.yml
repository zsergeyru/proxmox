name: Patch project repo independence

on:
  push:
    branches: [feat-deploy-guest-v1]
    paths:
      - .github/patch-project-repo-independence.py
      - .github/workflows/patch-project-repo-independence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-deploy-guest-v1
      - name: Patch Project Git READ handler
        run: |
          python .github/patch-project-repo-independence.py
          git diff --check
          python -m py_compile scripts/pve/deploy-guest.py scripts/tests/test-deploy-guest.py
          python scripts/tests/test-deploy-guest.py
          git config user.name github-actions[bot]
          git config user.email 41898282+zsergeyru@users.noreply.github.com
          git add scripts/pve/deploy-guest.py scripts/tests/test-deploy-guest.py docs/31-deploy-guest.md docs/33-guest-bootstrap-and-provisioning.md
          git commit -m "fix: отделить Project Git credential от Git capability"
          git push origin HEAD:feat-deploy-guest-v1

name: Patch sync safe directory

on:
  push:
    branches: [fix-sync-safe-directory]
    paths: [.github/workflows/patch-sync-safe-directory.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-sync-safe-directory
      - name: Patch sync runtime Git trust
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/pve/sync-management-keys.py')
          text = source.read_text(encoding='utf-8')
          old = 'proc = run_command(["git", "-C", str(ROOT), "rev-parse", "HEAD"])'
          new = 'proc = run_command(["git", "-c", f"safe.directory={ROOT}", "-C", str(ROOT), "rev-parse", "HEAD"])'
          if old not in text:
              raise SystemExit('expected git_revision command not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tooling_test = Path('scripts/pve/setup/tests/test-sync-management-keys-tooling.sh')
          ttext = tooling_test.read_text(encoding='utf-8')
          marker = '''grep -Fq 'management-ssh' "$SOURCE" \\
    || fail "runtime must discover management-ssh participants"\n'''
          addition = marker + '''grep -Fq 'safe.directory={ROOT}' "$SOURCE" \\
    || fail "runtime Git revision check must trust only the canonical root-owned checkout locally"\n'''
          if marker not in ttext:
              raise SystemExit('tooling test insertion marker not found')
          tooling_test.write_text(ttext.replace(marker, addition, 1), encoding='utf-8')

          common = Path('scripts/pve/setup/lib/00-common.sh')
          ctext = common.read_text(encoding='utf-8')
          if 'PVE_CONFIGURATION_VERSION=26' not in ctext:
              raise SystemExit('PVE Configuration version 26 not found')
          common.write_text(ctext.replace('PVE_CONFIGURATION_VERSION=26', 'PVE_CONFIGURATION_VERSION=27', 1), encoding='utf-8')

          contract = Path('scripts/pve/setup/tests/test-deploy-runtime-contract.sh')
          dtext = contract.read_text(encoding='utf-8')
          if 'PVE_CONFIGURATION_VERSION=26' not in dtext or 'must be 26' not in dtext:
              raise SystemExit('runtime contract version 26 expectation not found')
          dtext = dtext.replace('PVE_CONFIGURATION_VERSION=26', 'PVE_CONFIGURATION_VERSION=27', 1)
          dtext = dtext.replace('PVE_CONFIGURATION_VERSION must be 26', 'PVE_CONFIGURATION_VERSION must be 27', 1)
          contract.write_text(dtext, encoding='utf-8')
          PY
          git diff --check
          python -m py_compile scripts/pve/sync-management-keys.py
          bash -n scripts/pve/setup/tests/test-sync-management-keys-tooling.sh
          bash -n scripts/pve/setup/tests/test-deploy-runtime-contract.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pve/sync-management-keys.py scripts/pve/setup/tests/test-sync-management-keys-tooling.sh scripts/pve/setup/lib/00-common.sh scripts/pve/setup/tests/test-deploy-runtime-contract.sh
          git commit -m "fix: разрешить canonical checkout для sync runtime"
          git push origin HEAD:fix-sync-safe-directory

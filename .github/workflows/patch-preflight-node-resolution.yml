name: Patch preflight node resolution

on:
  push:
    branches: [fix-preflight-node-resolution-v29]
    paths:
      - .github/patch-preflight-node-resolution.py
      - .github/workflows/patch-preflight-node-resolution.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-preflight-node-resolution-v29
      - name: Patch node resolution preflight
        run: |
          python .github/patch-preflight-node-resolution.py
          git diff --check
          bash -n scripts/pve/setup/lib/10-preflight.sh
          bash -n scripts/pve/setup/tests/test-deploy-runtime-contract.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pve/setup/lib/00-common.sh scripts/pve/setup/lib/10-preflight.sh scripts/pve/setup/tests/test-deploy-runtime-contract.sh
          git commit -m "fix: проверять hostname PVE на локальный адрес"
          git push origin HEAD:fix-preflight-node-resolution-v29

---
# Syntax-only fixture for CI. NEVER execute this playbook: it imports the
# isolated disk writer and one-shot controller-state commit for validation.
# No production ansible-playbook entrypoint references this file.
- name: Проверить синтаксис изолированных ролей без исполнения
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Проверить Ansible-предпроверку HDD
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: prepare-preflight.yml

    - name: Проверить незаписывающую подготовку к явно разрешённому пересозданию
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: prepare-recreate-preflight.yml

    - name: Проверить одноразовый журнал HDD
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: prepare-journal.yml

    - name: Проверить синтаксис отключённой записи ext4/ZFS
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: prepare-write.yml

    - name: Проверить сверку ранее созданных HDD
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: prepare-recover-inspect.yml

    - name: Проверить наблюдаемое состояние контроллера
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: persist-verified.yml

    - name: Проверить аудиторский этап OMV
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-omv-audit.yml

    - name: Проверить создание объектов OMV
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-omv-register.yml

    - name: Проверить применение fstab
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-omv-activate.yml

    - name: Проверить финальную идентичность
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-omv-verify.yml

    - name: Проверить список наблюдаемых дисков
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-observed-identity.yml

    - name: Проверить порядок единого восстановления
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-recover-complete.yml

    - name: Проверить порядок отключённого первого создания
      ansible.builtin.import_role:
        name: nas
        tasks_from: prepare-create-complete.yml

    - name: Проверить универсальный генератор плана HDD
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: plan.yml

    - name: Проверить назначение роли по serial
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: plan-assign.yml

    - name: Проверить независимое принятие существующих ext4/ZFS
      ansible.builtin.import_role:
        name: nas
        tasks_from: adopt-storage.yml

    - name: Проверить безопасную регистрацию существующих томов OMV
      ansible.builtin.import_role:
        name: nas
        tasks_from: adopt-omv.yml

    - name: Проверить однократную фиксацию проверенных томов в 910
      ansible.builtin.import_role:
        name: physical_storage
        tasks_from: persist-adopted.yml

    - name: Проверить согласованное первое создание пустых HDD
      ansible.builtin.import_role:
        name: nas
        tasks_from: initialize-blank.yml
